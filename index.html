"tema":"MAPA 055 - Orientação temporal","subtema":"Ordenação cronológica por intervalos","dificuldade":"facil","enunciado":"Uma sequência de três etapas começou às 8h. A etapa A durou 35 minutos. A etapa B começou imediatamente após A e durou 50 minutos. A etapa C começou 15 minutos após o término de B. Em que horário começou a etapa C?","alternativas":{"A":"9h40","B":"9h25","C":"9h30","D":"9h55"},"gabarito":"A","comentario":"A termina às 8h35. B começa nesse instante e dura 50 minutos, terminando às 9h25. Como C começa 15 minutos depois, seu início ocorre às 9h40.","referencia":"Composição de intervalos temporais","tags":["raciocinio_logico","cronologia"]},{"id":"RAC052","area":"Raciocínio Lógico","tema":"MAPA 056 - Formação de conceitos","subtema":"Identificação de regra definidora","dificuldade":"dificil","enunciado":"Considere a classe K formada por números naturais maiores que 10, menores que 40 e divisíveis por 6. Os números 12, 18, 24 e 30 pertencem a K. Qual outro número também pertence a K?","alternativas":{"A":"6","B":"32","C":"40","D":"36"},"gabarito":"D","comentario":"Para pertencer a K, o número deve ser maior que 10, menor que 40 e divisível por 6. O número 6 falha no limite inferior; 32 não é divisível por 6; 40 não é menor que 40. Já 36 satisfaz as três condições.","referencia":"Formação de conceito por propriedades necessárias","tags":["raciocinio_logico","formacao_de_conceitos"]},{"id":"RAC053","area":"Raciocínio Lógico","tema":"MAPA 056 - Formação de conceitos","subtema":"Generalização de propriedade comum","dificuldade":"intermediaria","enunciado":"Observe os pares (2,8), (3,27), (4,64) e (5,125). Qual par segue a mesma regra?","alternativas":{"A":"(6,36)","B":"(7,49)","C":"(6,216)","D":"(8,256)"},"gabarito":"C","comentario":"Nos pares dados, o segundo número é o cubo do primeiro: 2³=8, 3³=27, 4³=64, 5³=125. Para 6, temos 6³=216. Portanto, (6,216) segue a mesma regra.","referencia":"Indução de regra a partir de exemplos","tags":["raciocinio_logico","conceito_por_padrao"]},{"id":"RAC054","area":"Raciocínio Lógico","tema":"MAPA 056 - Formação de conceitos","subtema":"Condição necessária para pertencimento","dificuldade":"intermediaria","enunciado":"Uma categoria é definida pelos objetos que possuem simultaneamente as propriedades P, Q e R. Um objeto X possui P e R, mas não possui Q. O que se conclui?","alternativas":{"A":"X pertence à categoria.","B":"X não pertence à categoria.","C":"X pertence à categoria se possuir outra propriedade S.","D":"Não é possível concluir nada sobre o pertencimento de X."},"gabarito":"B","comentario":"Como a definição exige simultaneamente P, Q e R, a ausência de qualquer uma delas exclui o objeto. X não possui Q; logo, não satisfaz a condição necessária de pertencimento.","referencia":"Conjunção de propriedades definidoras","tags":["raciocinio_logico","propriedades_necessarias"]},{"id":"RAC055","area":"Raciocínio Lógico","tema":"MAPA 056 - Formação de conceitos","subtema":"Regra de transformação conceitual","dificuldade":"dificil","enunciado":"Em certo sistema, um número é chamado de 'duplo-ajustado' quando o dobro dele, menos 3, resulta em um múltiplo de 5. Qual número é duplo-ajustado?","alternativas":{"A":"3","B":"5","C":"8","D":"4"},"gabarito":"D","comentario":"Testando: para 4, 2×4−3=5, que é múltiplo de 5. Para 3, resulta 3; para 5, resulta 7; para 8, resulta 13. Assim, somente 4 satisfaz a definição.","referencia":"Aplicação de definição operacional","tags":["raciocinio_logico","definicao_operacional"]},{"id":"RAC056","area":"Raciocínio Lógico","tema":"MAPA 057 - Discriminação e classificação de elementos","subtema":"Classificação por propriedade composta","dificuldade":"dificil","enunciado":"Os números 14, 22, 26 e 34 formam um grupo porque todos podem ser escritos como duas vezes um número primo ímpar. Qual número abaixo NÃO pertence a esse mesmo grupo?","alternativas":{"A":"38","B":"46","C":"58","D":"50"},"gabarito":"D","comentario":"38=2×19, 46=2×23 e 58=2×29, e 19, 23 e 29 são primos ímpares. Já 50=2×25, e 25 não é primo. Portanto 50 não pertence ao grupo.","referencia":"Classificação numérica; números primos; fatoração","tags":["raciocinio_logico","classificacao_composta"]},{"id":"RAC057","area":"Raciocínio Lógico","tema":"MAPA 057 - Discriminação e classificação de elementos","subtema":"Classificação por número de divisores","dificuldade":"facil","enunciado":"Qual número pertence ao grupo dos números primos?","alternativas":{"A":"21","B":"27","C":"29","D":"35"},"gabarito":"C","comentario":"29 possui exatamente dois divisores positivos: 1 e 29, portanto é primo. Já 21=3×7, 27=3³ e 35=5×7 são compostos.","referencia":"Classificação de números naturais","tags":["raciocinio_logico","numeros_primos"]},{"id":"RAC058","area":"Raciocínio Lógico","tema":"MAPA 057 - Discriminação e classificação de elementos","subtema":"Discriminação de regra algébrica","dificuldade":"dificil","enunciado":"Nos pares (2,10), (3,18), (4,28) e (5,40), o segundo número é obtido multiplicando o primeiro por três unidades a mais que ele. Qual par NÃO obedece a essa regra?","alternativas":{"A":"(6,54)","B":"(7,70)","C":"(9,99)","D":"(8,88)"},"gabarito":"C","comentario":"A regra é y=n(n+3). Para 6: 6×9=54; para 7: 7×10=70; para 8: 8×11=88. Para 9, o valor esperado seria 9×12=108, e não 99. Logo, (9,99) é o discrepante.","referencia":"Padrões algébricos e classificação","tags":["raciocinio_logico","padrao_algebrico"]},{"id":"RAC059","area":"Raciocínio Lógico","tema":"MAPA 057 - Discriminação e classificação de elementos","subtema":"Classificação por propriedades simultâneas","dificuldade":"intermediaria","enunciado":"Um objeto pertence à classe Z se for vermelho, circular e pequeno. Qual descrição corresponde a um elemento de Z?","alternativas":{"A":"vermelho, circular e pequeno","B":"vermelho, quadrado e pequeno","C":"azul, circular e pequeno","D":"vermelho, circular e grande"},"gabarito":"A","comentario":"A definição da classe exige as três propriedades ao mesmo tempo. Apenas o objeto vermelho, circular e pequeno satisfaz todas elas.","referencia":"Classificação por conjunção de atributos","tags":["raciocinio_logico","classificacao_por_atributos"]},{"id":"RAC060","area":"Raciocínio Lógico","tema":"MAPA 058 - Operações com conjuntos","subtema":"União e interseção de dois conjuntos","dificuldade":"intermediaria","enunciado":"Em um grupo de 50 pessoas, 32 gostam de café, 27 gostam de chá e 15 gostam de ambos. Quantas gostam de pelo menos uma das duas bebidas?","alternativas":{"A":"35","B":"44","C":"47","D":"59"},"gabarito":"B","comentario":"Usamos |C∪T| = |C| + |T| − |C∩T|. Assim, 32 + 27 − 15 = 44. A interseção é subtraída uma vez porque foi contada nos dois grupos.","referencia":"Princípio da inclusão-exclusão para dois conjuntos","tags":["raciocinio_logico","uniao_e_intersecao"]},{"id":"RAC061","area":"Raciocínio Lógico","tema":"MAPA 058 - Operações com conjuntos","subtema":"Inclusão-exclusão com três conjuntos","dificuldade":"intermediaria","enunciado":"Em uma turma de 80 pessoas, 45 estudam A, 38 estudam B e 30 estudam C. Há 20 que estudam A e B, 15 que estudam A e C, 12 que estudam B e C e 8 que estudam as três matérias. Quantas estudam pelo menos uma das três?","alternativas":{"A":"66","B":"74","C":"72","D":"82"},"gabarito":"B","comentario":"Pelo princípio da inclusão-exclusão: 45+38+30−20−15−12+8 = 74. As interseções de dois conjuntos são subtraídas e a interseção tripla é adicionada de volta.","referencia":"Inclusão-exclusão para três conjuntos","tags":["raciocinio_logico","tres_conjuntos"]},{"id":"RAC062","area":"Raciocínio Lógico","tema":"MAPA 058 - Operações com conjuntos","subtema":"Complemento da união de três conjuntos","dificuldade":"dificil","enunciado":"Em um universo de 150 pessoas, 80 pertencem ao conjunto A, 70 ao conjunto B e 55 ao conjunto C. As interseções têm 35 pessoas em A∩B, 25 em A∩C, 20 em B∩C e 10 em A∩B∩C. Quantas pessoas não pertencem a nenhum dos três conjuntos?","alternativas":{"A":"15","B":"20","C":"25","D":"30"},"gabarito":"A","comentario":"Pela inclusão-exclusão, |A∪B∪C|=80+70+55−35−25−20+10=135. Como o universo tem 150 pessoas, fora dos três conjuntos há 150−135=15.","referencia":"Inclusão-exclusão; complemento de conjuntos","tags":["raciocinio_logico","complemento_de_tres_conjuntos"]},{"id":"RAC063","area":"Raciocínio Lógico","tema":"MAPA 058 - Operações com conjuntos","subtema":"Número de subconjuntos","dificuldade":"intermediaria","enunciado":"Um conjunto possui 6 elementos distintos. Quantos subconjuntos próprios ele possui, considerando que o próprio conjunto não é subconjunto próprio de si mesmo?","alternativas":{"A":"32","B":"63","C":"64","D":"62"},"gabarito":"B","comentario":"Um conjunto com 6 elementos tem 2⁶ = 64 subconjuntos ao todo, incluindo o conjunto vazio e o próprio conjunto. Excluindo apenas o próprio conjunto, restam 64 − 1 = 63 subconjuntos próprios.","referencia":"Contagem de subconjuntos","tags":["raciocinio_logico","subconjuntos"]},{"id":"RAC064","area":"Raciocínio Lógico","tema":"MAPA 058 - Operações com conjuntos","subtema":"Elementos em exatamente um de dois conjuntos","dificuldade":"intermediaria","enunciado":"Em um grupo, 28 pessoas pertencem ao conjunto A, 22 ao conjunto B e 10 pertencem a ambos. Quantas pertencem a exatamente um dos dois conjuntos?","alternativas":{"A":"30","B":"20","C":"40","D":"50"},"gabarito":"A","comentario":"Somente em A: 28−10=18. Somente em B: 22−10=12. Exatamente um dos conjuntos: 18+12=30.","referencia":"Interseção e diferença de conjuntos","tags":["raciocinio_logico","exatamente_um_conjunto"]},{"id":"RAC065","area":"Raciocínio Lógico","tema":"MAPA 059 - Problemas aritméticos de raciocínio lógico","subtema":"Compra com preço unitário","dificuldade":"facil","enunciado":"Cinco cadernos iguais e três canetas iguais custam juntos R$ 94,00. Cada caderno custa R$ 14,00. Quanto custa cada caneta?","alternativas":{"A":"R$ 8,00","B":"R$ 6,00","C":"R$ 10,00","D":"R$ 12,00"},"gabarito":"A","comentario":"Cinco cadernos custam 5×14 = R$ 70,00. Sobram 94−70 = R$ 24,00 para três canetas. Cada uma custa 24/3 = R$ 8,00.","referencia":"Operações aritméticas e equação simples","tags":["raciocinio_logico","problema_de_compra"]},{"id":"RAC066","area":"Raciocínio Lógico","tema":"MAPA 059 - Problemas aritméticos de raciocínio lógico","subtema":"Partilha proporcional com transferência percentual","dificuldade":"dificil","enunciado":"Uma quantia de R$ 1.960,00 é dividida entre três pessoas na razão 2:3:5. Depois da divisão, a pessoa que recebeu 5 partes transfere 20% do próprio valor para a pessoa que recebeu 2 partes. Com quanto fica, ao final, a pessoa que inicialmente recebeu 2 partes?","alternativas":{"A":"R$ 490,00","B":"R$ 588,00","C":"R$ 686,00","D":"R$ 784,00"},"gabarito":"B","comentario":"A soma das partes é 10, então cada parte vale 1.960/10=196. A pessoa com 2 partes recebe inicialmente 392; a pessoa com 5 partes recebe 980. Vinte por cento de 980 é 196. Após a transferência, a primeira fica com 392+196=R$ 588,00.","referencia":"Razão; proporção; porcentagem","tags":["raciocinio_logico","partilha_com_transferencia"]},{"id":"RAC067","area":"Raciocínio Lógico","tema":"MAPA 059 - Problemas aritméticos de raciocínio lógico","subtema":"Distribuição com resto","dificuldade":"intermediaria","enunciado":"Uma caixa contém certa quantidade de fichas. Ao distribuí-las igualmente entre 7 pessoas, sobram 3 fichas. Ao todo há mais de 40 e menos de 50 fichas. Quantas fichas há?","alternativas":{"A":"42","B":"46","C":"49","D":"45"},"gabarito":"D","comentario":"Procuramos um número entre 41 e 49 que deixe resto 3 na divisão por 7. 42 é múltiplo de 7; logo 42+3=45 satisfaz a condição. Portanto há 45 fichas.","referencia":"Divisão euclidiana e resto","tags":["raciocinio_logico","resto_da_divisao"]},{"id":"RAC068","area":"Raciocínio Lógico","tema":"MAPA 059 - Problemas aritméticos de raciocínio lógico","subtema":"Velocidade média em percurso uniforme","dificuldade":"intermediaria","enunciado":"Um veículo percorre 180 km em 3 horas, mantendo velocidade constante. Quanto tempo levará para percorrer 300 km na mesma velocidade?","alternativas":{"A":"4 horas","B":"5 horas e 30 minutos","C":"6 horas","D":"5 horas"},"gabarito":"D","comentario":"A velocidade é 180/3 = 60 km/h. Para percorrer 300 km: 300/60 = 5 horas.","referencia":"Razão entre distância, velocidade e tempo","tags":["raciocinio_logico","velocidade"]},{"id":"RAC069","area":"Raciocínio Lógico","tema":"MAPA 059 - Problemas aritméticos de raciocínio lógico","subtema":"Desconto e acréscimo sucessivos","dificuldade":"facil","enunciado":"Um produto de R$ 200,00 recebe desconto de 15% e, depois, acréscimo de 10% sobre o preço já descontado. Qual é o preço final?","alternativas":{"A":"R$ 185,00","B":"R$ 190,00","C":"R$ 187,00","D":"R$ 195,00"},"gabarito":"C","comentario":"Após desconto de 15%: 200×0,85 = 170. Depois, acréscimo de 10% sobre 170: 170×1,10 = 187. Logo, o preço final é R$ 187,00.","referencia":"Porcentagens sucessivas em situação aritmética","tags":["raciocinio_logico","desconto_e_acrescimo"]},{"id":"RAC070","area":"Raciocínio Lógico","tema":"MAPA 059 - Problemas aritméticos de raciocínio lógico","subtema":"Equação diofantina simples","dificuldade":"intermediaria","enunciado":"Em um estacionamento há apenas motos, com 2 rodas, e carros, com 4 rodas. Ao todo são 18 veículos e 56 rodas. Quantos carros há?","alternativas":{"A":"10","B":"8","C":"12","D":"14"},"gabarito":"A","comentario":"Se c é o número de carros e m o de motos, c+m=18 e 4c+2m=56. Dividindo a segunda por 2: 2c+m=28. Subtraindo a primeira: c=10. Portanto há 10 carros e 8 motos.","referencia":"Sistema linear com solução inteira","tags":["raciocinio_logico","contagem_de_veiculos"]},{"id":"RAC071","area":"Raciocínio Lógico","tema":"MAPA 060 - Problemas geométricos de raciocínio lógico","subtema":"Perímetro de quadrado","dificuldade":"facil","enunciado":"Um terreno quadrado possui lado de 9 m. Qual é o seu perímetro?","alternativas":{"A":"18 m","B":"27 m","C":"36 m","D":"81 m"},"gabarito":"C","comentario":"O perímetro de um quadrado é quatro vezes a medida do lado. Assim, 4×9 = 36 m.","referencia":"Perímetro de quadrado","tags":["raciocinio_logico","geometria_perimetro"]},{"id":"RAC072","area":"Raciocínio Lógico","tema":"MAPA 060 - Problemas geométricos de raciocínio lógico","subtema":"Área de retângulo a partir do perímetro","dificuldade":"intermediaria","enunciado":"Um retângulo tem perímetro de 50 cm e comprimento de 15 cm. Qual é sua área?","alternativas":{"A":"100 cm²","B":"125 cm²","C":"175 cm²","D":"150 cm²"},"gabarito":"D","comentario":"Se o comprimento é 15 e a largura é L, então 2(15+L)=50. Logo, 15+L=25 e L=10. A área é 15×10=150 cm².","referencia":"Perímetro e área de retângulo","tags":["raciocinio_logico","geometria_retangulo"]},{"id":"RAC073","area":"Raciocínio Lógico","tema":"MAPA 060 - Problemas geométricos de raciocínio lógico","subtema":"Área de triângulo","dificuldade":"intermediaria","enunciado":"Um triângulo possui base de 12 cm e altura relativa a essa base de 7 cm. Qual é sua área?","alternativas":{"A":"38 cm²","B":"42 cm²","C":"48 cm²","D":"84 cm²"},"gabarito":"B","comentario":"A área do triângulo é (base×altura)/2. Portanto, (12×7)/2 = 84/2 = 42 cm².","referencia":"Área de triângulo","tags":["raciocinio_logico","geometria_triangulo"]},{"id":"RAC074","area":"Raciocínio Lógico","tema":"MAPA 060 - Problemas geométricos de raciocínio lógico","subtema":"Caminhos mínimos em malha","dificuldade":"dificil","enunciado":"Em uma malha quadriculada, uma pessoa parte de A=(0,0) e precisa chegar a B=(4,3), movendo-se apenas uma unidade para leste ou uma unidade para norte a cada passo. Quantos caminhos mínimos passam obrigatoriamente pelo ponto C=(2,1)?","alternativas":{"A":"12","B":"18","C":"15","D":"24"},"gabarito":"B","comentario":"De A até C são necessários 2 passos para leste e 1 para norte, em qualquer ordem: C(3,1)=3 caminhos. De C até B são 2 passos para leste e 2 para norte: C(4,2)=6 caminhos. Pelo princípio multiplicativo, 3×6=18 caminhos mínimos passam por C.","referencia":"Combinatória aplicada a caminhos em malha","tags":["raciocinio_logico","caminhos_em_malha"]},{"id":"RAC075","area":"Raciocínio Lógico","tema":"MAPA 060 - Problemas geométricos de raciocínio lógico","subtema":"Volume de cubo","dificuldade":"intermediaria","enunciado":"Um cubo tem aresta de 4 cm. Se a aresta passar a medir 5 cm, de quanto aumentará o volume?","alternativas":{"A":"25 cm³","B":"61 cm³","C":"41 cm³","D":"64 cm³"},"gabarito":"B","comentario":"O volume inicial é 4³=64 cm³. O novo volume é 5³=125 cm³. O aumento é 125−64=61 cm³.","referencia":"Volume de cubo e variação","tags":["raciocinio_logico","geometria_espacial"]},{"id":"RAC076","area":"Raciocínio Lógico","tema":"MAPA 061 - Problemas matriciais e organização de informações","subtema":"Matriz numérica por regra de linha","dificuldade":"intermediaria","enunciado":"Em cada linha da matriz, o terceiro número é igual ao primeiro mais o dobro do segundo: [3, 4, 11]; [5, 2, 9]; [7, 6, ?]. Qual número substitui o ponto de interrogação?","alternativas":{"A":"19","B":"17","C":"20","D":"26"},"gabarito":"A","comentario":"Aplicando a regra à terceira linha: 7 + 2×6 = 7 + 12 = 19. As duas primeiras linhas confirmam a mesma regra: 3+2×4=11 e 5+2×2=9.","referencia":"Identificação de regra em matriz numérica","tags":["raciocinio_logico","matriz_numerica"]},{"id":"RAC077","area":"Raciocínio Lógico","tema":"MAPA 061 - Problemas matriciais e organização de informações","subtema":"Tabela de alocação por exclusão","dificuldade":"intermediaria","enunciado":"Três servidores — Léo, Mônica e Nilo — trabalham, cada um, em um turno diferente (manhã, tarde, noite) e em um setor diferente (A, B, C). Léo trabalha pela manhã. Quem trabalha no setor B está no turno da tarde. Mônica não trabalha à noite nem no setor A. Nilo trabalha no setor C. Em qual setor trabalha Mônica?","alternativas":{"A":"A","B":"C","C":"não é possível determinar","D":"B"},"gabarito":"D","comentario":"Léo está de manhã. Mônica não está à noite, então, como os turnos são distintos, Mônica deve estar à tarde e Nilo à noite. O setor B corresponde ao turno da tarde; logo Mônica trabalha no setor B. Nilo está no setor C e sobra A para Léo.","referencia":"Organização tabular e eliminação","tags":["raciocinio_logico","tabela_logica"]},{"id":"RAC078","area":"Raciocínio Lógico","tema":"MAPA 061 - Problemas matriciais e organização de informações","subtema":"Quadrado latino","dificuldade":"intermediaria","enunciado":"Considere a grade 3×3 em que cada linha e cada coluna deve conter exatamente uma vez os símbolos X, Y e Z. As duas primeiras linhas são [X, Y, Z] e [Y, Z, X]. A terceira linha começa com Z. Qual deve ser o segundo símbolo da terceira linha?","alternativas":{"A":"Y","B":"Z","C":"não é possível determinar","D":"X"},"gabarito":"D","comentario":"Na segunda coluna já aparecem Y e Z nas duas primeiras linhas. Para que cada símbolo apareça uma única vez na coluna, o elemento que falta é X. Assim, a terceira linha é [Z, X, Y].","referencia":"Quadrado latino e restrições de linha/coluna","tags":["raciocinio_logico","grade_logica"]},{"id":"RAC079","area":"Raciocínio Lógico","tema":"MAPA 061 - Problemas matriciais e organização de informações","subtema":"Somas de linhas e colunas","dificuldade":"intermediaria","enunciado":"Uma matriz 2×3 é formada por [4, x, 7] na primeira linha e [6, 5, 3] na segunda. A soma dos elementos da primeira linha é igual à soma dos elementos da segunda. Qual é o valor de x?","alternativas":{"A":"1","B":"2","C":"4","D":"3"},"gabarito":"D","comentario":"A soma da segunda linha é 6+5+3=14. Na primeira, 4+x+7=11+x. Igualando: 11+x=14, então x=3.","referencia":"Equações a partir de matriz de dados","tags":["raciocinio_logico","somas_em_matriz"]},{"id":"RAC080","area":"Raciocínio Lógico","tema":"MAPA 061 - Problemas matriciais e organização de informações","subtema":"Grade de associação com múltiplas restrições","dificuldade":"dificil","enunciado":"Quatro analistas — A, B, C e D — serão distribuídos em quatro células de uma grade 2×2: superior esquerda (SE), superior direita (SD), inferior esquerda (IE) e inferior direita (ID), uma pessoa por célula. A não pode ficar na mesma linha de B. C deve ficar na mesma coluna de A. D não pode ficar na coluna esquerda. Se A estiver em SE, quem necessariamente ficará em ID?","alternativas":{"A":"C","B":"D","C":"B","D":"não é possível determinar"},"gabarito":"C","comentario":"Com A em SE, C deve ficar na mesma coluna de A; como SE já está ocupada, C fica em IE. B não pode ficar na mesma linha de A, portanto deve estar na linha inferior. Como IE já é de C, B fica em ID. A única célula restante é SD, destinada a D, o que respeita a condição de D não ficar na coluna esquerda. Logo, B necessariamente ocupa ID.","referencia":"Organização em grade e propagação de restrições","tags":["raciocinio_logico","problema_matricial"]}],"legislacao":[{"id":"LEG001","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Fundamentos do Município","dificuldade":"intermediaria","enunciado":"Ao elaborar um programa institucional, a Prefeitura pretende fundamentá-lo nos valores expressamente reconhecidos pela Lei Orgânica de Campina Grande. Assinale a alternativa que apresenta apenas fundamentos previstos na Lei Orgânica municipal.","alternativas":{"A":"Cidadania, dignidade da pessoa humana, pluralismo político e organização e participação popular.","B":"Soberania nacional, defesa nacional, livre concorrência e segurança pública.","C":"Erradicação da pobreza, desenvolvimento nacional, igualdade tributária e defesa do consumidor.","D":"Separação absoluta dos Poderes, supremacia administrativa, eficiência econômica e autonomia judicial municipal."},"gabarito":"A","comentario":"A Lei Orgânica de Campina Grande inclui entre os fundamentos municipais a ordem jurídica democrática, a cidadania, a dignidade da pessoa humana, os valores sociais do trabalho e da livre iniciativa, o pluralismo político e a organização e participação popular. A alternativa A reúne fundamentos expressamente contemplados. As demais misturam objetivos, princípios de outros ramos jurídicos ou estruturas que não constituem fundamentos municipais na forma indicada.","referencia":"Lei Orgânica do Município de Campina Grande, art. 1º.","tags":["legislacao","lei_organica","fundamentos_do_municipio"]},{"id":"LEG002","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Autonomia municipal","dificuldade":"intermediaria","enunciado":"Um servidor afirmou que a autonomia de Campina Grande decorre exclusivamente da possibilidade de arrecadar tributos próprios. À luz da Lei Orgânica, essa afirmação é","alternativas":{"A":"correta, pois a autonomia municipal possui natureza exclusivamente financeira.","B":"incorreta, pois a autonomia também se manifesta pela elaboração da Lei Orgânica, eleição de Prefeito, Vice-Prefeito e Vereadores e organização do Governo, da Administração e dos serviços públicos locais.","C":"correta, porque a organização administrativa municipal depende integralmente de autorização estadual.","D":"incorreta apenas porque o Município também possui Poder Judiciário próprio."},"gabarito":"B","comentario":"A autonomia municipal é mais ampla que a dimensão financeira. A Lei Orgânica destaca a auto-organização por sua própria Lei Orgânica, o autogoverno mediante eleição dos agentes políticos municipais e a auto-organização administrativa dos serviços locais. Campina Grande não possui Poder Judiciário municipal.","referencia":"Lei Orgânica do Município de Campina Grande, arts. 1º e 7º.","tags":["legislacao","lei_organica","autonomia_municipal"]},{"id":"LEG003","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Poder popular e participação","dificuldade":"dificil","enunciado":"Em reunião administrativa, sustentou-se que, no âmbito municipal, o exercício do poder político somente pode ocorrer por meio de representantes eleitos, não havendo espaço jurídico para formas de participação direta. Considerando a Lei Orgânica de Campina Grande, assinale a alternativa correta.","alternativas":{"A":"A afirmação é correta porque instrumentos de democracia direta são reservados à União.","B":"A participação direta somente é possível mediante autorização prévia da Assembleia Legislativa da Paraíba.","C":"A afirmação é incorreta, pois o poder emana do povo e pode ser exercido por representantes eleitos ou diretamente, nos termos constitucionais e da Lei Orgânica.","D":"A participação popular existe apenas em matéria orçamentária."},"gabarito":"C","comentario":"A Lei Orgânica adota a concepção democrática de que o poder municipal emana do povo. Seu exercício pode ocorrer tanto indiretamente, por representantes eleitos, como diretamente, observados os instrumentos e condições previstos no ordenamento. Portanto, não há exclusividade da democracia representativa.","referencia":"Lei Orgânica do Município de Campina Grande, art. 3º.","tags":["legislacao","lei_organica","poder_popular_e_participacao"]},{"id":"LEG004","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Sede do Município","dificuldade":"facil","enunciado":"De acordo com a Lei Orgânica de Campina Grande, a sede do Governo e do Município é","alternativas":{"A":"o distrito mais populoso do Município.","B":"a cidade de Campina Grande.","C":"a região metropolitana de Campina Grande.","D":"o local indicado anualmente por decreto do Prefeito."},"gabarito":"B","comentario":"A Lei Orgânica estabelece expressamente que a cidade de Campina Grande é a sede do Governo e do Município. A sede não varia de acordo com população, decreto anual ou configuração metropolitana.","referencia":"Lei Orgânica do Município de Campina Grande, art. 8º.","tags":["legislacao","lei_organica","sede_do_municipio"]},{"id":"LEG005","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Direitos fundamentais no Município","dificuldade":"intermediaria","enunciado":"Ao estruturar determinada política pública, um órgão municipal alegou que a proteção contra discriminações não constituiria atribuição relevante do Município. À luz da Lei Orgânica de Campina Grande, essa conclusão é","alternativas":{"A":"correta, porque direitos fundamentais somente vinculam a União.","B":"correta, desde que a discriminação não envolva servidor municipal.","C":"incorreta, pois cabe ao Município, no âmbito de sua competência, garantir a efetividade dos direitos fundamentais, coibir discriminações e promover a melhoria da condição social da população.","D":"incorreta apenas se existir previamente lei estadual sobre o assunto."},"gabarito":"C","comentario":"A Lei Orgânica atribui expressamente ao Município o dever de atuar, dentro de suas competências, para efetivar direitos fundamentais, combater discriminações e melhorar as condições sociais da população. A atuação municipal não se limita a relações funcionais com seus servidores.","referencia":"Lei Orgânica do Município de Campina Grande, art. 9º.","tags":["legislacao","lei_organica","direitos_fundamentais_no_municipio"]},{"id":"LEG006","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Competência de interesse local","dificuldade":"intermediaria","enunciado":"A Câmara Municipal analisa proposta normativa destinada a disciplinar assunto predominantemente relacionado às peculiaridades e necessidades locais de Campina Grande. Segundo a Lei Orgânica, o Município","alternativas":{"A":"somente poderá legislar após autorização expressa do Congresso Nacional.","B":"possui competência para legislar sobre assuntos de interesse local.","C":"não exerce competência legislativa própria.","D":"somente poderá editar regulamentos, jamais leis sobre interesse local."},"gabarito":"B","comentario":"Legislar sobre assuntos de interesse local constitui competência municipal expressamente reconhecida. Essa competência decorre também da Constituição Federal e não depende de autorização individual da União.","referencia":"Lei Orgânica do Município de Campina Grande, art. 10, I; Constituição Federal, art. 30, I.","tags":["legislacao","lei_organica","competencia_de_interesse_local"]},{"id":"LEG007","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Serviços públicos locais","dificuldade":"facil","enunciado":"Constitui competência do Município de Campina Grande, segundo sua Lei Orgânica,","alternativas":{"A":"explorar privativamente serviços de telecomunicações nacionais.","B":"legislar sobre direito penal.","C":"organizar e prestar serviços públicos de interesse local, diretamente ou sob regime admitido juridicamente, incluindo o transporte coletivo.","D":"declarar guerra a outro ente federativo."},"gabarito":"C","comentario":"A organização e prestação de serviços públicos de interesse local constitui competência municipal. A própria Lei Orgânica destaca o transporte coletivo, reconhecendo seu caráter essencial. As demais matérias pertencem a competências constitucionais de outros entes.","referencia":"Lei Orgânica do Município de Campina Grande, art. 10, IX.","tags":["legislacao","lei_organica","servicos_publicos_locais"]},{"id":"LEG008","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Competência legislativa suplementar","dificuldade":"dificil","enunciado":"Existe norma federal geral sobre determinada matéria, mas peculiaridade relevante de Campina Grande exige disciplina local complementar, sem contrariar a norma geral. Nessa hipótese, a Lei Orgânica admite que o Município","alternativas":{"A":"exerça competência legislativa suplementar, respeitando as normas superiores aplicáveis.","B":"revogue a norma federal dentro do território municipal.","C":"legisle apenas se receber delegação do Senado Federal.","D":"substitua integralmente a disciplina federal por decreto do Prefeito."},"gabarito":"A","comentario":"A competência suplementar permite adaptar e completar a disciplina federal ou estadual às peculiaridades locais, sem afastar normas superiores válidas. Ela não confere poder para revogar legislação federal nem autoriza substituição legislativa por simples decreto.","referencia":"Lei Orgânica do Município de Campina Grande, art. 12; Constituição Federal, art. 30, II.","tags":["legislacao","lei_organica","competencia_legislativa_suplementar"]},{"id":"LEG009","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Tributos municipais","dificuldade":"intermediaria","enunciado":"Sobre a competência tributária e financeira municipal prevista na Lei Orgânica, assinale a alternativa correta.","alternativas":{"A":"O Município arrecada tributos, mas não pode aplicar diretamente a receita obtida.","B":"A instituição de qualquer tributo municipal depende de autorização anual do Estado.","C":"Compete ao Município instituir, decretar e arrecadar os tributos de sua competência e aplicar suas receitas, mantendo o dever de prestar contas e publicar balancetes.","D":"O dever de prestar contas desaparece quando a receita possui origem tributária própria."},"gabarito":"C","comentario":"A autonomia financeira municipal abrange a instituição e arrecadação dos tributos de sua competência e a aplicação das receitas. Essa autonomia não elimina os deveres de transparência, prestação de contas e publicidade financeira.","referencia":"Lei Orgânica do Município de Campina Grande, art. 10, VIII.","tags":["legislacao","lei_organica","tributos_municipais"]},{"id":"LEG010","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Poder de polícia administrativa","dificuldade":"facil","enunciado":"Segundo a Lei Orgânica de Campina Grande, o exercício do poder de polícia administrativa","alternativas":{"A":"é reservado exclusivamente ao Estado da Paraíba.","B":"integra as competências municipais.","C":"depende de autorização judicial em qualquer situação.","D":"é incompatível com a autonomia municipal."},"gabarito":"B","comentario":"A Lei Orgânica inclui expressamente o exercício do poder de polícia administrativa entre as competências do Município. Isso permite a adoção de medidas administrativas de fiscalização e condicionamento de atividades dentro das atribuições legais municipais.","referencia":"Lei Orgânica do Município de Campina Grande, art. 10, XXIX.","tags":["legislacao","lei_organica","poder_de_policia_administrativa"]},{"id":"LEG011","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Poder Legislativo Municipal","dificuldade":"intermediaria","enunciado":"No sistema institucional previsto pela Lei Orgânica de Campina Grande, o Poder Legislativo municipal é exercido","alternativas":{"A":"pelo Prefeito auxiliado pelos Secretários.","B":"conjuntamente pelo Tribunal de Justiça e pela Câmara Municipal.","C":"pela Câmara Municipal, Casa de Félix Araújo, composta de representantes eleitos.","D":"por conselho popular com função legislativa permanente."},"gabarito":"C","comentario":"A Lei Orgânica atribui o exercício do Poder Legislativo à Câmara Municipal, denominada Casa de Félix Araújo. Conselhos populares podem integrar mecanismos participativos, mas não substituem institucionalmente a Câmara.","referencia":"Lei Orgânica do Município de Campina Grande, art. 31.","tags":["legislacao","lei_organica","poder_legislativo_municipal"]},{"id":"LEG012","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Poderes municipais","dificuldade":"facil","enunciado":"São Poderes do Município de Campina Grande, nos termos de sua Lei Orgânica,","alternativas":{"A":"Executivo, Legislativo e Judiciário.","B":"Legislativo e Executivo.","C":"Executivo e Judiciário.","D":"Legislativo, Executivo e Ministério Público Municipal."},"gabarito":"B","comentario":"A Lei Orgânica prevê dois Poderes municipais: Legislativo e Executivo, independentes e harmônicos entre si. Não existe Poder Judiciário municipal nem Ministério Público municipal como Poder do Município.","referencia":"Lei Orgânica do Município de Campina Grande, art. 6º.","tags":["legislacao","lei_organica","poderes_municipais"]},{"id":"LEG013","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Separação e harmonia dos Poderes","dificuldade":"intermediaria","enunciado":"O chefe de determinado Poder municipal pretende transferir integralmente atribuição institucional própria ao outro Poder, sem fundamento jurídico específico. À luz da Lei Orgânica, a medida","alternativas":{"A":"contraria a regra de independência dos Poderes e a vedação de delegação de atribuições nos termos estabelecidos pela Lei Orgânica.","B":"é obrigatória sempre que houver conveniência administrativa.","C":"é válida desde que comunicada verbalmente à população.","D":"é livre porque não existe separação funcional no plano municipal."},"gabarito":"A","comentario":"A Lei Orgânica reconhece Legislativo e Executivo como independentes e harmônicos e estabelece proteção à divisão funcional entre eles. A conveniência administrativa, isoladamente, não permite a transferência ampla de competências constitucional ou organicamente atribuídas.","referencia":"Lei Orgânica do Município de Campina Grande, art. 6º e parágrafo único.","tags":["legislacao","lei_organica","separacao_e_harmonia_dos_poderes"]},{"id":"LEG014","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Chefia do Poder Executivo","dificuldade":"intermediaria","enunciado":"No âmbito da estrutura municipal, as atribuições de direção superior do Executivo e de execução das competências conferidas ao chefe do governo municipal são desempenhadas primordialmente pelo","alternativas":{"A":"Presidente da Câmara.","B":"Prefeito.","C":"Procurador-Geral de Justiça.","D":"Tribunal de Contas."},"gabarito":"B","comentario":"O Prefeito ocupa a chefia do Poder Executivo municipal. A Câmara exerce o Legislativo; órgãos de controle e instituições estaduais não substituem ordinariamente o chefe do Executivo na condução da Administração municipal.","referencia":"Lei Orgânica do Município de Campina Grande, disposições sobre o Poder Executivo e atribuições do Prefeito.","tags":["legislacao","lei_organica","chefia_do_poder_executivo"]},{"id":"LEG015","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Processo legislativo municipal","dificuldade":"facil","enunciado":"Em 2026, a Lei Orgânica de Campina Grande foi alterada para incluir e disciplinar, no processo legislativo municipal, determinado instrumento normativo editado pelo chefe do Executivo. Trata-se da","alternativas":{"A":"medida provisória.","B":"ação direta de inconstitucionalidade.","C":"súmula vinculante municipal.","D":"sentença normativa."},"gabarito":"A","comentario":"A Emenda à Lei Orgânica nº 2, de 12 de agosto de 2026, alterou o art. 51, acrescentou o art. 51-A e incluiu atribuição relacionada no art. 70 para inserir e disciplinar a medida provisória no processo legislativo municipal.","referencia":"Emenda à Lei Orgânica do Município de Campina Grande nº 2, de 12 de agosto de 2026.","tags":["legislacao","lei_organica","processo_legislativo_municipal"]},{"id":"LEG016","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Regime jurídico dos servidores","dificuldade":"intermediaria","enunciado":"A respeito dos servidores municipais, a Lei Orgânica de Campina Grande estabelece que o Município","alternativas":{"A":"deve adotar exclusivamente contratos privados de trabalho.","B":"não pode instituir planos de carreira.","C":"delega integralmente ao Estado a disciplina de seu pessoal.","D":"estabelecerá em lei o regime jurídico e planos de carreira para servidores da administração direta, autarquias e fundações públicas."},"gabarito":"D","comentario":"A Lei Orgânica determina a disciplina legal do regime jurídico e dos planos de carreira dos servidores da administração direta, autárquica e fundacional, observados os princípios e direitos constitucionais aplicáveis.","referencia":"Lei Orgânica do Município de Campina Grande, art. 109.","tags":["legislacao","lei_organica","regime_juridico_dos_servidores"]},{"id":"LEG017","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Contratação temporária","dificuldade":"intermediaria","enunciado":"Diante de necessidade temporária de interesse público, a Administração pretende contratar pessoal por prazo determinado. Segundo a Lei Orgânica de Campina Grande, os casos em que essa contratação será admitida devem ser estabelecidos","alternativas":{"A":"por decisão individual de qualquer secretário.","B":"por acordo verbal com os interessados.","C":"em lei especial.","D":"exclusivamente por resolução de conselho profissional."},"gabarito":"C","comentario":"A contratação temporária não é uma autorização genérica para contratação livre. A Lei Orgânica determina que lei especial estabeleça as hipóteses de contratação por tempo determinado para atender necessidade temporária de interesse público.","referencia":"Lei Orgânica do Município de Campina Grande, art. 113; Constituição Federal, art. 37, IX.","tags":["legislacao","lei_organica","contratacao_temporaria"]},{"id":"LEG018","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Criação de cargos públicos","dificuldade":"intermediaria","enunciado":"Uma secretaria pretende criar, por simples portaria, novo cargo público permanente, definindo vencimento e requisitos de provimento. Considerando a Lei Orgânica municipal, essa providência é","alternativas":{"A":"válida, desde que não haja aumento imediato de despesa.","B":"inadequada, pois os cargos públicos devem ser criados por lei, com definição dos elementos exigidos pelo ordenamento.","C":"válida se a portaria for publicada no diário oficial.","D":"obrigatória sempre que houver vaga orçamentária."},"gabarito":"B","comentario":"A criação de cargo público depende de lei. A Lei Orgânica prevê que a norma instituidora fixe denominação, padrão de vencimentos, condições de provimento e indique os recursos correspondentes. Portaria administrativa não substitui a exigência legal.","referencia":"Lei Orgânica do Município de Campina Grande, art. 115.","tags":["legislacao","lei_organica","criacao_de_cargos_publicos"]},{"id":"LEG019","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Política de recursos humanos","dificuldade":"intermediaria","enunciado":"Ao elaborar sua política de recursos humanos, a Administração de Campina Grande decide eliminar investimentos em capacitação de servidores efetivos, sob o argumento de que treinamento não se relaciona à eficiência administrativa. À luz da Lei Orgânica, a justificativa é","alternativas":{"A":"correta, pois treinamento deve ser custeado exclusivamente pelo servidor.","B":"correta, porque eficiência não se aplica à gestão de pessoas.","C":"incompatível com a orientação de valorização dos servidores e de investimento em treinamento para aprimoramento e atualização profissional.","D":"obrigatória sempre que houver contenção orçamentária, independentemente de qualquer avaliação."},"gabarito":"C","comentario":"A Lei Orgânica associa a política de recursos humanos à valorização dos servidores e prevê investimento em treinamento dos funcionários efetivos para aprimoramento e atualização na carreira. Capacitação também se relaciona à melhoria da prestação dos serviços públicos.","referencia":"Lei Orgânica do Município de Campina Grande, art. 109, §§ 2º e 3º.","tags":["legislacao","lei_organica","politica_de_recursos_humanos"]},{"id":"LEG020","area":"Legislação e Ética no Serviço Público","tema":"Lei Orgânica de Campina Grande","subtema":"Regime dos servidores municipais","dificuldade":"facil","enunciado":"A competência para estabelecer os quadros e o regime jurídico dos servidores municipais integra","alternativas":{"A":"competência exclusiva da União.","B":"competência do Município, observados os limites constitucionais.","C":"competência privativa do Tribunal de Justiça da Paraíba.","D":"atribuição exclusiva dos sindicatos."},"gabarito":"B","comentario":"A Lei Orgânica inclui entre as competências municipais o estabelecimento dos quadros e do regime jurídico de seus servidores. Essa competência deve ser exercida em conformidade com a Constituição e demais normas superiores aplicáveis.","referencia":"Lei Orgânica do Município de Campina Grande, art. 10, XIV.","tags":["legislacao","lei_organica","regime_dos_servidores_municipais"]},{"id":"LEG021","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Finalidade da proteção de dados","dificuldade":"intermediaria","enunciado":"A finalidade central da LGPD consiste em disciplinar o tratamento de dados pessoais com o objetivo de","alternativas":{"A":"proteger apenas interesses patrimoniais das empresas de tecnologia.","B":"proteger direitos fundamentais de liberdade e privacidade e o livre desenvolvimento da personalidade da pessoa natural.","C":"impedir qualquer utilização de dados pessoais por órgãos públicos.","D":"regular exclusivamente bancos de dados mantidos na internet."},"gabarito":"B","comentario":"A LGPD alcança tratamentos realizados em diferentes meios e por agentes públicos ou privados, tendo por objetivo proteger direitos fundamentais de liberdade e privacidade e o livre desenvolvimento da personalidade. Não se limita à internet nem proíbe genericamente o tratamento pelo Poder Público.","referencia":"Lei nº 13.709/2018, art. 1º.","tags":["legislacao","lgpd","finalidade_da_protecao_de_dados"]},{"id":"LEG022","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Princípio da necessidade","dificuldade":"dificil","enunciado":"Uma secretaria precisa cadastrar cidadãos para serviço que exige nome e meio de contato. Mesmo sem justificativa, decide também coletar profissão, religião, biometria e informações familiares. Qual princípio da LGPD é mais diretamente violado pela coleta excessiva?","alternativas":{"A":"Livre acesso.","B":"Qualidade dos dados.","C":"Necessidade.","D":"Portabilidade."},"gabarito":"C","comentario":"O princípio da necessidade exige limitação do tratamento ao mínimo necessário para alcançar a finalidade, abrangendo apenas dados pertinentes, proporcionais e não excessivos. A coleta de informações sem vínculo justificável com o serviço afronta diretamente esse princípio.","referencia":"Lei nº 13.709/2018, art. 6º, III.","tags":["legislacao","lgpd","principio_da_necessidade"]},{"id":"LEG023","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Princípio da finalidade","dificuldade":"dificil","enunciado":"Dados foram coletados para inscrição em programa municipal específico. Posteriormente, pretende-se utilizá-los para finalidade completamente incompatível com aquela informada, sem base jurídica adequada. A situação contraria mais diretamente o princípio da","alternativas":{"A":"publicidade administrativa.","B":"presunção de legitimidade.","C":"finalidade.","D":"autotutela."},"gabarito":"C","comentario":"O princípio da finalidade exige propósitos legítimos, específicos, explícitos e informados ao titular, vedando tratamento posterior incompatível com tais finalidades. Mudanças de uso precisam encontrar fundamento jurídico e respeitar os demais princípios da LGPD.","referencia":"Lei nº 13.709/2018, art. 6º, I.","tags":["legislacao","lgpd","principio_da_finalidade"]},{"id":"LEG024","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Princípio da transparência","dificuldade":"dificil","enunciado":"Determinado controlador realiza tratamento de dados, mas deliberadamente dificulta o acesso do titular a informações sobre quem trata seus dados e para quais finalidades. A conduta conflita especialmente com o princípio da","alternativas":{"A":"transparência.","B":"especialidade legislativa.","C":"continuidade do serviço público.","D":"hierarquia administrativa."},"gabarito":"A","comentario":"A transparência garante aos titulares informações claras, precisas e facilmente acessíveis sobre o tratamento e os respectivos agentes, resguardados os segredos comercial e industrial. Criar barreiras artificiais ao conhecimento dessas informações contraria o princípio.","referencia":"Lei nº 13.709/2018, art. 6º, VI.","tags":["legislacao","lgpd","principio_da_transparencia"]},{"id":"LEG025","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Responsabilização e prestação de contas","dificuldade":"dificil","enunciado":"Uma organização afirma respeitar a LGPD, porém não consegue demonstrar qualquer medida adotada para assegurar a conformidade de suas operações de tratamento. O princípio que exige demonstração de medidas eficazes de observância da legislação é o da","alternativas":{"A":"primariedade.","B":"subsidiariedade.","C":"responsabilização e prestação de contas.","D":"territorialidade."},"gabarito":"C","comentario":"A responsabilização e prestação de contas exige que o agente demonstre a adoção de medidas eficazes capazes de comprovar a observância e o cumprimento das normas de proteção de dados e a eficácia dessas medidas.","referencia":"Lei nº 13.709/2018, art. 6º, X.","tags":["legislacao","lgpd","responsabilizacao_e_prestacao_de_contas"]},{"id":"LEG026","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Fundamentos da proteção de dados","dificuldade":"intermediaria","enunciado":"Assinale a alternativa que corresponde a fundamento expressamente previsto na LGPD.","alternativas":{"A":"Autodeterminação informativa.","B":"Indisponibilidade absoluta de qualquer dado pessoal.","C":"Supremacia do controlador sobre o titular.","D":"Obrigatoriedade universal de consentimento para todo tratamento."},"gabarito":"A","comentario":"A autodeterminação informativa integra os fundamentos da disciplina da proteção de dados pessoais. A LGPD não considera o consentimento a única base legal, nem atribui supremacia irrestrita ao controlador ou indisponibilidade absoluta aos dados.","referencia":"Lei nº 13.709/2018, art. 2º, II.","tags":["legislacao","lgpd","fundamentos_da_protecao_de_dados"]},{"id":"LEG027","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Conceito de dado pessoal","dificuldade":"intermediaria","enunciado":"Para fins da LGPD, dado pessoal é","alternativas":{"A":"somente a informação capaz de identificar alguém de maneira imediata e direta.","B":"apenas informação protegida por sigilo legal.","C":"informação relacionada a pessoa natural identificada ou identificável.","D":"qualquer informação relacionada a pessoa jurídica."},"gabarito":"C","comentario":"O conceito legal abrange informação relacionada a pessoa natural identificada ou identificável. Assim, dados que permitam identificação indireta também podem ser pessoais. A definição não se restringe a informações sigilosas.","referencia":"Lei nº 13.709/2018, art. 5º, I.","tags":["legislacao","lgpd","conceito_de_dado_pessoal"]},{"id":"LEG028","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Dados pessoais sensíveis","dificuldade":"intermediaria","enunciado":"Qual das informações abaixo é expressamente enquadrada pela LGPD como dado pessoal sensível quando vinculada a pessoa natural?","alternativas":{"A":"CEP residencial isoladamente considerado.","B":"Modelo do aparelho celular utilizado.","C":"Dado biométrico.","D":"Número do protocolo de atendimento sem possibilidade de associação ao indivíduo."},"gabarito":"C","comentario":"A LGPD classifica como sensíveis, entre outros, dados sobre saúde, vida sexual, origem racial ou étnica, convicção religiosa, opinião política, filiação sindical e dados genéticos ou biométricos vinculados a pessoa natural.","referencia":"Lei nº 13.709/2018, art. 5º, II.","tags":["legislacao","lgpd","dados_pessoais_sensiveis"]},{"id":"LEG029","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Consentimento","dificuldade":"intermediaria","enunciado":"Nos termos da LGPD, o consentimento válido é caracterizado como manifestação","alternativas":{"A":"livre, informada e inequívoca, pela qual o titular concorda com o tratamento para finalidade determinada.","B":"presumida sempre que o titular não apresentar oposição expressa.","C":"genérica e irrevogável para quaisquer tratamentos futuros.","D":"necessariamente verbal e sem indicação de finalidade."},"gabarito":"A","comentario":"Consentimento é manifestação livre, informada e inequívoca voltada a finalidade determinada. Autorizações genéricas são incompatíveis com a LGPD, e o consentimento pode ser revogado segundo os procedimentos legais.","referencia":"Lei nº 13.709/2018, arts. 5º, XII, e 8º.","tags":["legislacao","lgpd","consentimento"]},{"id":"LEG030","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Bases legais","dificuldade":"facil","enunciado":"Sobre o tratamento de dados pessoais na LGPD, é correto afirmar que","alternativas":{"A":"o consentimento é uma das hipóteses legais de tratamento, mas não é a única.","B":"sem consentimento nenhum tratamento pode ser realizado.","C":"órgãos públicos estão dispensados de qualquer base jurídica.","D":"dados públicos podem ser utilizados para qualquer finalidade."},"gabarito":"A","comentario":"A LGPD prevê várias bases legais para tratamento, como consentimento, cumprimento de obrigação legal ou regulatória, execução de políticas públicas e exercício regular de direitos. Logo, consentimento não é requisito universal.","referencia":"Lei nº 13.709/2018, art. 7º.","tags":["legislacao","lgpd","bases_legais"]},{"id":"LEG031","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Tratamento de dados sensíveis","dificuldade":"facil","enunciado":"O tratamento de dados pessoais sensíveis","alternativas":{"A":"é sempre proibido.","B":"é livre quando realizado por qualquer empresa.","C":"pode ocorrer nas hipóteses expressamente previstas pela LGPD, inclusive em determinadas situações sem consentimento.","D":"somente pode ocorrer por ordem judicial."},"gabarito":"C","comentario":"A LGPD estabelece regime mais rigoroso para dados sensíveis, mas não os torna absolutamente intocáveis. O art. 11 prevê hipóteses com consentimento específico e destacado e hipóteses legais em que o tratamento pode ocorrer sem consentimento.","referencia":"Lei nº 13.709/2018, art. 11.","tags":["legislacao","lgpd","tratamento_de_dados_sensiveis"]},{"id":"LEG032","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Tratamento pela Administração Pública","dificuldade":"intermediaria","enunciado":"Um órgão municipal trata dados necessários à execução de política pública prevista em lei. Sobre a necessidade de consentimento, assinale a alternativa correta.","alternativas":{"A":"A LGPD admite tratamento pela Administração Pública com fundamento próprio para execução de políticas públicas, desde que observados os requisitos legais aplicáveis.","B":"O consentimento é sempre indispensável, sem exceções.","C":"O órgão pode utilizar quaisquer dados para qualquer finalidade futura.","D":"A LGPD não se aplica a Municípios."},"gabarito":"A","comentario":"A LGPD contém base legal específica para tratamento e uso compartilhado de dados pela Administração quando necessários à execução de políticas públicas previstas em leis e regulamentos ou respaldadas nos instrumentos admitidos. Isso não afasta os princípios e deveres de proteção.","referencia":"Lei nº 13.709/2018, art. 7º, III, e Capítulo IV.","tags":["legislacao","lgpd","tratamento_pela_administracao_publica"]},{"id":"LEG033","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Direito de acesso","dificuldade":"facil","enunciado":"Entre os direitos assegurados ao titular pela LGPD está","alternativas":{"A":"exigir que qualquer dado verdadeiro seja alterado segundo sua conveniência.","B":"obter acesso aos dados pessoais tratados pelo controlador.","C":"impedir toda obrigação legal de conservação de dados.","D":"determinar a destruição imediata de qualquer banco de dados público."},"gabarito":"B","comentario":"O titular tem direito à confirmação da existência de tratamento e ao acesso aos seus dados. Os direitos não autorizam alterar dados verdadeiros arbitrariamente nem afastar hipóteses legais de conservação.","referencia":"Lei nº 13.709/2018, art. 18, I e II.","tags":["legislacao","lgpd","direito_de_acesso"]},{"id":"LEG034","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Correção de dados","dificuldade":"intermediaria","enunciado":"Um cidadão identifica que seu endereço cadastrado pelo controlador está desatualizado. Nos termos da LGPD, ele pode requerer","alternativas":{"A":"a transferência da competência do controlador.","B":"indenização automática, independentemente de dano.","C":"a correção de dados incompletos, inexatos ou desatualizados.","D":"a exclusão obrigatória de todo o banco de dados."},"gabarito":"C","comentario":"A correção de dados incompletos, inexatos ou desatualizados é direito expressamente previsto no art. 18. Esse direito permite melhorar a qualidade e exatidão das informações tratadas.","referencia":"Lei nº 13.709/2018, art. 18, III.","tags":["legislacao","lgpd","correcao_de_dados"]},{"id":"LEG035","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Agentes de tratamento","dificuldade":"facil","enunciado":"Para fins da LGPD, são agentes de tratamento","alternativas":{"A":"titular e encarregado.","B":"controlador e operador.","C":"ANPD e titular.","D":"juiz e Ministério Público."},"gabarito":"B","comentario":"A LGPD define como agentes de tratamento o controlador e o operador. O controlador toma as decisões referentes ao tratamento, enquanto o operador realiza o tratamento em nome do controlador.","referencia":"Lei nº 13.709/2018, art. 5º, VI, VII e IX.","tags":["legislacao","lgpd","agentes_de_tratamento"]},{"id":"LEG036","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Eliminação de dados tratados com consentimento","dificuldade":"dificil","enunciado":"Um titular solicita a eliminação de dados pessoais tratados com base em seu consentimento. O controlador afirma que a eliminação jamais é possível enquanto ele tiver interesse econômico na manutenção dos registros. À luz da LGPD, a afirmação é","alternativas":{"A":"correta, porque o interesse econômico do controlador prevalece sempre.","B":"correta, desde que o banco de dados tenha mais de um ano.","C":"correta apenas para dados cadastrais.","D":"incorreta, pois existe direito à eliminação dos dados tratados com consentimento, ressalvadas as hipóteses legais de conservação."},"gabarito":"D","comentario":"O art. 18 prevê a eliminação dos dados tratados com consentimento, observadas as hipóteses de conservação do art. 16, como cumprimento de obrigação legal ou regulatória. Interesse econômico isolado não constitui justificativa universal para negar o direito.","referencia":"Lei nº 13.709/2018, arts. 16 e 18, VI.","tags":["legislacao","lgpd","eliminacao_de_dados_tratados_com_consentimento"]},{"id":"LEG037","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Encarregado","dificuldade":"intermediaria","enunciado":"Segundo a definição legal vigente, o encarregado exerce função relacionada principalmente","alternativas":{"A":"ao canal de comunicação entre agentes de tratamento, titulares e a autoridade nacional, nos termos da legislação.","B":"à substituição do controlador em todas as decisões administrativas.","C":"ao julgamento judicial de infrações à LGPD.","D":"à titularidade dos dados pessoais tratados."},"gabarito":"A","comentario":"O encarregado atua como canal de comunicação no sistema de proteção de dados, conforme definição vigente da LGPD. Ele não se torna titular dos dados nem exerce função jurisdicional.","referencia":"Lei nº 13.709/2018, art. 5º, VIII, com redação vigente.","tags":["legislacao","lgpd","encarregado"]},{"id":"LEG038","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Exercício dos direitos do titular","dificuldade":"facil","enunciado":"Os direitos previstos no art. 18 da LGPD podem ser exercidos, em regra, mediante","alternativas":{"A":"apenas ação judicial.","B":"autorização prévia da autoridade nacional.","C":"requerimento expresso do titular ou de representante legalmente constituído dirigido ao agente de tratamento.","D":"pagamento obrigatório de taxa administrativa."},"gabarito":"C","comentario":"A LGPD prevê exercício dos direitos mediante requerimento expresso do titular ou representante legalmente constituído. O atendimento do requerimento deve ocorrer sem custos para o titular, nos termos regulamentares.","referencia":"Lei nº 13.709/2018, art. 18, §§ 3º e 5º.","tags":["legislacao","lgpd","exercicio_dos_direitos_do_titular"]},{"id":"LEG039","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Tratamento pelo Poder Público","dificuldade":"intermediaria","enunciado":"A aplicação da LGPD à Administração municipal deve partir da premissa de que","alternativas":{"A":"as normas gerais da LGPD também devem ser observadas pelos Municípios.","B":"a LGPD alcança apenas a União.","C":"entes públicos estão dispensados dos princípios da proteção de dados.","D":"a proteção de dados pessoais é facultativa no setor público."},"gabarito":"A","comentario":"A própria LGPD afirma que suas normas gerais são de interesse nacional e devem ser observadas pela União, Estados, Distrito Federal e Municípios. O Poder Público possui regras específicas, mas não está fora do regime de proteção.","referencia":"Lei nº 13.709/2018, art. 1º, parágrafo único.","tags":["legislacao","lgpd","tratamento_pelo_poder_publico"]},{"id":"LEG040","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Incidente de segurança","dificuldade":"dificil","enunciado":"Um controlador identifica incidente de segurança capaz de acarretar risco ou dano relevante aos titulares. Segundo a LGPD, a resposta juridicamente adequada é","alternativas":{"A":"manter o fato permanentemente em sigilo para preservar sua reputação.","B":"comunicar apenas aos funcionários internos.","C":"aguardar necessariamente ordem judicial.","D":"comunicar a ocorrência à autoridade nacional e ao titular, observando os requisitos e o prazo aplicável."},"gabarito":"D","comentario":"O art. 48 impõe ao controlador comunicação à autoridade nacional e ao titular quando o incidente possa acarretar risco ou dano relevante. A comunicação deve conter elementos mínimos sobre natureza dos dados, riscos e medidas adotadas ou previstas.","referencia":"Lei nº 13.709/2018, art. 48.","tags":["legislacao","lgpd","incidente_de_seguranca"]},{"id":"LEG041","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Segurança dos dados","dificuldade":"facil","enunciado":"Segundo a LGPD, os agentes de tratamento devem","alternativas":{"A":"adotar medidas técnicas e administrativas aptas a proteger os dados pessoais contra acessos não autorizados e situações acidentais ou ilícitas.","B":"proteger somente dados pessoais sensíveis.","C":"adotar medidas de segurança apenas depois da ocorrência de incidente.","D":"dispensar controles de segurança quando os dados forem tratados digitalmente."},"gabarito":"A","comentario":"A segurança deve ser preventiva. Os agentes de tratamento precisam adotar medidas técnicas e administrativas adequadas contra acessos não autorizados, destruição, perda, alteração, comunicação ou tratamento inadequado ou ilícito.","referencia":"Lei nº 13.709/2018, art. 46.","tags":["legislacao","lgpd","seguranca_dos_dados"]},{"id":"LEG042","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Responsabilidade dos agentes","dificuldade":"intermediaria","enunciado":"No regime de responsabilidade da LGPD, constitui hipótese legal que pode afastar a responsabilização do agente de tratamento a prova de que","alternativas":{"A":"o titular não leu a política de privacidade.","B":"o banco de dados possui grande número de registros.","C":"não houve violação à legislação de proteção de dados, embora o tratamento atribuído ao agente tenha sido realizado.","D":"o tratamento foi lucrativo."},"gabarito":"C","comentario":"O art. 43 prevê situações em que os agentes não serão responsabilizados, como provar que não realizaram o tratamento atribuído, que não houve violação à legislação ou que o dano decorreu de culpa exclusiva do titular ou de terceiro.","referencia":"Lei nº 13.709/2018, art. 43.","tags":["legislacao","lgpd","responsabilidade_dos_agentes"]},{"id":"LEG043","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Uso compartilhado pelo Poder Público","dificuldade":"intermediaria","enunciado":"O compartilhamento de dados pessoais pelo Poder Público","alternativas":{"A":"é sempre proibido.","B":"deve observar as finalidades específicas de execução de políticas públicas e atribuições legais, além das regras de proteção estabelecidas pela LGPD.","C":"é livre para qualquer finalidade comercial.","D":"elimina os direitos dos titulares."},"gabarito":"B","comentario":"A LGPD admite compartilhamentos no setor público, mas exige finalidade pública, vinculação a competências legais e observância dos princípios, direitos dos titulares e demais requisitos legais. A circulação de dados não é irrestrita.","referencia":"Lei nº 13.709/2018, arts. 23 a 27.","tags":["legislacao","lgpd","uso_compartilhado_pelo_poder_publico"]},{"id":"LEG044","area":"Legislação e Ética no Serviço Público","tema":"LGPD","subtema":"Segurança desde a concepção","dificuldade":"dificil","enunciado":"Uma equipe afirma que medidas de proteção de dados só precisam ser incorporadas depois que um sistema público entrar em produção. À luz da LGPD, essa orientação é","alternativas":{"A":"correta para sistemas públicos.","B":"correta desde que não sejam tratados dados sensíveis.","C":"obrigatória para reduzir custos.","D":"incorreta, pois as medidas de segurança devem ser observadas desde a fase de concepção do produto ou serviço até sua execução."},"gabarito":"D","comentario":"A LGPD incorpora uma abordagem preventiva de segurança. O art. 46 determina que as medidas pertinentes sejam consideradas desde a concepção, não apenas depois que o tratamento estiver em funcionamento.","referencia":"Lei nº 13.709/2018, art. 46, § 2º.","tags":["legislacao","lgpd","seguranca_desde_a_concepcao"]},{"id":"LEG045","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Diretriz de publicidade","dificuldade":"intermediaria","enunciado":"A interpretação da LAI deve observar como diretriz geral que","alternativas":{"A":"a publicidade é a regra e o sigilo constitui exceção juridicamente justificada.","B":"o sigilo administrativo é a regra e a publicidade depende de autorização do gestor.","C":"o cidadão precisa demonstrar interesse jurídico direto para obter qualquer informação pública.","D":"somente informações orçamentárias estão sujeitas à transparência."},"gabarito":"A","comentario":"A LAI estrutura o acesso à informação a partir da máxima divulgação e da publicidade como regra, reservando o sigilo às hipóteses legalmente justificadas. Essa lógica impede que a Administração transforme o segredo em prática ordinária.","referencia":"Lei nº 12.527/2011, art. 3º.","tags":["legislacao","lai","diretriz_de_publicidade"]},{"id":"LEG046","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Informação pessoal","dificuldade":"intermediaria","enunciado":"Para a LAI, informação pessoal é aquela","alternativas":{"A":"classificada necessariamente como ultrassecreta.","B":"produzida somente por servidores efetivos.","C":"relativa exclusivamente à remuneração de agentes públicos.","D":"relacionada à pessoa natural identificada ou identificável."},"gabarito":"D","comentario":"A definição de informação pessoal na LAI está ligada à pessoa natural identificada ou identificável. Informação pessoal e informação classificada por motivo de segurança da sociedade ou do Estado são categorias jurídicas distintas.","referencia":"Lei nº 12.527/2011, art. 4º, IV.","tags":["legislacao","lai","informacao_pessoal"]},{"id":"LEG047","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Integridade da informação","dificuldade":"dificil","enunciado":"Uma informação pública foi modificada sem autorização, comprometendo a correspondência com seu conteúdo original. À luz dos conceitos da LAI, foi afetada principalmente a qualidade denominada","alternativas":{"A":"primariedade.","B":"disponibilidade.","C":"autenticidade.","D":"integridade."},"gabarito":"D","comentario":"Integridade é a qualidade da informação não modificada, inclusive quanto à origem, trânsito e destino. Autenticidade, por sua vez, está relacionada à identificação de quem produziu, expediu, recebeu ou modificou a informação.","referencia":"Lei nº 12.527/2011, art. 4º, VII e VIII.","tags":["legislacao","lai","integridade_da_informacao"]},{"id":"LEG048","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Transparência ativa","dificuldade":"dificil","enunciado":"A Prefeitura entende que somente deve divulgar informações de interesse coletivo depois de receber pedido individual de um cidadão. A posição é incompatível com a LAI porque","alternativas":{"A":"os órgãos públicos possuem dever de promover, independentemente de requerimento, a divulgação de informações de interesse coletivo ou geral produzidas ou custodiadas por eles.","B":"todos os documentos públicos devem ser enviados individualmente a cada cidadão.","C":"a LAI elimina qualquer hipótese de restrição de acesso.","D":"somente o Poder Judiciário pode manter informações em seus sites."},"gabarito":"A","comentario":"A transparência ativa consiste justamente na divulgação espontânea de informações de interesse coletivo ou geral, sem necessidade de pedido prévio. Ela complementa a transparência passiva, decorrente dos pedidos formulados pelos interessados.","referencia":"Lei nº 12.527/2011, art. 8º.","tags":["legislacao","lai","transparencia_ativa"]},{"id":"LEG049","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Acesso parcial","dificuldade":"intermediaria","enunciado":"Um documento possui trechos legalmente protegidos por sigilo, mas o restante pode ser divulgado. Segundo a LAI, o órgão deve","alternativas":{"A":"negar automaticamente acesso ao documento inteiro.","B":"destruir a parte sigilosa antes da análise.","C":"assegurar acesso à parte não sigilosa, utilizando meio adequado para ocultar o conteúdo protegido.","D":"divulgar integralmente o documento, pois não existe sigilo parcial."},"gabarito":"C","comentario":"A existência de conteúdo parcialmente sigiloso não autoriza negar tudo. A LAI assegura acesso à parcela não protegida, inclusive mediante certidão, extrato ou cópia com ocultação da parte sob sigilo.","referencia":"Lei nº 12.527/2011, art. 7º, § 2º.","tags":["legislacao","lai","acesso_parcial"]},{"id":"LEG050","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Pedido de acesso","dificuldade":"facil","enunciado":"Ao formular pedido de informação de interesse público, o requerente","alternativas":{"A":"deve apresentar justificativa detalhada demonstrando por que deseja a informação.","B":"não pode ser obrigado a indicar os motivos determinantes de sua solicitação.","C":"deve demonstrar interesse processual.","D":"somente pode apresentar o pedido presencialmente."},"gabarito":"B","comentario":"A LAI veda exigências relativas aos motivos determinantes do pedido de informação de interesse público. O pedido deve conter identificação do requerente e especificação da informação, sem imposição de justificativa sobre a finalidade da solicitação.","referencia":"Lei nº 12.527/2011, art. 10, caput e § 3º.","tags":["legislacao","lai","pedido_de_acesso"]},{"id":"LEG051","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Prazo de resposta","dificuldade":"intermediaria","enunciado":"Não sendo possível conceder acesso imediato à informação disponível, o órgão público, nos termos da LAI, deverá adotar as providências previstas em lei em prazo não superior a","alternativas":{"A":"5 dias.","B":"20 dias.","C":"30 dias improrrogáveis.","D":"60 dias."},"gabarito":"B","comentario":"Quando o acesso imediato não for possível, a LAI fixa prazo de até 20 dias para a resposta prevista no art. 11. Esse prazo pode ser prorrogado por mais 10 dias mediante justificativa expressa e ciência do requerente.","referencia":"Lei nº 12.527/2011, art. 11, §§ 1º e 2º.","tags":["legislacao","lai","prazo_de_resposta"]},{"id":"LEG052","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Órgão que não possui a informação","dificuldade":"dificil","enunciado":"Um cidadão solicita informação ao órgão X. Após análise, verifica-se que X não possui o documento, mas sabe que a informação está sob custódia do órgão Y. Segundo a LAI, a solução adequada é","alternativas":{"A":"arquivar silenciosamente o pedido.","B":"declarar o pedido juridicamente inexistente.","C":"exigir novo pedido sem prestar qualquer orientação.","D":"comunicar que não possui a informação e, sendo conhecido o órgão competente, indicá-lo ou remeter o requerimento, cientificando o interessado."},"gabarito":"D","comentario":"A LAI busca efetividade do acesso. Se o órgão não detém a informação, deve comunicar esse fato e, se souber quem a possui, indicar o órgão ou remeter o pedido, cientificando o requerente.","referencia":"Lei nº 12.527/2011, art. 11, § 1º, III.","tags":["legislacao","lai","orgao_que_nao_possui_a_informacao"]},{"id":"LEG053","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Negativa de acesso","dificuldade":"dificil","enunciado":"Um pedido é parcialmente negado por envolver conteúdo protegido. A Administração apenas escreve \"pedido indeferido\", sem indicar fundamento nem possibilidade de impugnação. A conduta é inadequada porque","alternativas":{"A":"toda negativa deve ser decidida pelo Poder Judiciário.","B":"a informação protegida deveria ser destruída.","C":"a LAI exige indicação das razões da recusa e, nas hipóteses pertinentes, informação sobre recurso, prazo, condições e autoridade competente.","D":"o acesso nunca pode ser negado."},"gabarito":"C","comentario":"A negativa de acesso precisa ser motivada. Quando houver restrição decorrente de sigilo, o requerente deve ser informado também sobre mecanismos recursais. Isso concretiza transparência, controle e devido procedimento administrativo.","referencia":"Lei nº 12.527/2011, art. 11, § 1º, II, e § 4º.","tags":["legislacao","lai","negativa_de_acesso"]},{"id":"LEG054","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Acesso imediato","dificuldade":"facil","enunciado":"Se a informação solicitada estiver disponível e puder ser fornecida imediatamente, a regra da LAI é que o órgão","alternativas":{"A":"aguarde obrigatoriamente vinte dias.","B":"autorize ou conceda o acesso imediato.","C":"encaminhe o pedido ao Poder Judiciário.","D":"exija pagamento de taxa de análise."},"gabarito":"B","comentario":"O prazo de até 20 dias não deve ser usado automaticamente. A regra é conceder acesso imediato quando possível. O prazo subsidiário é utilizado quando a resposta imediata não puder ser fornecida.","referencia":"Lei nº 12.527/2011, art. 11, caput.","tags":["legislacao","lai","acesso_imediato"]},{"id":"LEG055","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Tutela de direitos fundamentais","dificuldade":"intermediaria","enunciado":"Nos termos da LAI, o acesso à informação necessária à tutela judicial ou administrativa de direitos fundamentais","alternativas":{"A":"depende sempre de autorização do chefe do Executivo.","B":"pode ser negado livremente com base em conveniência.","C":"somente é assegurado a advogados.","D":"não poderá ser negado com fundamento genérico de sigilo."},"gabarito":"D","comentario":"A LAI estabelece proteção especial às informações necessárias à tutela de direitos fundamentais. Também impede restrição de acesso a documentos relativos a violações de direitos humanos praticadas por agentes públicos ou a mando de autoridades.","referencia":"Lei nº 12.527/2011, art. 21.","tags":["legislacao","lai","tutela_de_direitos_fundamentais"]},{"id":"LEG056","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Graus de classificação","dificuldade":"intermediaria","enunciado":"Quanto ao grau de sigilo previsto na LAI para informações cuja restrição seja necessária à segurança da sociedade ou do Estado, são categorias legalmente previstas","alternativas":{"A":"confidencial, secreto e reservado.","B":"administrativo, funcional e estratégico.","C":"privado, confidencial e ultrassecreto.","D":"ultrassecreto, secreto e reservado."},"gabarito":"D","comentario":"A LAI estabelece três graus de classificação: ultrassecreto, secreto e reservado. Não se deve criar categorias de sigilo sem base legal.","referencia":"Lei nº 12.527/2011, art. 24.","tags":["legislacao","lai","graus_de_classificacao"]},{"id":"LEG057","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Prazos máximos de sigilo","dificuldade":"dificil","enunciado":"Associe corretamente o grau de classificação ao prazo máximo originariamente previsto na LAI: ultrassecreta, secreta e reservada.","alternativas":{"A":"25 anos, 15 anos e 5 anos, respectivamente.","B":"30 anos, 20 anos e 10 anos, respectivamente.","C":"20 anos, 10 anos e 5 anos, respectivamente.","D":"15 anos, 10 anos e 2 anos, respectivamente."},"gabarito":"A","comentario":"O art. 24 fixa como prazos máximos, contados da produção da informação, 25 anos para ultrassecreta, 15 para secreta e 5 para reservada, sem prejuízo das demais regras legais sobre termo final e reavaliação.","referencia":"Lei nº 12.527/2011, art. 24, § 1º.","tags":["legislacao","lai","prazos_maximos_de_sigilo"]},{"id":"LEG058","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Hipóteses de classificação","dificuldade":"intermediaria","enunciado":"Uma informação pode ser classificada sob fundamento de segurança da sociedade ou do Estado quando sua divulgação irrestrita puder, entre outras hipóteses,","alternativas":{"A":"causar mero constrangimento político ao gestor.","B":"pôr em risco a vida, a segurança ou a saúde da população.","C":"revelar erro administrativo sem risco juridicamente relevante.","D":"gerar críticas nas redes sociais."},"gabarito":"B","comentario":"A classificação depende de enquadramento em hipóteses legais, como risco à defesa, soberania, relações internacionais, vida, segurança ou saúde da população, estabilidade econômica ou atividades de inteligência e investigação. Conveniência política não é fundamento suficiente.","referencia":"Lei nº 12.527/2011, art. 23.","tags":["legislacao","lai","hipoteses_de_classificacao"]},{"id":"LEG059","area":"Legislação e Ética no Serviço Público","tema":"Lei de Acesso à Informação","subtema":"Responsabilidade por negativa infundada","dificuldade":"intermediaria","enunciado":"Servidor responsável nega, sem qualquer fundamento, pedido de acesso a informação pública abrangida pela LAI. A legislação estabelece que a negativa não fundamentada","alternativas":{"A":"é irrelevante juridicamente.","B":"gera automaticamente pena criminal de prisão.","C":"é legítima sempre que decorrer de ordem verbal de superior.","D":"pode sujeitar o responsável às medidas disciplinares previstas na legislação."},"gabarito":"D","comentario":"A LAI exige motivação das restrições de acesso. A negativa não fundamentada pode gerar responsabilização disciplinar, sem prejuízo de outras consequências cabíveis conforme a situação concreta e o regime jurídico aplicável.","referencia":"Lei nº 12.527/2011, art. 7º, § 4º, e art. 32.","tags":["legislacao","lai","responsabilidade_por_negativa_infundada"]},{"id":"LEG060","area":"Legislação e Ética no Serviço Público","tema":"Ética no Serviço Público","subtema":"Ética na função pública","dificuldade":"dificil","enunciado":"Um servidor identifica duas formas juridicamente possíveis de executar determinada tarefa. A primeira favorece interesse pessoal de amigo do servidor sem benefício institucional; a segunda atende objetivamente ao interesse público. Sob perspectiva ética e administrativa, a conduta mais adequada é","alternativas":{"A":"escolher livremente qualquer opção, pois ambas são juridicamente possíveis.","B":"preferir a alternativa do amigo porque relações pessoais também integram a vida administrativa.","C":"dividir o benefício entre os interessados sem critério.","D":"adotar a solução orientada pelo interesse público, impessoalidade e moralidade, afastando favorecimento pessoal."},"gabarito":"D","comentario":"A atuação pública não se satisfaz apenas com a ausência de proibição expressa. O agente deve orientar suas escolhas pelos princípios administrativos e pela finalidade pública. Favorecer pessoa próxima sem critério objetivo viola impessoalidade e compromete a moralidade.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","etica","etica_na_funcao_publica"]},{"id":"LEG061","area":"Legislação e Ética no Serviço Público","tema":"Ética n
