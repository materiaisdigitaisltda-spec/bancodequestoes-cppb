  <title>500 Questões — Prefeitura de Campina Grande-PB 2026</title>
    <style>
:root {
  --green: #00705E;
  --green-deep: #006D34;
  --green-soft: #E3F2ED;
  --yellow: #FFCC00;
  --teal: #009660;
  --sky: #F2EC00;
  --text: #42564E;
  --text-strong: #24332D;
  --muted: #6E7E77;
  --bg: #F3F8F5;
  --surface: #FFFFFF;
  --surface-2: #F8FBF9;
  --border: #D8E7E0;
  --success: #009660;
  --success-bg: #E1F5ED;
  --danger: #C94949;
  --danger-bg: #FDECEC;
  --warning: #8B7100;
  --warning-bg: #FFF8D8;
  --info-bg: #E4F4EE;
  --shadow: 0 10px 30px rgba(0, 112, 94, .09);
  --shadow-lg: 0 18px 50px rgba(0, 109, 52, .14);
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar: 250px;
  --content-max: 1220px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --green: #009660;
    --green-deep: #FFCC00;
    --green-soft: #183A31;
    --yellow: #FFCC00;
    --teal: #00B574;
    --sky: #F2EC00;
    --text: #E3EEE9;
    --text-strong: #FFFFFF;
    --muted: #ABC0B7;
    --bg: #0F1915;
    --surface: #17251F;
    --surface-2: #1C2D26;
    --border: #2A4338;
    --success: #35C98B;
    --success-bg: #17382C;
    --danger: #F08C8C;
    --danger-bg: #3A2020;
    --warning: #FFDC4D;
    --warning-bg: #39331A;
    --info-bg: #18372E;
    --shadow: 0 10px 30px rgba(0, 0, 0, .20);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .30);
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--teal) 70%, transparent); outline-offset: 2px; }

.app-shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  border: 0;
  background: transparent;
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  padding: 4px 6px 18px;
  cursor: pointer;
}
.brand img { width: 54px; height: 54px; object-fit: contain; border-radius: 14px; }
.brand-copy { min-width: 0; display: flex; flex-direction: column; }
.brand-copy strong { color: var(--text-strong); font-size: .92rem; letter-spacing: -.01em; }
.brand-copy small { line-height: 1.25; }
.brand-copy small { color: var(--muted); }
.side-nav { display: grid; gap: 5px; }
.nav-item {
  border: 0;
  background: transparent;
  padding: 11px 12px;
  border-radius: 12px;
  text-align: left;
  display: flex;
  gap: 10px;
  align-items: center;
  cursor: pointer;
  color: var(--text);
  transition: .16s ease;
}
.nav-item span { width: 20px; text-align: center; font-weight: 700; }
.nav-item:hover { background: var(--surface-2); color: var(--green); }
.nav-item.is-active { background: var(--green-soft); color: var(--green); font-weight: 700; }
.sidebar-footer { margin-top: auto; padding: 12px 6px 4px; }
.bank-status { font-size: .78rem; color: var(--muted); line-height: 1.35; }

.main-column { grid-column: 2; min-width: 0; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 82px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
  padding: 14px clamp(18px, 3vw, 38px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.eyebrow { margin: 0 0 2px; font-size: .72rem; color: var(--green); text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
.topbar h1 { margin: 0; color: var(--text-strong); font-size: clamp(1.25rem, 2vw, 1.65rem); letter-spacing: -.03em; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.today-goal { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.icon-btn { display: none; border: 1px solid var(--border); background: var(--surface); border-radius: 11px; width: 42px; height: 42px; cursor: pointer; }

.content { width: min(100%, var(--content-max)); margin: 0 auto; padding: 28px clamp(18px, 3vw, 38px) 80px; }
.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-head h2, .section h2 { margin: 0; color: var(--text-strong); font-size: 1.15rem; letter-spacing: -.02em; }
.section-head p, .section-subtitle { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--green) 12%, var(--surface)), var(--surface));
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: clamp(22px, 4vw, 38px);
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 1.35fr .65fr;
  align-items: center;
  gap: 26px;
}
.hero::after {
  content: "";
  position: absolute;
  width: 270px; height: 270px;
  border-radius: 50%;
  right: -95px; top: -125px;
  background: color-mix(in srgb, var(--sky) 22%, transparent);
}
.hero-copy { position: relative; z-index: 1; }
.hero-kicker { display: inline-flex; align-items: center; gap: 7px; background: var(--green-soft); color: var(--green); padding: 6px 10px; border-radius: 999px; font-size: .78rem; font-weight: 800; }
.hero h2 { margin: 12px 0 8px; font-size: clamp(1.6rem, 3vw, 2.35rem); color: var(--text-strong); line-height: 1.12; letter-spacing: -.04em; }
.hero p { margin: 0; max-width: 680px; color: var(--muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.hero-art { position: relative; z-index: 1; display: flex; justify-content: center; }
.hero-art img { width: min(100%, 210px); filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .10)); }

.btn {
  border: 1px solid transparent;
  border-radius: 12px;
  min-height: 44px;
  padding: 10px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 750;
  transition: transform .13s ease, box-shadow .13s ease, background .13s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--green); color: #fff; box-shadow: 0 7px 18px color-mix(in srgb, var(--green) 20%, transparent); }
.btn-primary:hover { background: color-mix(in srgb, var(--green) 88%, #000); }
.btn-secondary { background: var(--surface); color: var(--green); border-color: var(--border); }
.btn-secondary:hover { border-color: color-mix(in srgb, var(--green) 45%, var(--border)); }
.btn-soft { background: var(--green-soft); color: var(--green); }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-sm { min-height: 36px; padding: 7px 11px; border-radius: 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.stat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat-card, .card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stat-card { padding: 18px; min-width: 0; }
.stat-label { color: var(--muted); font-size: .78rem; }
.stat-value { margin-top: 5px; color: var(--text-strong); font-weight: 850; font-size: clamp(1.35rem, 2.4vw, 1.75rem); letter-spacing: -.03em; }
.stat-note { margin-top: 2px; font-size: .76rem; color: var(--muted); }

.progress-wrap { margin-top: 16px; }
.progress-track { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--border) 75%, transparent); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--teal)); border-radius: 999px; transition: width .35s ease; }
.progress-labels { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .78rem; margin-top: 7px; }

.subject-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.subject-card { padding: 18px; display: flex; flex-direction: column; min-height: 178px; }
.subject-badge { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-weight: 900; }
.subject-card h3 { margin: 13px 0 5px; color: var(--text-strong); font-size: .98rem; line-height: 1.3; }
.subject-card p { margin: 0 0 14px; color: var(--muted); font-size: .82rem; }
.subject-card .btn { margin-top: auto; width: 100%; }

.two-col { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.card { padding: 20px; }
.card h3 { margin: 0 0 8px; color: var(--text-strong); font-size: 1rem; }
.card p { color: var(--muted); }
.card-flat { box-shadow: none; }

.action-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.action-card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  padding: 16px;
  text-align: left;
  cursor: pointer;
  transition: .16s ease;
}
.action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--green) 35%, var(--border)); }
.action-card strong { display: block; color: var(--text-strong); margin-bottom: 4px; }
.action-card span { color: var(--muted); font-size: .82rem; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-field { display: grid; gap: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: .8rem; font-weight: 750; color: var(--text-strong); }
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-strong);
  border-radius: 11px;
  min-height: 44px;
  padding: 9px 11px;
}
.input::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--teal); outline: 3px solid color-mix(in srgb, var(--teal) 15%, transparent); }
.field-hint { font-size: .75rem; color: var(--muted); }
.inline-check { display: flex; gap: 9px; align-items: center; min-height: 44px; }
.inline-check input { width: 18px; height: 18px; accent-color: var(--green); }

.filter-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; margin-top: 16px; }
.filter-summary strong { color: var(--green); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 9px; font-size: .74rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
.chip.easy { background: var(--success-bg); color: var(--success); border-color: transparent; }
.chip.medium { background: var(--info-bg); color: var(--teal); border-color: transparent; }
.chip.hard { background: var(--warning-bg); color: var(--warning); border-color: transparent; }

.list { display: grid; gap: 10px; }
.list-item { border: 1px solid var(--border); border-radius: 13px; background: var(--surface); padding: 13px 14px; display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.list-item-main { min-width: 0; }
.list-item-title { color: var(--text-strong); font-weight: 750; overflow-wrap: anywhere; }
.list-item-sub { color: var(--muted); font-size: .8rem; margin-top: 3px; }
.list-item-actions { flex: none; display: flex; gap: 8px; }

.empty-state { text-align: center; padding: 36px 20px; border: 1px dashed var(--border); border-radius: 16px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.empty-state .empty-icon { font-size: 2rem; }
.empty-state h3 { margin: 8px 0 4px; color: var(--text-strong); }
.empty-state p { margin: 0 auto 15px; max-width: 520px; color: var(--muted); }

.alert { border-radius: 13px; padding: 12px 14px; border: 1px solid var(--border); font-size: .86rem; }
.alert-info { background: var(--info-bg); }
.alert-warning { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.alert-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.alert-success { background: var(--success-bg); color: var(--success); border-color: transparent; }

/* Question experience */
.session-shell { max-width: 920px; margin: 0 auto; }
.session-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
.session-progress { flex: 1; }
.session-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .82rem; white-space: nowrap; }
.question-card { padding: clamp(18px, 3.5vw, 30px); }
.question-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.question-index { color: var(--green); font-weight: 850; font-size: .84rem; }
.favorite-btn { border: 1px solid var(--border); background: var(--surface-2); width: 42px; height: 42px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; }
.favorite-btn.is-favorite { color: #C59B00; background: var(--warning-bg); border-color: transparent; }
.question-text { white-space: pre-wrap; color: var(--text-strong); font-size: clamp(1rem, 1.7vw, 1.12rem); line-height: 1.68; margin: 18px 0 22px; }
.alternatives { display: grid; gap: 10px; }
.alternative { position: relative; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 13px 13px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); transition: .14s ease; }
.alternative.can-select { cursor: pointer; }
.alternative.can-select:hover { border-color: color-mix(in srgb, var(--green) 40%, var(--border)); background: color-mix(in srgb, var(--green-soft) 45%, var(--surface)); }
.alt-letter { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); color: var(--text-strong); font-weight: 850; background: var(--surface-2); }
.alt-text { color: var(--text-strong); line-height: 1.5; white-space: pre-wrap; }
.alt-cut { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 8px; border-radius: 8px; font-size: .76rem; }
.alt-cut:hover { background: var(--surface-2); color: var(--danger); }
.alternative.selected { border-color: var(--green); box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 13%, transparent); }
.alternative.selected .alt-letter { background: var(--green); color: white; border-color: var(--green); }
.alternative.cut .alt-text { text-decoration: line-through; opacity: .45; }
.alternative.cut { opacity: .68; }
.alternative.correct { background: var(--success-bg); border-color: color-mix(in srgb, var(--success) 45%, transparent); }
.alternative.correct .alt-letter { background: var(--success); color: #fff; border-color: var(--success); }
.alternative.incorrect { background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.alternative.incorrect .alt-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
.question-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.feedback-panel { margin-top: 18px; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
.feedback-head { padding: 12px 15px; font-weight: 850; }
.feedback-head.correct { background: var(--success-bg); color: var(--success); }
.feedback-head.incorrect { background: var(--danger-bg); color: var(--danger); }
.feedback-body { padding: 16px; background: var(--surface-2); }
.feedback-body h4 { margin: 0 0 5px; color: var(--text-strong); }
.feedback-body p { margin: 0 0 14px; white-space: pre-wrap; color: var(--text); }
.reference { padding-top: 11px; border-top: 1px solid var(--border); color: var(--muted); font-size: .84rem; white-space: pre-wrap; }

/* Exam */
.exam-layout { display: grid; grid-template-columns: minmax(0,1fr) 230px; gap: 16px; align-items: start; }
.exam-sidebar { position: sticky; top: 100px; }
.exam-timer { font-size: 1.25rem; font-weight: 900; color: var(--text-strong); text-align: center; margin-bottom: 12px; }
.exam-timer.low { color: var(--danger); }
.exam-nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.exam-nav-btn { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); cursor: pointer; font-size: .8rem; }
.exam-nav-btn.answered { background: var(--green-soft); color: var(--green); border-color: transparent; font-weight: 800; }
.exam-nav-btn.current { background: var(--green); color: #fff; border-color: var(--green); }
.exam-side-actions { display: grid; gap: 8px; margin-top: 13px; }

.result-hero { padding: 26px; text-align: center; }
.result-score { font-size: clamp(2.4rem, 8vw, 4.6rem); line-height: 1; color: var(--green); font-weight: 950; letter-spacing: -.06em; }
.result-title { color: var(--text-strong); font-size: 1.15rem; font-weight: 800; margin-top: 8px; }
.result-sub { color: var(--muted); margin-top: 4px; }
.result-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-top: 18px; }
.result-grid > div { background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 13px; }
.result-grid strong { display: block; color: var(--text-strong); font-size: 1.15rem; }
.result-grid span { font-size: .75rem; color: var(--muted); }

.performance-row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(160px, 2fr) 70px; gap: 12px; align-items: center; padding: 9px 0; }
.performance-row + .performance-row { border-top: 1px solid var(--border); }
.performance-name { color: var(--text-strong); font-size: .84rem; }
.performance-value { text-align: right; font-size: .82rem; font-weight: 800; color: var(--text-strong); }
.mini-track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.mini-fill { height: 100%; border-radius: 999px; background: var(--green); }
.mini-fill.review { background: var(--yellow); }

.search-results { max-height: 310px; overflow: auto; display: grid; gap: 7px; margin-top: 10px; }
.search-result { border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 10px 11px; }
.search-result strong { color: var(--text-strong); font-size: .8rem; }
.search-result p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 680px; background: var(--surface); }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: .82rem; vertical-align: top; }
th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); }
td { color: var(--text); }
tr:last-child td { border-bottom: 0; }

.toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: grid; gap: 8px; max-width: min(380px, calc(100vw - 36px)); }
.toast { background: var(--text-strong); color: var(--surface); padding: 11px 14px; border-radius: 12px; box-shadow: var(--shadow-lg); font-size: .84rem; animation: toastIn .2s ease; }
.toast.success { background: var(--success); color: white; }
.toast.error { background: var(--danger); color: white; }
@keyframes toastIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

.modal-root:empty { display: none; }
.modal-root { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 18px; background: rgba(8, 18, 12, .52); backdrop-filter: blur(4px); }
.modal { width: min(100%, 520px); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg); padding: 22px; }
.modal h3 { margin: 0 0 8px; color: var(--text-strong); }
.modal p { margin: 0; color: var(--muted); white-space: pre-wrap; }
.modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; flex-wrap: wrap; }

.mobile-nav { display: none; }
.noscript { padding: 18px; background: var(--danger-bg); color: var(--danger); }

.skeleton { border-radius: 10px; min-height: 20px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

@media (max-width: 1100px) {
  .stat-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .subject-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .exam-layout { grid-template-columns: minmax(0,1fr) 200px; }
}

@media (max-width: 900px) {
  :root { --sidebar: 220px; }
  .hero { grid-template-columns: 1fr; }
  .hero-art { display: none; }
  .two-col { grid-template-columns: 1fr; }
  .three-col, .action-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .exam-layout { grid-template-columns: 1fr; }
  .exam-sidebar { position: static; order: -1; }
  .exam-nav-grid { grid-template-columns: repeat(10, 1fr); }
}

@media (max-width: 760px) {
  body { padding-bottom: 68px; }
  .app-shell { display: block; }
  .main-column { width: 100%; }
  .sidebar {
    transform: translateX(-105%);
    transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  body.menu-open .sidebar { transform: translateX(0); }
  .icon-btn { display: inline-grid; place-items: center; }
  .mobile-nav {
    position: fixed;
    left: 10px; right: 10px; bottom: 9px;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 5px;
  }
  .mobile-nav button { border: 0; background: transparent; color: var(--muted); padding: 6px 3px; border-radius: 10px; display: grid; gap: 1px; place-items: center; cursor: pointer; font-size: 1rem; }
  .mobile-nav button span { font-size: .62rem; }
  .mobile-nav button.is-active { background: var(--green-soft); color: var(--green); }
  .topbar { min-height: 70px; padding: 10px 16px; }
  .today-goal { display: none; }
  .content { padding: 18px 14px 40px; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat-card:last-child { grid-column: 1 / -1; }
  .form-grid { grid-template-columns: 1fr; }
  .form-field.full { grid-column: auto; }
  .question-card { border-radius: 16px; }
  .alternative { grid-template-columns: 31px 1fr; }
  .alt-cut { grid-column: 2; justify-self: start; padding-left: 0; }
  .question-actions { position: sticky; bottom: 74px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); padding: 8px 0; z-index: 5; }
  .question-actions .btn { flex: 1; }
  .performance-row { grid-template-columns: 1fr 60px; }
  .performance-row .mini-track { grid-column: 1 / -1; grid-row: 2; }
  .result-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 520px) {
  .hero { padding: 20px; border-radius: 18px; }
  .hero-actions .btn { width: 100%; }
  .subject-grid, .three-col, .action-grid { grid-template-columns: 1fr; }
  .stat-grid { gap: 9px; }
  .stat-card { padding: 14px; }
  .filter-summary { align-items: flex-start; flex-direction: column; }
  .session-top { align-items: flex-start; flex-direction: column; }
  .session-meta { width: 100%; justify-content: space-between; }
  .exam-nav-grid { grid-template-columns: repeat(6, 1fr); }
  .modal-actions .btn { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

</style>

/* ===== database.js ===== */
const DB_NAME = 'campina-grande-pb-2026-500q-db';
const DB_VERSION = 1;

const STORES = {
  attempts: { keyPath: 'attemptId' },
  questionStats: { keyPath: 'questionId' },
  favorites: { keyPath: 'questionId' },
  trainingHistory: { keyPath: 'id' },
  examHistory: { keyPath: 'id' },
  activeSessions: { keyPath: 'type' },
  settings: { keyPath: 'key' }
};

let dbPromise;

function initDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      for (const [name, opts] of Object.entries(STORES)) {
        if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, opts);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => console.warn('IndexedDB bloqueado por outra aba.');
  });
  return dbPromise;
}

async function withStore(storeName, mode, action) {
  const db = await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    let request;
    let result;
    let settled = false;
    const fail = error => {
      if (settled) return;
      settled = true;
      reject(error || tx.error || new Error('Falha ao acessar o armazenamento local.'));
    };
    try {
      request = action(store);
      if (request && typeof request.onsuccess !== 'undefined') {
        request.onsuccess = () => { result = request.result; };
        request.onerror = () => fail(request.error);
      } else {
        result = request;
      }
    } catch (error) {
      fail(error);
      try { tx.abort(); } catch {}
      return;
    }
    tx.oncomplete = () => {
      if (settled) return;
      settled = true;
      resolve(result);
    };
    tx.onerror = () => fail(tx.error);
    tx.onabort = () => fail(tx.error);
  });
}

const dbGet = (store, key) => withStore(store, 'readonly', s => s.get(key));
const dbGetAll = store => withStore(store, 'readonly', s => s.getAll());
const dbPut = (store, value) => withStore(store, 'readwrite', s => s.put(value));
const dbDelete = (store, key) => withStore(store, 'readwrite', s => s.delete(key));
const dbClear = store => withStore(store, 'readwrite', s => s.clear());

function databaseUid(prefix) {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

async function recordAttempt({ questionId, selected, correctAnswer, mode = 'training', sessionId = null, timestamp = new Date().toISOString(), attemptId = null }) {
  if (typeof questionId !== 'string' || !questionId.trim()) throw new Error('Questão inválida para registro da tentativa.');
  if (!['A','B','C','D'].includes(selected) || !['A','B','C','D'].includes(correctAnswer)) throw new Error('Alternativa inválida para registro da tentativa.');
  if (!['training','exam'].includes(mode)) throw new Error('Modo de tentativa inválido.');
  if (Number.isNaN(Date.parse(timestamp))) throw new Error('Data da tentativa inválida.');
  const stableAttemptId = attemptId || databaseUid('attempt');
  const db = await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['attempts', 'questionStats'], 'readwrite');
    const attempts = tx.objectStore('attempts');
    const statsStore = tx.objectStore('questionStats');
    let result = null;

    const existingReq = attempts.get(stableAttemptId);
    existingReq.onsuccess = () => {
      if (existingReq.result) {
        const existing = existingReq.result;
        const sameAttempt = existing.questionId === questionId && existing.selected === selected && existing.correctAnswer === correctAnswer && existing.mode === mode && (existing.sessionId ?? null) === (sessionId ?? null);
        if (!sameAttempt) {
          reject(new Error('Conflito detectado no identificador da tentativa. Recarregue a página antes de continuar.'));
          try { tx.abort(); } catch {}
          return;
        }
        result = existing;
        return;
      }

      const correct = selected === correctAnswer;
      const attempt = {
        attemptId: stableAttemptId,
        questionId,
        selected,
        correctAnswer,
        correct,
        mode,
        sessionId,
        timestamp
      };
      result = attempt;
      attempts.put(attempt);

      const getStats = statsStore.get(questionId);
      getStats.onsuccess = () => {
        const prev = getStats.result || {
          questionId,
          attempts: 0,
          correct: 0,
          wrong: 0,
          lastAttempt: null,
          lastSelected: null,
          lastCorrect: null,
          correctedAfterError: false,
          correctAfterError: 0
        };
        const hadWrong = Number(prev.wrong || 0) > 0;
        const next = {
          ...prev,
          attempts: Number(prev.attempts || 0) + 1,
          correct: Number(prev.correct || 0) + (correct ? 1 : 0),
          wrong: Number(prev.wrong || 0) + (correct ? 0 : 1),
          lastAttempt: timestamp,
          lastSelected: selected,
          lastCorrect: correct,
          correctedAfterError: Boolean(prev.correctedAfterError || (hadWrong && correct)),
          correctAfterError: Number(prev.correctAfterError || 0) + (hadWrong && correct ? 1 : 0)
        };
        statsStore.put(next);
      };
    };
    existingReq.onerror = () => reject(existingReq.error);
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function getQuestionStatsMap() {
  const rows = await dbGetAll('questionStats');
  return Object.fromEntries(rows.map(row => [row.questionId, row]));
}

async function getAttempts() {
  return dbGetAll('attempts');
}

async function toggleFavorite(questionId) {
  const current = await dbGet('favorites', questionId);
  if (current) {
    await dbDelete('favorites', questionId);
    return false;
  }
  await dbPut('favorites', { questionId, savedAt: new Date().toISOString() });
  return true;
}

async function isFavorite(questionId) {
  return Boolean(await dbGet('favorites', questionId));
}

async function getFavoritesSet() {
  const rows = await dbGetAll('favorites');
  return new Set(rows.map(row => row.questionId));
}

async function saveTrainingHistory(record) {
  const value = { id: record.id || databaseUid('training'), ...record };
  await dbPut('trainingHistory', value);
  return value;
}

async function getTrainingHistory() {
  const rows = await dbGetAll('trainingHistory');
  return rows.sort((a, b) => String(b.endedAt || b.startedAt).localeCompare(String(a.endedAt || a.startedAt)));
}

async function saveExamHistory(record) {
  const value = { id: record.id || databaseUid('exam'), ...record };
  await dbPut('examHistory', value);
  return value;
}

async function getExamHistory() {
  const rows = await dbGetAll('examHistory');
  return rows.sort((a, b) => String(b.endedAt || b.startedAt).localeCompare(String(a.endedAt || a.startedAt)));
}

async function saveActiveSession(type, data) {
  const cleanData = data && typeof data === 'object' ? { ...data } : data;
  if (cleanData && typeof cleanData === 'object') {
    delete cleanData._confirming;
    delete cleanData._finishing;
  }
  await dbPut('activeSessions', { type, data: cleanData, savedAt: new Date().toISOString() });
}

async function getActiveSession(type) {
  const row = await dbGet('activeSessions', type);
  const data = row?.data || null;
  if (data && typeof data === 'object') {
    delete data._confirming;
    delete data._finishing;
  }
  return data;
}

async function clearActiveSession(type) {
  await dbDelete('activeSessions', type);
}

async function setSetting(key, value) {
  await dbPut('settings', { key, value });
}

async function getSetting(key, fallback = null) {
  const row = await dbGet('settings', key);
  return row ? row.value : fallback;
}

async function exportDatabase() {
  const payload = { version: 1, exportedAt: new Date().toISOString(), stores: {} };
  for (const store of Object.keys(STORES)) payload.stores[store] = await dbGetAll(store);
  return payload;
}

async function importDatabase(payload) {
  if (!payload || payload.version !== 1 || !payload.stores || typeof payload.stores !== 'object') {
    throw new Error('Backup incompatível ou corrompido.');
  }
  const db = await initDB();
  const storeNames = Object.keys(STORES);
  await new Promise((resolve, reject) => {
    const tx = db.transaction(storeNames, 'readwrite');
    for (const storeName of storeNames) {
      const store = tx.objectStore(storeName);
      store.clear();
      const rows = Array.isArray(payload.stores[storeName]) ? payload.stores[storeName] : [];
      for (const row of rows) store.put(row);
    }
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function resetDatabase() {
  const db = await initDB();
  const storeNames = Object.keys(STORES);
  await new Promise((resolve, reject) => {
    const tx = db.transaction(storeNames, 'readwrite');
    for (const storeName of storeNames) tx.objectStore(storeName).clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

 e avaliação subjetiva.","tags":["interpretacao","fato_opiniao"]},{"id":"POR009","area":"Língua Portuguesa","tema":"MAPA 002 - Estruturação do texto e dos parágrafos","subtema":"Tópico frasal","dificuldade":"facil","enunciado":"Considere o parágrafo: \"A arborização urbana melhora a qualidade ambiental das cidades. As árvores oferecem sombra, contribuem para reduzir a temperatura e ajudam a reter partículas do ar.\"\nA primeira frase exerce a função de:","alternativas":{"A":"introduzir uma oposição ao conteúdo do parágrafo.","B":"concluir um argumento iniciado anteriormente.","C":"apresentar a ideia central desenvolvida nas frases seguintes.","D":"apresentar um exemplo específico sem relação com as demais frases."},"gabarito":"C","comentario":"A primeira frase funciona como tópico frasal: enuncia a ideia geral, posteriormente detalhada por benefícios específicos da arborização.","referencia":"Estrutura do parágrafo: tópico frasal e desenvolvimento.","tags":["paragrafo","topico_frasal"]},{"id":"POR010","area":"Língua Portuguesa","tema":"MAPA 002 - Estruturação do texto e dos parágrafos","subtema":"Progressão temática","dificuldade":"intermediaria","enunciado":"Qual sequência produz um parágrafo mais coerente?\nI. Por isso, a equipe decidiu revisar o fluxo de atendimento.\nII. Nas últimas semanas, aumentou o número de reclamações sobre demora.\nIII. A revisão identificou etapas repetidas que podiam ser eliminadas.","alternativas":{"A":"II – I – III","B":"III – II – I","C":"I – II – III","D":"II – III – I"},"gabarito":"A","comentario":"A sequência II–I–III estabelece problema, consequência/decisão e resultado da revisão. O conector 'por isso' exige uma causa anterior, o que impede que I inicie o parágrafo.","referencia":"Organização textual: progressão temática e encadeamento lógico.","tags":["paragrafo","progressao"]},{"id":"POR011","area":"Língua Portuguesa","tema":"MAPA 002 - Estruturação do texto e dos parágrafos","subtema":"Paragrafação","dificuldade":"intermediaria","enunciado":"Em um texto expositivo, um novo parágrafo deve ser iniciado, em regra, quando:","alternativas":{"A":"há mudança relevante de foco, aspecto ou etapa no desenvolvimento da ideia.","B":"o período ultrapassa duas linhas, independentemente do sentido.","C":"aparece obrigatoriamente uma conjunção coordenativa.","D":"surge qualquer palavra repetida."},"gabarito":"A","comentario":"A paragrafação organiza unidades de sentido. A mudança de subtema, argumento, etapa ou foco justifica novo parágrafo; extensão gráfica isolada não é critério suficiente.","referencia":"Organização do texto: unidade temática e paragrafação.","tags":["paragrafo","organizacao_textual"]},{"id":"POR012","area":"Língua Portuguesa","tema":"MAPA 002 - Estruturação do texto e dos parágrafos","subtema":"Coesão entre parágrafos","dificuldade":"dificil","enunciado":"Um texto apresenta, no primeiro parágrafo, dados sobre o aumento do uso de bicicletas. O segundo começa com: \"Esse crescimento, porém, não foi acompanhado pela expansão das ciclovias.\"\nA expressão inicial do segundo parágrafo:","alternativas":{"A":"antecipa uma causa ainda não mencionada e elimina a retomada.","B":"retoma a informação anterior e introduz uma oposição.","C":"resume o segundo parágrafo sem estabelecer vínculo com o primeiro.","D":"inicia um tema sem relação com o primeiro parágrafo."},"gabarito":"B","comentario":"'Esse crescimento' realiza retomada anafórica do aumento mencionado antes; 'porém' introduz contraste entre uso de bicicletas e infraestrutura.","referencia":"Coesão referencial e sequencial entre parágrafos.","tags":["paragrafo","coesao"]},{"id":"POR013","area":"Língua Portuguesa","tema":"MAPA 002 - Estruturação do texto e dos parágrafos","subtema":"Ordem argumentativa","dificuldade":"dificil","enunciado":"Em um texto argumentativo, considere os trechos:\n1. \"Logo, a simples ampliação do horário não basta para melhorar o serviço.\"\n2. \"Dados internos mostram que a maior parte da demora ocorre na etapa de triagem.\"\n3. \"Ampliar o horário de atendimento pode parecer uma solução imediata.\"\nQual ordem melhor estrutura o raciocínio?","alternativas":{"A":"3 – 1 – 2","B":"3 – 2 – 1","C":"2 – 1 – 3","D":"1 – 3 – 2"},"gabarito":"B","comentario":"O trecho 3 apresenta uma hipótese inicial; o 2 oferece evidência que a problematiza; o 1 conclui com 'logo'. Essa ordem preserva introdução, fundamentação e conclusão.","referencia":"Estrutura argumentativa: apresentação de hipótese, evidência e conclusão.","tags":["paragrafo","argumentacao"]},{"id":"POR014","area":"Língua Portuguesa","tema":"MAPA 002 - Estruturação do texto e dos parágrafos","subtema":"Unidade de sentido","dificuldade":"intermediaria","enunciado":"Assinale a frase que prejudicaria a unidade temática de um parágrafo dedicado exclusivamente às vantagens do atendimento digital:","alternativas":{"A":"O atendimento remoto pode reduzir deslocamentos desnecessários.","B":"Formulários bem projetados podem diminuir erros de preenchimento.","C":"Os prédios históricos do centro possuem fachadas de diferentes períodos arquitetônicos.","D":"A consulta on-line permite acompanhar o andamento de solicitações."},"gabarito":"C","comentario":"A frase sobre fachadas históricas não se relaciona ao tópico 'vantagens do atendimento digital' e quebra a unidade temática do parágrafo.","referencia":"Coerência local: unidade temática do parágrafo.","tags":["paragrafo","unidade_tematica"]},{"id":"POR015","area":"Língua Portuguesa","tema":"MAPA 003 - Pronomes e expressões referenciais na articulação textual","subtema":"Retomada pronominal","dificuldade":"facil","enunciado":"Leia: \"A secretaria publicou o relatório ontem. Ele contém os dados consolidados do semestre.\"\nO pronome \"Ele\" retoma:","alternativas":{"A":"o semestre.","B":"a secretaria.","C":"o relatório.","D":"ontem."},"gabarito":"C","comentario":"O pronome pessoal 'ele' estabelece coesão anafórica e retoma o sintagma masculino singular 'o relatório'.","referencia":"Coesão referencial: anáfora pronominal.","tags":["pronomes","coesao_referencial"]},{"id":"POR016","area":"Língua Portuguesa","tema":"MAPA 003 - Pronomes e expressões referenciais na articulação textual","subtema":"Ambiguidade referencial","dificuldade":"intermediaria","enunciado":"Na frase \"Paula avisou Renata de que sua inscrição estava incompleta\", o pronome \"sua\" produz ambiguidade porque:","alternativas":{"A":"não possui antecedente possível na frase.","B":"deveria obrigatoriamente concordar no plural.","C":"pronomes possessivos nunca podem retomar pessoas.","D":"pode referir-se tanto à inscrição de Paula quanto à de Renata."},"gabarito":"D","comentario":"O possessivo 'sua' não distingue, por si só, qual das duas pessoas é a possuidora da inscrição. A reescrita deve explicitar o referente quando a ambiguidade for relevante.","referencia":"Coesão referencial e ambiguidade de pronomes possessivos.","tags":["pronomes","ambiguidade"]},{"id":"POR017","area":"Língua Portuguesa","tema":"MAPA 003 - Pronomes e expressões referenciais na articulação textual","subtema":"Demonstrativos na coesão","dificuldade":"intermediaria","enunciado":"Leia: \"A equipe propôs duas medidas: ampliar o atendimento e simplificar o formulário. Esta pode reduzir erros de preenchimento.\"\nO pronome \"Esta\" refere-se a:","alternativas":{"A":"as duas medidas em conjunto.","B":"simplificar o formulário.","C":"ampliar o atendimento.","D":"a equipe."},"gabarito":"B","comentario":"Na correlação tradicional entre dois termos já mencionados, 'este/esta' retoma o elemento mais próximo; portanto, refere-se a 'simplificar o formulário'.","referencia":"Emprego coesivo de pronomes demonstrativos em retomadas textuais.","tags":["pronomes","demonstrativos"]},{"id":"POR018","area":"Língua Portuguesa","tema":"MAPA 003 - Pronomes e expressões referenciais na articulação textual","subtema":"Expressão nominal anafórica","dificuldade":"dificil","enunciado":"Leia: \"O município implantou um sistema de agendamento eletrônico. A medida reduziu as filas presenciais.\"\nA expressão \"A medida\" constitui:","alternativas":{"A":"uma expressão sem referente no texto.","B":"uma antecipação catafórica de informação ainda não apresentada.","C":"um vocativo que interpela o leitor.","D":"uma retomada anafórica que recategoriza a implantação do sistema."},"gabarito":"D","comentario":"'A medida' retoma todo o evento anterior — a implantação do sistema — e o recategoriza por meio de um sintagma nominal. Trata-se de coesão anafórica.","referencia":"Coesão referencial: anáfora nominal e recategorização.","tags":["pronomes","anafora_nominal"]},{"id":"POR019","area":"Língua Portuguesa","tema":"MAPA 003 - Pronomes e expressões referenciais na articulação textual","subtema":"Referência catafórica","dificuldade":"dificil","enunciado":"Em \"Só lhe peço isto: que envie o formulário até amanhã\", o pronome \"isto\" exerce função:","alternativas":{"A":"catafórica, pois antecipa o conteúdo explicitado depois dos dois-pontos.","B":"dêitica exclusivamente espacial.","C":"expletiva, sem conteúdo referencial.","D":"anafórica, pois retoma um termo anterior."},"gabarito":"A","comentario":"'Isto' aponta para a oração que vem depois — 'que envie o formulário até amanhã'. Como o referente é apresentado posteriormente, há catáfora.","referencia":"Coesão referencial: catáfora.","tags":["pronomes","catáfora"]},{"id":"POR020","area":"Língua Portuguesa","tema":"MAPA 004 - Nexos e operadores sequenciais","subtema":"Valor adversativo","dificuldade":"facil","enunciado":"Na frase \"O sistema é simples, mas exige cadastro prévio\", a conjunção \"mas\" introduz ideia de:","alternativas":{"A":"conclusão.","B":"causa.","C":"oposição/contraste.","D":"condição."},"gabarito":"C","comentario":"'Mas' é conjunção coordenativa adversativa e estabelece contraste entre a simplicidade do sistema e a exigência de cadastro.","referencia":"Conjunções coordenativas: valor adversativo.","tags":["conectivos","adversidade"]},{"id":"POR021","area":"Língua Portuguesa","tema":"MAPA 004 - Nexos e operadores sequenciais","subtema":"Valor conclusivo","dificuldade":"intermediaria","enunciado":"Assinale a opção que preserva o sentido de \"Os dados estavam incompletos; portanto, a análise foi adiada.\" ","alternativas":{"A":"Como a análise foi adiada, os dados ficaram incompletos.","B":"Embora os dados estivessem incompletos, a análise foi adiada.","C":"Os dados estavam incompletos; por isso, a análise foi adiada.","D":"Os dados estavam incompletos, contudo a análise foi adiada."},"gabarito":"C","comentario":"'Portanto' introduz conclusão/consequência; 'por isso' mantém essa relação. 'Embora' e 'contudo' expressam concessão/oposição, e a última alternativa inverte a relação causal.","referencia":"Conectores conclusivos e relação de consequência.","tags":["conectivos","conclusao"]},{"id":"POR022","area":"Língua Portuguesa","tema":"MAPA 004 - Nexos e operadores sequenciais","subtema":"Valor concessivo","dificuldade":"intermediaria","enunciado":"Em \"Embora o prazo fosse curto, a equipe concluiu o trabalho\", o nexo destacado indica:","alternativas":{"A":"concessão: um fato que poderia dificultar, mas não impede, o resultado.","B":"causa direta do resultado.","C":"comparação entre dois prazos.","D":"finalidade da conclusão do trabalho."},"gabarito":"A","comentario":"'Embora' introduz oração concessiva: o prazo curto cria uma expectativa de dificuldade, contrariada pela conclusão do trabalho.","referencia":"Conjunções subordinativas concessivas.","tags":["conectivos","concessao"]},{"id":"POR023","area":"Língua Portuguesa","tema":"MAPA 004 - Nexos e operadores sequenciais","subtema":"Operador argumentativo","dificuldade":"dificil","enunciado":"Leia: \"O novo procedimento reduziu o tempo de espera e, além disso, diminuiu o número de erros.\"\nA expressão \"além disso\" atua como operador que:","alternativas":{"A":"marca oposição entre os dois resultados.","B":"acrescenta um argumento na mesma direção do anterior.","C":"introduz uma condição necessária.","D":"corrige integralmente a informação anterior."},"gabarito":"B","comentario":"'Além disso' é operador aditivo: soma um segundo dado favorável ao mesmo ponto de vista, reforçando a argumentação.","referencia":"Operadores argumentativos de adição.","tags":["conectivos","operadores_argumentativos"]},{"id":"POR024","area":"Língua Portuguesa","tema":"MAPA 004 - Nexos e operadores sequenciais","subtema":"Substituição de conectivo","dificuldade":"dificil","enunciado":"Na frase \"O atendimento foi mantido, ainda que houvesse poucos servidores\", qual substituição preserva a relação semântica principal?","alternativas":{"A":"desde que houvesse poucos servidores","B":"porque havia poucos servidores","C":"de modo que houvesse poucos servidores","D":"embora houvesse poucos servidores"},"gabarito":"D","comentario":"'Ainda que' e 'embora' são conectores concessivos. 'Porque' é causal, 'desde que' é condicional e 'de modo que' tende a indicar consequência.","referencia":"Equivalência semântica entre conectores concessivos.","tags":["conectivos","equivalencia"]},{"id":"POR025","area":"Língua Portuguesa","tema":"MAPA 005 - Significação contextual de palavras e expressões","subtema":"Sentido contextual","dificuldade":"facil","enunciado":"Na frase \"A notícia caiu como uma bomba na reunião\", a expressão destacada significa que a notícia:","alternativas":{"A":"foi anunciada em voz baixa.","B":"causou forte impacto ou surpresa.","C":"não despertou qualquer reação.","D":"provocou uma explosão física."},"gabarito":"B","comentario":"A expressão é figurada: 'cair como uma bomba' significa produzir impacto intenso, surpresa ou comoção, e não uma explosão literal.","referencia":"Semântica lexical: sentido figurado em contexto.","tags":["semantica","sentido_figurado"]},{"id":"POR026","area":"Língua Portuguesa","tema":"MAPA 005 - Significação contextual de palavras e expressões","subtema":"Polissemia","dificuldade":"intermediaria","enunciado":"Em \"A direção abriu um canal de diálogo com os servidores\", a palavra \"canal\" significa:","alternativas":{"A":"peça física de tubulação.","B":"meio ou via de comunicação.","C":"curso natural de água obrigatoriamente.","D":"canal de televisão específico."},"gabarito":"B","comentario":"O contexto de 'diálogo' ativa o sentido abstrato de 'canal' como meio de comunicação. Trata-se de polissemia, pois a palavra possui outros sentidos em diferentes contextos.","referencia":"Semântica lexical: polissemia e seleção contextual de sentido.","tags":["semantica","polissemia"]},{"id":"POR027","area":"Língua Portuguesa","tema":"MAPA 005 - Significação contextual de palavras e expressões","subtema":"Sinonímia contextual","dificuldade":"intermediaria","enunciado":"No período \"A medida foi considerada pertinente ao problema identificado\", a palavra \"pertinente\" pode ser substituída, sem alteração relevante de sentido, por:","alternativas":{"A":"casual.","B":"excessiva.","C":"adequada.","D":"distante."},"gabarito":"C","comentario":"No contexto, 'pertinente' significa apropriada, adequada ou relacionada de modo oportuno ao problema. As demais opções alteram o sentido.","referencia":"Relações semânticas: sinonímia contextual.","tags":["semantica","sinonimia"]},{"id":"POR028","area":"Língua Portuguesa","tema":"MAPA 005 - Significação contextual de palavras e expressões","subtema":"Efeito de sentido","dificuldade":"dificil","enunciado":"Compare:\nI. \"O servidor respondeu ao pedido.\"\nII. \"O servidor finalmente respondeu ao pedido.\"\nO advérbio \"finalmente\" acrescenta a ideia de que:","alternativas":{"A":"a resposta era aguardada havia algum tempo ou ocorreu após demora.","B":"o servidor respondeu de forma incompleta.","C":"a resposta foi necessariamente correta.","D":"o pedido foi feito naquele mesmo instante."},"gabarito":"A","comentario":"'Finalmente' não altera o fato básico de responder, mas introduz avaliação temporal: algo esperado ocorreu depois de certa espera ou demora.","referencia":"Semântica de advérbios e efeitos pragmáticos de sentido.","tags":["semantica","efeito_de_sentido"]},{"id":"POR029","area":"Língua Portuguesa","tema":"MAPA 005 - Significação contextual de palavras e expressões","subtema":"Denotação e conotação","dificuldade":"facil","enunciado":"Na frase \"A proposta encontrou uma muralha de resistência\", a palavra \"muralha\" foi empregada para:","alternativas":{"A":"intensificar figurativamente a ideia de grande obstáculo.","B":"substituir um termo técnico da construção civil.","C":"indicar que a resistência ocorreu fora de um prédio.","D":"designar literalmente uma construção defensiva."},"gabarito":"A","comentario":"O emprego é conotativo: 'muralha' metaforiza a resistência como barreira muito difícil de superar, intensificando o obstáculo.","referencia":"Semântica: denotação, conotação e metáfora.","tags":["semantica","conotacao"]},{"id":"POR030","area":"Língua Portuguesa","tema":"MAPA 006 - Equivalência e transformação de estruturas","subtema":"Voz ativa e passiva","dificuldade":"facil","enunciado":"A forma passiva equivalente a \"A comissão analisou os recursos\" é:","alternativas":{"A":"Os recursos analisaram a comissão.","B":"A comissão foi analisada pelos recursos.","C":"Analisaram-se a comissão pelos recursos.","D":"Os recursos foram analisados pela comissão."},"gabarito":"D","comentario":"Na passagem da ativa para a passiva analítica, o objeto direto 'os recursos' torna-se sujeito paciente; o verbo passa a 'foram analisados' e o agente é 'pela comissão'.","referencia":"Transformação sintática entre voz ativa e voz passiva analítica.","tags":["equivalencia","voz_passiva"]},{"id":"POR031","area":"Língua Portuguesa","tema":"MAPA 006 - Equivalência e transformação de estruturas","subtema":"Reescrita sem alteração de sentido","dificuldade":"intermediaria","enunciado":"Assinale a reescrita que preserva o sentido de \"Se o cadastro estiver atualizado, o usuário receberá o aviso.\" ","alternativas":{"A":"O usuário receberá o aviso caso o cadastro esteja atualizado.","B":"O usuário receberá o aviso porque o cadastro está desatualizado.","C":"O usuário receberá o aviso, embora o cadastro esteja atualizado.","D":"O usuário receberá o aviso mesmo que o cadastro não esteja atualizado."},"gabarito":"A","comentario":"'Se' e 'caso' introduzem condição. As demais opções transformam a relação em concessão ou causa e alteram a condição expressa no original.","referencia":"Equivalência semântica de estruturas condicionais.","tags":["equivalencia","condicao"]},{"id":"POR032","area":"Língua Portuguesa","tema":"MAPA 006 - Equivalência e transformação de estruturas","subtema":"Nominalização","dificuldade":"intermediaria","enunciado":"A frase \"A equipe revisou o regulamento e corrigiu as inconsistências\" pode ser reescrita, mantendo o sentido básico, como:","alternativas":{"A":"A equipe revisaria o regulamento se não houvesse inconsistências.","B":"A revisão do regulamento pela equipe resultou na correção das inconsistências.","C":"A correção das inconsistências impediu a revisão do regulamento pela equipe.","D":"O regulamento foi corrigido, embora a equipe não o tivesse revisado."},"gabarito":"B","comentario":"A reescrita nominaliza 'revisou' em 'revisão' e mantém a relação entre a ação da equipe e a correção das inconsistências. As outras alternativas alteram causa, condição ou fatos.","referencia":"Transformação sintática por nominalização, com preservação das relações de sentido.","tags":["equivalencia","nominalizacao"]},{"id":"POR033","area":"Língua Portuguesa","tema":"MAPA 006 - Equivalência e transformação de estruturas","subtema":"Transformação de oração reduzida","dificuldade":"intermediaria","enunciado":"Em \"Ao terminar o atendimento, a servidora registrou a ocorrência\", a oração reduzida pode ser desenvolvida, sem mudança relevante de sentido, como:","alternativas":{"A":"Quando terminou o atendimento, a servidora registrou a ocorrência.","B":"Porque terminou o atendimento, a servidora registrou a ocorrência.","C":"Para que terminasse o atendimento, a servidora registrou a ocorrência.","D":"Embora terminasse o atendimento, a servidora registrou a ocorrência."},"gabarito":"A","comentario":"'Ao terminar' expressa circunstância temporal. O desenvolvimento com 'quando terminou' mantém esse valor; as demais opções introduzem causa, concessão ou finalidade.","referencia":"Equivalência entre oração reduzida e oração subordinada adverbial temporal desenvolvida.","tags":["equivalencia","oracao_reduzida"]},{"id":"POR034","area":"Língua Portuguesa","tema":"MAPA 006 - Equivalência e transformação de estruturas","subtema":"Mudança de foco sem mudança proposicional","dificuldade":"dificil","enunciado":"Considere:\nI. \"Somente a coordenação pode autorizar a alteração.\"\nII. \"A alteração só pode ser autorizada pela coordenação.\"\nA relação entre I e II é de:","alternativas":{"A":"causalidade, porque II explica a razão de I.","B":"oposição, porque 'somente' e 'só' têm sentidos incompatíveis.","C":"contradição, porque II proíbe a coordenação de autorizar.","D":"equivalência essencial de sentido, com mudança de estrutura e foco sintático."},"gabarito":"D","comentario":"Nos dois casos, restringe-se à coordenação a competência para autorizar a alteração. A segunda versão usa passiva e reposiciona a informação, mas preserva a restrição semântica.","referencia":"Equivalência por transformação de voz e manutenção de operador restritivo.","tags":["equivalencia","reescrita"]},{"id":"POR035","area":"Língua Portuguesa","tema":"MAPA 006 - Equivalência e transformação de estruturas","subtema":"Preservação de escopo semântico","dificuldade":"dificil","enunciado":"A frase \"Nem todos os candidatos entregaram o documento\" é corretamente reescrita, sem alteração de sentido, como:","alternativas":{"A":"Nenhum candidato entregou o documento.","B":"Somente um candidato entregou o documento.","C":"Alguns candidatos não entregaram o documento.","D":"Todos os candidatos deixaram de entregar o documento."},"gabarito":"C","comentario":"'Nem todos' nega a universalidade: significa que pelo menos um integrante do conjunto não realizou a ação. Não equivale a 'nenhum' nem especifica quantos deixaram de entregar.","referencia":"Semântica de quantificadores e equivalência lógica em reescritas.","tags":["equivalencia","quantificadores"]},{"id":"POR036","area":"Língua Portuguesa","tema":"MAPA 007 - Coordenação: orações coordenadas e relações de sentido","subtema":"Coordenação aditiva","dificuldade":"facil","enunciado":"Em \"A equipe revisou os dados e atualizou o relatório\", a conjunção \"e\" estabelece relação de:","alternativas":{"A":"oposição.","B":"conclusão.","C":"adição.","D":"explicação."},"gabarito":"C","comentario":"A conjunção 'e' soma duas ações atribuídas ao mesmo sujeito: revisar os dados e atualizar o relatório.","referencia":"Conjunções coordenativas aditivas.","tags":["coordenacao","adicao"]},{"id":"POR037","area":"Língua Portuguesa","tema":"MAPA 007 - Coordenação: orações coordenadas e relações de sentido","subtema":"Coordenação adversativa","dificuldade":"intermediaria","enunciado":"No período \"O prazo era curto, porém o trabalho foi concluído\", a oração introduzida por \"porém\" expressa:","alternativas":{"A":"causa do prazo curto.","B":"explicação do motivo do prazo.","C":"conclusão lógica da primeira oração.","D":"contraste em relação à expectativa criada pela primeira oração."},"gabarito":"D","comentario":"'Porém' é conjunção coordenativa adversativa. O prazo curto poderia sugerir dificuldade de conclusão, mas o segundo fato contraria essa expectativa.","referencia":"Conjunções coordenativas adversativas e relação de contraste.","tags":["coordenacao","adversidade"]},{"id":"POR038","area":"Língua Portuguesa","tema":"MAPA 007 - Coordenação: orações coordenadas e relações de sentido","subtema":"Coordenação explicativa","dificuldade":"intermediaria","enunciado":"Em \"Feche a janela, porque vai chover\", a oração introduzida por \"porque\" é, no contexto:","alternativas":{"A":"coordenada sindética explicativa, pois justifica a ordem anterior.","B":"coordenada alternativa, por oferecer escolha.","C":"subordinada causal obrigatoriamente, por indicar causa física.","D":"coordenada conclusiva, por apresentar consequência."},"gabarito":"A","comentario":"Após uma ordem ou pedido, 'porque' pode introduzir justificativa para o conteúdo imperativo. Nesse uso, a tradição gramatical classifica a oração como coordenada explicativa.","referencia":"Coordenação sindética explicativa em contexto de ordem, pedido ou conselho.","tags":["coordenacao","explicativa"]},{"id":"POR039","area":"Língua Portuguesa","tema":"MAPA 007 - Coordenação: orações coordenadas e relações de sentido","subtema":"Coordenação conclusiva","dificuldade":"intermediaria","enunciado":"Assinale o período em que a segunda oração é conclusiva:","alternativas":{"A":"Os documentos estavam corretos e foram digitalizados.","B":"Corrija os documentos, pois há inconsistências.","C":"Os documentos estavam corretos; portanto, o processo seguiu para análise.","D":"Os documentos estavam corretos, mas o processo foi devolvido."},"gabarito":"C","comentario":"'Portanto' introduz uma conclusão decorrente da informação anterior. As demais conjunções expressam adversidade, adição e explicação.","referencia":"Conjunções coordenativas conclusivas.","tags":["coordenacao","conclusao"]},{"id":"POR040","area":"Língua Portuguesa","tema":"MAPA 007 - Coordenação: orações coordenadas e relações de sentido","subtema":"Assíndeto e efeito de sentido","dificuldade":"dificil","enunciado":"No trecho \"Chegou, conferiu os documentos, assinou, saiu\", a ausência de conjunções entre as orações contribui principalmente para:","alternativas":{"A":"marcar dúvida do enunciador.","B":"produzir sequência rápida de ações, por coordenação assindética.","C":"transformar as orações em subordinadas.","D":"estabelecer relação obrigatória de condição."},"gabarito":"B","comentario":"A justaposição de orações sem conectivos caracteriza coordenação assindética. No contexto, a enumeração verbal acelera o ritmo e apresenta ações sucessivas.","referencia":"Coordenação assindética e efeitos estilísticos de enumeração.","tags":["coordenacao","assindeto"]},{"id":"POR041","area":"Língua Portuguesa","tema":"MAPA 007 - Coordenação: orações coordenadas e relações de sentido","subtema":"Valor semântico de 'e'","dificuldade":"dificil","enunciado":"Em \"Continue ignorando os avisos e perderá o prazo\", a conjunção \"e\" não expressa simples adição; no contexto, aproxima-se de uma relação de:","alternativas":{"A":"consequência.","B":"concessão.","C":"explicação.","D":"comparação."},"gabarito":"A","comentario":"A segunda oração apresenta o resultado provável da ação expressa na primeira. Assim, embora formalmente aditiva, a conjunção 'e' assume valor semântico consecutivo.","referencia":"Coordenação aditiva com valor contextual de consequência.","tags":["coordenacao","valor_semantico"]},{"id":"POR042","area":"Língua Portuguesa","tema":"MAPA 008 - Subordinação: orações subordinadas e relações de sentido","subtema":"Oração substantiva objetiva direta","dificuldade":"facil","enunciado":"Em \"A equipe confirmou que o sistema voltou a funcionar\", a oração \"que o sistema voltou a funcionar\" exerce função de:","alternativas":{"A":"oração adjetiva explicativa.","B":"sujeito de 'confirmou'.","C":"adjunto adverbial de causa.","D":"objeto direto do verbo 'confirmou'."},"gabarito":"D","comentario":"O verbo 'confirmar' é transitivo direto nesse contexto, e a oração introduzida por 'que' completa seu sentido como objeto direto.","referencia":"Orações subordinadas substantivas objetivas diretas.","tags":["subordinacao","substantiva"]},{"id":"POR043","area":"Língua Portuguesa","tema":"MAPA 008 - Subordinação: orações subordinadas e relações de sentido","subtema":"Oração adjetiva restritiva","dificuldade":"intermediaria","enunciado":"Compare: \"Os servidores que participaram do curso receberão certificado.\" A oração \"que participaram do curso\" é restritiva porque:","alternativas":{"A":"indica causa para o recebimento do certificado.","B":"funciona como objeto direto de 'receberão'.","C":"delimita o grupo de servidores ao qual se refere a afirmação.","D":"atribui uma característica a todos os servidores, sem restringi-los."},"gabarito":"C","comentario":"Sem vírgulas, a oração adjetiva restringe o antecedente: apenas os servidores participantes do curso integram o grupo referido.","referencia":"Orações subordinadas adjetivas restritivas.","tags":["subordinacao","adjetiva_restritiva"]},{"id":"POR044","area":"Língua Portuguesa","tema":"MAPA 008 - Subordinação: orações subordinadas e relações de sentido","subtema":"Oração adjetiva explicativa","dificuldade":"intermediaria","enunciado":"Em \"O relatório, que foi revisado ontem, será publicado hoje\", as vírgulas indicam que a oração destacada:","alternativas":{"A":"expressa condição para a publicação.","B":"acrescenta uma informação acessória sobre um referente já identificado.","C":"seleciona apenas um subconjunto de relatórios.","D":"funciona como complemento nominal."},"gabarito":"B","comentario":"A oração adjetiva explicativa vem isolada por vírgulas e acrescenta comentário sobre o referente, sem restringir sua extensão.","referencia":"Orações subordinadas adjetivas explicativas e pontuação.","tags":["subordinacao","adjetiva_explicativa"]},{"id":"POR045","area":"Língua Portuguesa","tema":"MAPA 008 - Subordinação: orações subordinadas e relações de sentido","subtema":"Oração adverbial causal","dificuldade":"intermediaria","enunciado":"Em \"Como o sistema estava indisponível, o atendimento foi suspenso\", a oração inicial expressa:","alternativas":{"A":"condição.","B":"concessão.","C":"finalidade.","D":"causa."},"gabarito":"D","comentario":"No início do período, 'como' pode assumir valor causal equivalente a 'porque': a indisponibilidade do sistema é apresentada como causa da suspensão.","referencia":"Orações subordinadas adverbiais causais.","tags":["subordinacao","causal"]},{"id":"POR046","area":"Língua Portuguesa","tema":"MAPA 008 - Subordinação: orações subordinadas e relações de sentido","subtema":"Oração adverbial condicional","dificuldade":"facil","enunciado":"Em \"Se houver vagas, novas turmas serão abertas\", a oração \"Se houver vagas\" expressa:","alternativas":{"A":"condição.","B":"proporção.","C":"conclusão.","D":"explicação."},"gabarito":"A","comentario":"A abertura de novas turmas depende da ocorrência da condição indicada: haver vagas.","referencia":"Orações subordinadas adverbiais condicionais.","tags":["subordinacao","condicional"]},{"id":"POR047","area":"Língua Portuguesa","tema":"MAPA 008 - Subordinação: orações subordinadas e relações de sentido","subtema":"Relação concessiva","dificuldade":"facil","enunciado":"Assinale a alternativa em que a relação entre as orações é concessiva:","alternativas":{"A":"Embora o sistema fosse antigo, funcionava de modo estável.","B":"O sistema foi atualizado para que os erros diminuíssem.","C":"Como o sistema era antigo, foi substituído.","D":"Se o sistema for atualizado, haverá testes."},"gabarito":"A","comentario":"'Embora' introduz fato que poderia contrariar o resultado expresso na oração principal. As demais relações são causa, condição e finalidade.","referencia":"Orações subordinadas adverbiais concessivas.","tags":["subordinacao","concessiva"]},{"id":"POR048","area":"Língua Portuguesa","tema":"MAPA 008 - Subordinação: orações subordinadas e relações de sentido","subtema":"Oração consecutiva","dificuldade":"facil","enunciado":"No período \"A procura foi tão grande que as vagas se esgotaram em poucas horas\", a oração iniciada por \"que\" expressa:","alternativas":{"A":"causa da procura.","B":"consequência decorrente da intensidade indicada por 'tão grande'.","C":"condição para a abertura de vagas.","D":"comparação entre dois níveis de procura."},"gabarito":"B","comentario":"A construção correlativa 'tão... que' introduz oração consecutiva: o esgotamento das vagas é apresentado como resultado da intensidade da procura.","referencia":"Orações subordinadas adverbiais consecutivas.","tags":["subordinacao","consecutiva"]},{"id":"POR049","area":"Língua Portuguesa","tema":"MAPA 009 - Emprego de tempos e modos verbais","subtema":"Pretérito perfeito","dificuldade":"facil","enunciado":"Em \"A comissão publicou o resultado ontem\", a forma verbal \"publicou\" indica:","alternativas":{"A":"ação habitual no presente.","B":"ação concluída em momento anterior ao da fala.","C":"ordem dirigida ao leitor.","D":"ação futura condicionada."},"gabarito":"B","comentario":"O pretérito perfeito do indicativo apresenta, em regra, um fato passado tomado como concluído.","referencia":"Emprego do pretérito perfeito do indicativo.","tags":["verbos","tempo_verbal"]},{"id":"POR050","area":"Língua Portuguesa","tema":"MAPA 009 - Emprego de tempos e modos verbais","subtema":"Pretérito imperfeito","dificuldade":"intermediaria","enunciado":"Na frase \"Quando trabalhava naquele setor, Ana conferia os relatórios todas as manhãs\", o pretérito imperfeito indica principalmente:","alternativas":{"A":"ações futuras em relação ao presente.","B":"ordens concluídas.","C":"fatos pontuais e instantâneos obrigatoriamente.","D":"ações habituais ou durativas no passado."},"gabarito":"D","comentario":"O imperfeito é apropriado para ações habituais, repetidas ou em curso em um quadro passado, como 'trabalhava' e 'conferia'.","referencia":"Emprego do pretérito imperfeito do indicativo.","tags":["verbos","preterito_imperfeito"]},{"id":"POR051","area":"Língua Portuguesa","tema":"MAPA 009 - Emprego de tempos e modos verbais","subtema":"Futuro do subjuntivo","dificuldade":"intermediaria","enunciado":"Assinale a frase em que o verbo está adequadamente empregado no futuro do subjuntivo:","alternativas":{"A":"Quando o relatório estaria pronto, enviaremos a versão final.","B":"Quando o relatório estava pronto, enviaremos a versão final.","C":"Quando o relatório estiver pronto, enviaremos a versão final.","D":"Quando o relatório esteve pronto, enviaremos a versão final."},"gabarito":"C","comentario":"Em oração temporal com referência a fato futuro e eventual, é adequado o futuro do subjuntivo: 'quando estiver'.","referencia":"Futuro do subjuntivo em orações temporais referentes ao futuro.","tags":["verbos","subjuntivo"]},{"id":"POR052","area":"Língua Portuguesa","tema":"MAPA 009 - Emprego de tempos e modos verbais","subtema":"Correlação verbal","dificuldade":"dificil","enunciado":"Assinale a opção que apresenta correlação verbal adequada:","alternativas":{"A":"Se a equipe tivesse revisado os dados, teria evitado o erro.","B":"Se a equipe tivesse revisado os dados, evitará o erro ontem.","C":"Se a equipe revisaria os dados, evitaria o erro.","D":"Se a equipe revisou os dados, teria evitado o erro amanhã."},"gabarito":"A","comentario":"A construção contrafactual no passado combina mais-que-perfeito do subjuntivo ('tivesse revisado') com futuro do pretérito composto ('teria evitado').","referencia":"Correlação entre tempos e modos em períodos condicionais hipotéticos.","tags":["verbos","correlacao_verbal"]},{"id":"POR053","area":"Língua Portuguesa","tema":"MAPA 009 - Emprego de tempos e modos verbais","subtema":"Valor modal do subjuntivo","dificuldade":"intermediaria","enunciado":"Em \"Talvez a equipe conclua a análise hoje\", o uso do subjuntivo em \"conclua\" está associado à expressão de:","alternativas":{"A":"certeza absoluta.","B":"fato passado concluído.","C":"ordem direta.","D":"possibilidade ou incerteza."},"gabarito":"D","comentario":"O advérbio 'talvez' favorece o subjuntivo por apresentar o evento como possível, não como fato certo.","referencia":"Modo subjuntivo: valores de hipótese, dúvida e possibilidade.","tags":["verbos","modo_subjuntivo"]},{"id":"POR054","area":"Língua Portuguesa","tema":"MAPA 010 - Pontuação","subtema":"Vírgula em enumeração","dificuldade":"facil","enunciado":"Assinale a frase corretamente pontuada:","alternativas":{"A":"A equipe conferiu nomes, datas, valores e assinaturas.","B":"A equipe conferiu nomes datas, valores e, assinaturas.","C":"A equipe, conferiu nomes datas valores e assinaturas.","D":"A equipe conferiu, nomes, datas valores e assinaturas."},"gabarito":"A","comentario":"Os elementos de uma enumeração são separados por vírgulas; não se separa por vírgula o sujeito do verbo nem o verbo de seu objeto.","referencia":"Emprego da vírgula em enumerações e proibição de separação entre termos essenciais.","tags":["pontuacao","virgula"]},{"id":"POR055","area":"Língua Portuguesa","tema":"MAPA 010 - Pontuação","subtema":"Adjunto adverbial deslocado","dificuldade":"intermediaria","enunciado":"Em qual alternativa a vírgula foi empregada adequadamente para isolar um adjunto adverbial deslocado?","alternativas":{"A":"Após a reunião, os participantes receberam a ata.","B":"Os participantes receberam a ata após, a reunião.","C":"Os participantes, receberam a ata após a reunião.","D":"Os participantes receberam, a ata após a reunião."},"gabarito":"A","comentario":"O adjunto adverbial antecipado 'Após a reunião' pode ser isolado por vírgula. As demais opções criam separações indevidas entre sujeito e verbo, verbo e objeto ou preposição e complemento.","referencia":"Vírgula com adjunto adverbial deslocado.","tags":["pontuacao","adjunto_adverbial"]},{"id":"POR056","area":"Língua Portuguesa","tema":"MAPA 010 - Pontuação","subtema":"Oração adjetiva explicativa","dificuldade":"intermediaria","enunciado":"Assinale o período em que as vírgulas transformam a oração adjetiva em explicativa:","alternativas":{"A":"Os relatórios, que já foram revisados, seguirão para publicação.","B":"Os relatórios que já foram revisados seguirão para publicação.","C":"Os relatórios que já foram, revisados seguirão para publicação.","D":"Os relatórios que, já foram revisados seguirão para publicação."},"gabarito":"A","comentario":"Isolada por vírgulas, a oração 'que já foram revisados' assume valor explicativo e comenta o conjunto já identificado de relatórios.","referencia":"Pontuação de orações subordinadas adjetivas explicativas.","tags":["pontuacao","oracao_adjetiva"]},{"id":"POR057","area":"Língua Portuguesa","tema":"MAPA 010 - Pontuação","subtema":"Dois-pontos","dificuldade":"facil","enunciado":"Em \"A equipe identificou três problemas: atraso, retrabalho e falhas de comunicação\", os dois-pontos introduzem:","alternativas":{"A":"uma oração sem relação com a anterior.","B":"uma pergunta direta.","C":"uma oposição.","D":"uma enumeração que especifica o termo anterior."},"gabarito":"D","comentario":"Os dois-pontos podem introduzir enumeração, explicação ou esclarecimento do segmento precedente.","referencia":"Emprego dos dois-pontos para introduzir enumeração ou explicação.","tags":["pontuacao","dois_pontos"]},{"id":"POR058","area":"Língua Portuguesa","tema":"MAPA 010 - Pontuação","subtema":"Ponto e vírgula","dificuldade":"dificil","enunciado":"Assinale a opção em que o ponto e vírgula está adequadamente empregado para organizar itens internos já separados por vírgulas:","alternativas":{"A":"Participaram Ana; da coordenação, Bruno; do financeiro e Carla; do atendimento.","B":"Participaram Ana, da coordenação; Bruno, do financeiro; e Carla, do atendimento.","C":"Participaram; Ana, da coordenação, Bruno, do financeiro e Carla, do atendimento.","D":"Participaram Ana, da coordenação Bruno; do financeiro Carla, do atendimento."},"gabarito":"B","comentario":"O ponto e vírgula é útil para separar itens complexos de uma enumeração quando cada item já contém vírgula interna, aumentando a clareza.","referencia":"Emprego do ponto e vírgula em enumerações complexas.","tags":["pontuacao","ponto_e_virgula"]},{"id":"POR059","area":"Língua Portuguesa","tema":"MAPA 010 - Pontuação","subtema":"Vírgula e oração subordinada adverbial","dificuldade":"intermediaria","enunciado":"Assinale a frase de acordo com a pontuação da norma-padrão:","alternativas":{"A":"Se o sistema voltar a funcionar, o atendimento será retomado.","B":"Se o sistema, voltar a funcionar o atendimento será retomado.","C":"Se, o sistema voltar a funcionar o atendimento será retomado.","D":"Se o sistema voltar a funcionar o atendimento, será retomado."},"gabarito":"A","comentario":"A oração adverbial condicional anteposta à principal é normalmente separada por vírgula. Não se interrompem indevidamente seus constituintes internos.","referencia":"Vírgula após oração subordinada adverbial anteposta.","tags":["pontuacao","oracao_adverbial"]},{"id":"POR060","area":"Língua Portuguesa","tema":"MAPA 010 - Pontuação","subtema":"Mudança de sentido pela pontuação","dificuldade":"dificil","enunciado":"Compare:\nI. \"Os servidores que concluíram o curso receberão certificado.\"\nII. \"Os servidores, que concluíram o curso, receberão certificado.\"\nA diferença principal é que:","alternativas":{"A":"as duas frases têm rigorosamente o mesmo alcance referencial.","B":"em I, todos os servidores concluíram; em II, apenas alguns.","C":"em I, restringe-se o grupo aos que concluíram; em II, pressupõe-se que todos os servidores referidos concluíram.","D":"as vírgulas de II tornam a frase gramaticalmente incorreta."},"gabarito":"C","comentario":"Sem vírgulas, a oração adjetiva é restritiva e seleciona um subconjunto. Com vírgulas, é explicativa e apresenta a conclusão do curso como informação sobre o conjunto já delimitado.","referencia":"Pontuação e distinção entre orações adjetivas restritivas e explicativas.","tags":["pontuacao","sentido"]},{"id":"POR061","area":"Língua Portuguesa","tema":"MAPA 011 - Concordância nominal","subtema":"Adjetivo com substantivo","dificuldade":"facil","enunciado":"Assinale a frase de acordo com a concordância nominal padrão:","alternativas":{"A":"As informação permanecem atualizada.","B":"As informações permanecem atualizado.","C":"As informações permanecem atualizadas.","D":"As informações permanece atualizado."},"gabarito":"C","comentario":"O predicativo 'atualizadas' concorda em gênero e número com o sujeito 'as informações'.","referencia":"Concordância nominal entre substantivo e adjetivo/predicativo.","tags":["concordancia_nominal","adjetivo"]},{"id":"POR062","area":"Língua Portuguesa","tema":"MAPA 011 - Concordância nominal","subtema":"Anexo","dificuldade":"intermediaria","enunciado":"Considerando a concordância do adjetivo 'anexo' com o substantivo a que se refere, assinale a alternativa correta:","alternativas":{"A":"Segue anexas os documentos solicitados.","B":"Segue anexo os documentos solicitados.","C":"Seguem anexo os documentos solicitados.","D":"Seguem anexos os documentos solicitados."},"gabarito":"D","comentario":"'Anexo', quando adjetivo, concorda com o substantivo a que se refere: 'documentos' é masculino plural, portanto 'anexos'.","referencia":"Concordância nominal do adjetivo 'anexo'.","tags":["concordancia_nominal","anexo"]},{"id":"POR063","area":"Língua Portuguesa","tema":"MAPA 011 - Concordância nominal","subtema":"É proibido / é proibida","dificuldade":"intermediaria","enunciado":"Em um aviso institucional sobre acesso restrito, assinale a redação de acordo com a norma-padrão:","alternativas":{"A":"São proibida a entrada de pessoas não autorizadas.","B":"É proibido a entrada de pessoas não autorizadas.","C":"É proibidas a entrada de pessoas não autorizadas.","D":"É proibida a entrada de pessoas não autorizadas."},"gabarito":"D","comentario":"Quando o substantivo vem determinado por artigo, o adjetivo da expressão 'é proibido/proibida' concorda com ele: 'a entrada' → 'proibida'.","referencia":"Concordância nominal em expressões do tipo 'é proibido/é proibida'.","tags":["concordancia_nominal","expressoes"]},{"id":"POR064","area":"Língua Portuguesa","tema":"MAPA 011 - Concordância nominal","subtema":"Bastante","dificuldade":"dificil","enunciado":"Assinale a alternativa correta quanto ao emprego de \"bastante\":","alternativas":{"A":"Havia bastante motivos para revisar o procedimento.","B":"Os relatórios ficaram bastantes claros após a revisão.","C":"As servidoras estavam bastantes preocupadas.","D":"Havia bastantes motivos para revisar o procedimento."},"gabarito":"D","comentario":"Como pronome/adjetivo indefinido equivalente a 'muitos', 'bastante' varia: 'bastantes motivos'. Como advérbio intensificador de adjetivos, é invariável: 'bastante preocupadas', 'bastante claros'.","referencia":"Concordância e invariabilidade de 'bastante' conforme a classe gramatical.","tags":["concordancia_nominal","bastante"]},{"id":"POR065","area":"Língua Portuguesa","tema":"MAPA 011 - Concordância nominal","subtema":"Meio","dificuldade":"intermediaria","enunciado":"Assinale a frase correta segundo a norma-padrão:","alternativas":{"A":"As servidoras ficaram meias apreensivas com a mudança.","B":"As servidoras ficaram meio apreensivas com a mudança.","C":"As servidoras ficaram meia apreensivas com a mudança.","D":"As servidoras ficaram meios apreensivas com a mudança."},"gabarito":"B","comentario":"Em 'meio apreensivas', 'meio' é advérbio com sentido de 'um pouco' e permanece invariável. Varia quando é numeral/adjetivo, como em 'meia hora'.","referencia":"Emprego de 'meio' como advérbio invariável.","tags":["concordancia_nominal","meio"]},{"id":"POR066","area":"Língua Portuguesa","tema":"MAPA 012 - Concordância verbal","subtema":"Sujeito simples","dificuldade":"facil","enunciado":"Quanto à concordância entre sujeito simples e verbo, assinale a frase correta:","alternativas":{"A":"Os relatório chegou ontem.","B":"Os relatórios chegou ontem.","C":"O relatórios chegaram ontem.","D":"Os relatórios chegaram ontem."},"gabarito":"D","comentario":"O verbo concorda em número e pessoa com o núcleo do sujeito simples: 'relatórios' está no plural, logo 'chegaram'.","referencia":"Regra geral de concordância verbal com sujeito simples.","tags":["concordancia_verbal","sujeito_simples"]},{"id":"POR067","area":"Língua Portuguesa","te
