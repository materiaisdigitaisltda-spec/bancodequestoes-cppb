o Serviço Público","subtema":"Interesse público","dificuldade":"facil","enunciado":"No exercício da função pública, espera-se que o servidor","alternativas":{"A":"oriente sua conduta ao interesse público e aos princípios aplicáveis à Administração.","B":"utilize o cargo para obtenção de vantagens pessoais sempre que não houver fiscalização.","C":"priorize relações pessoais sobre critérios administrativos.","D":"trate patrimônio público como se fosse bem particular."},"gabarito":"A","comentario":"A função pública deve ser exercida em benefício da coletividade e segundo os princípios administrativos. A apropriação privada da função, o favorecimento e a confusão entre patrimônio público e particular são incompatíveis com a ética administrativa.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","etica","interesse_publico"]},{"id":"LEG062","area":"Legislação e Ética no Serviço Público","tema":"Ética no Serviço Público","subtema":"Responsabilidade funcional","dificuldade":"intermediaria","enunciado":"Servidor toma conhecimento de falha relevante em procedimento sob sua responsabilidade e decide escondê-la para evitar críticas pessoais, embora a omissão possa prejudicar usuários do serviço. Sob o enfoque ético, a conduta","alternativas":{"A":"é adequada porque preservar a imagem pessoal é prioridade funcional.","B":"é obrigatória se a chefia ainda não detectou o problema.","C":"é neutra, pois ética não se aplica a omissões.","D":"é inadequada, pois transparência, responsabilidade e compromisso com o serviço público exigem tratamento correto do problema."},"gabarito":"D","comentario":"A responsabilidade ética abrange ações e omissões. Ocultar falha relevante para proteger interesse pessoal pode ampliar danos, comprometer a confiança institucional e contrariar moralidade, eficiência e dever de responsabilidade.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","etica","responsabilidade_funcional"]},{"id":"LEG063","area":"Legislação e Ética no Serviço Público","tema":"Ética no Serviço Público","subtema":"Finalidade pública","dificuldade":"intermediaria","enunciado":"É incompatível com a ética na função pública a utilização de competência administrativa","alternativas":{"A":"para execução de finalidade prevista em lei.","B":"como instrumento de perseguição pessoal ou favorecimento privado.","C":"para assegurar continuidade de serviço público.","D":"com observância de critérios objetivos."},"gabarito":"B","comentario":"A competência pública deve ser usada para o fim para o qual foi atribuída. Empregá-la para perseguir ou favorecer indivíduos desvia a finalidade administrativa e afronta valores de impessoalidade e moralidade.","referencia":"Constituição Federal, art. 37, caput; princípios da finalidade, impessoalidade e moralidade.","tags":["legislacao","etica","finalidade_publica"]},{"id":"LEG064","area":"Legislação e Ética no Serviço Público","tema":"Ética no Serviço Público","subtema":"Ética e legalidade","dificuldade":"facil","enunciado":"A ética administrativa","alternativas":{"A":"torna desnecessário o cumprimento da lei.","B":"é incompatível com regras jurídicas.","C":"somente interessa à vida privada do servidor.","D":"complementa a exigência de legalidade, orientando a atuação pública também por padrões de moralidade e finalidade pública."},"gabarito":"D","comentario":"Legalidade e ética administrativa não são conceitos excludentes. O agente público deve observar as normas jurídicas e também os padrões constitucionais de moralidade, impessoalidade, eficiência e finalidade pública.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","etica","etica_e_legalidade"]},{"id":"LEG065","area":"Legislação e Ética no Serviço Público","tema":"Ética e Moral","subtema":"Conceitos básicos","dificuldade":"intermediaria","enunciado":"Assinale a alternativa que apresenta distinção conceitual adequada entre ética e moral.","alternativas":{"A":"Ética e moral são sempre expressões jurídicas idênticas.","B":"Moral corresponde apenas ao que está escrito em lei.","C":"A moral relaciona-se a valores, costumes e normas de conduta de grupos ou sociedades, enquanto a ética envolve reflexão crítica sobre fundamentos e critérios do agir.","D":"Ética trata exclusivamente de punições administrativas."},"gabarito":"C","comentario":"Em sentido conceitual, a moral está vinculada aos valores e padrões de conduta efetivamente adotados, enquanto a ética examina criticamente princípios e fundamentos capazes de orientar o agir humano. No serviço público, ambos dialogam com os princípios jurídicos.","referencia":"Constituição Federal, art. 37, caput, especialmente princípio da moralidade; conceitos gerais de ética e moral.","tags":["legislacao","etica_moral","conceitos_basicos"]},{"id":"LEG066","area":"Legislação e Ética no Serviço Público","tema":"Ética e Moral","subtema":"Moralidade administrativa","dificuldade":"intermediaria","enunciado":"A moralidade administrativa deve ser compreendida como","alternativas":{"A":"preferência pessoal do agente público sobre o que considera correto.","B":"mera recomendação sem valor jurídico.","C":"regra aplicável somente ao Poder Judiciário.","D":"princípio constitucional que vincula a atuação administrativa e não se confunde com moral subjetiva do agente."},"gabarito":"D","comentario":"A moralidade administrativa possui natureza jurídica constitucional. Não é simplesmente a opinião moral particular do servidor ou gestor. Sua observância integra a validade e legitimidade da atuação administrativa.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","etica_moral","moralidade_administrativa"]},{"id":"LEG067","area":"Legislação e Ética no Serviço Público","tema":"Ética e Moral","subtema":"Normas morais e jurídicas","dificuldade":"facil","enunciado":"A respeito da relação entre moral e Direito, é correto afirmar que","alternativas":{"A":"toda regra moral necessariamente constitui crime.","B":"Direito e moral são conceitos absolutamente idênticos.","C":"somente comportamentos ilegais podem ser considerados eticamente inadequados.","D":"podem existir condutas formalmente lícitas que, em determinadas circunstâncias, sejam eticamente reprováveis."},"gabarito":"D","comentario":"A análise ética é mais ampla do que a simples verificação de tipicidade ou proibição legal. Uma prática pode não configurar ilícito específico e ainda assim ser incompatível com padrões de integridade, lealdade, imparcialidade ou responsabilidade exigidos no serviço público.","referencia":"Constituição Federal, art. 37, caput; conceitos gerais de ética e moral.","tags":["legislacao","etica_moral","normas_morais_e_juridicas"]},{"id":"LEG068","area":"Legislação e Ética no Serviço Público","tema":"Ética e Moral","subtema":"Juízo ético","dificuldade":"facil","enunciado":"O juízo ético sobre uma conduta pública deve considerar","alternativas":{"A":"somente a vantagem obtida pelo agente.","B":"apenas a opinião da chefia imediata.","C":"princípios, consequências, deveres e finalidade pública envolvidos na atuação.","D":"exclusivamente a popularidade momentânea da decisão."},"gabarito":"C","comentario":"A análise ética exige avaliação racional da atuação, de seus princípios orientadores, deveres, efeitos e compatibilidade com a finalidade pública. Popularidade, conveniência pessoal e ordens hierárquicas não substituem esses critérios.","referencia":"Constituição Federal, art. 37, caput; princípios gerais de ética pública.","tags":["legislacao","etica_moral","juizo_etico"]},{"id":"LEG069","area":"Legislação e Ética no Serviço Público","tema":"Ética e Moral","subtema":"Conflito entre costume e princípio jurídico","dificuldade":"dificil","enunciado":"Em determinada unidade tornou-se habitual favorecer conhecidos em pequenos atendimentos. Um servidor argumenta que a prática é ética porque \"sempre foi feita assim\". A conclusão é","alternativas":{"A":"correta, porque todo costume administrativo cria regra válida.","B":"correta, desde que todos os servidores conheçam a prática.","C":"correta se o favorecimento não envolver dinheiro.","D":"incorreta, pois a existência de costume não legitima prática incompatível com impessoalidade, moralidade e igualdade de tratamento."},"gabarito":"D","comentario":"Costume institucional não transforma conduta antiética ou contrária aos princípios administrativos em conduta legítima. A ética pública exige exame crítico das práticas, especialmente quando favorecimentos pessoais comprometem imparcialidade.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","etica_moral","conflito_entre_costume_e_principio_juridico"]},{"id":"LEG070","area":"Legislação e Ética no Serviço Público","tema":"Valores Éticos","subtema":"Integridade","dificuldade":"intermediaria","enunciado":"No contexto da função pública, integridade está associada principalmente à","alternativas":{"A":"obtenção do maior benefício pessoal permitido.","B":"obediência automática a qualquer ordem.","C":"coerência da atuação com valores, princípios, deveres e finalidade pública, inclusive quando não há fiscalização imediata.","D":"manutenção de sigilo sobre todos os atos administrativos."},"gabarito":"C","comentario":"Integridade envolve consistência entre valores e comportamento, respeito às normas e rejeição de favorecimentos, fraudes e conflitos indevidos de interesse. Ela não depende da presença constante de fiscalização.","referencia":"Constituição Federal, art. 37, caput; princípios de integridade pública.","tags":["legislacao","valores_eticos","integridade"]},{"id":"LEG071","area":"Legislação e Ética no Serviço Público","tema":"Valores Éticos","subtema":"Honestidade","dificuldade":"intermediaria","enunciado":"Um servidor recebe por engano valor superior ao que lhe era devido e percebe o erro antes que a Administração o identifique. Sob a perspectiva da honestidade e da integridade, a conduta adequada é","alternativas":{"A":"comunicar o erro e adotar as providências cabíveis para regularização.","B":"manter o valor porque a falha foi administrativa.","C":"aguardar até eventual auditoria.","D":"dividir o valor com colegas."},"gabarito":"A","comentario":"Honestidade e integridade exigem comportamento leal e transparente. O fato de o erro ter origem administrativa não legitima apropriação consciente de valor indevido.","referencia":"Constituição Federal, art. 37, caput; princípios gerais de integridade e moralidade.","tags":["legislacao","valores_eticos","honestidade"]},{"id":"LEG072","area":"Legislação e Ética no Serviço Público","tema":"Valores Éticos","subtema":"Zelo","dificuldade":"intermediaria","enunciado":"O valor ético do zelo na função pública é melhor representado pela conduta do servidor que","alternativas":{"A":"cuida adequadamente dos recursos públicos e executa suas atribuições com atenção e responsabilidade.","B":"oculta erros para proteger a reputação do setor.","C":"utiliza equipamentos públicos para fins particulares quando não há fiscalização.","D":"retarda atendimentos para reduzir sua carga de trabalho."},"gabarito":"A","comentario":"Zelo significa cuidado diligente com o serviço, patrimônio, informações e interesses confiados ao agente público. Ele se relaciona à responsabilidade e à eficiência na execução das atribuições.","referencia":"Constituição Federal, art. 37, caput; valores gerais da ética pública.","tags":["legislacao","valores_eticos","zelo"]},{"id":"LEG073","area":"Legislação e Ética no Serviço Público","tema":"Valores Éticos","subtema":"Decoro","dificuldade":"dificil","enunciado":"Durante atendimento oficial, um servidor utiliza sua posição para humilhar deliberadamente cidadão que formulou crítica legítima ao órgão. Ainda que não exista vantagem patrimonial, a conduta pode ser eticamente reprovável por contrariar, entre outros valores,","alternativas":{"A":"a livre concorrência.","B":"o decoro e o respeito inerentes ao exercício da função pública.","C":"a soberania nacional.","D":"a autonomia legislativa da União."},"gabarito":"B","comentario":"Decoro envolve comportamento compatível com a dignidade e respeitabilidade da função. Humilhar cidadão por crítica legítima representa uso inadequado da posição pública e compromete respeito, urbanidade, cidadania e moralidade administrativa.","referencia":"Constituição Federal, art. 37, caput; princípios gerais de ética pública.","tags":["legislacao","valores_eticos","decoro"]},{"id":"LEG074","area":"Legislação e Ética no Serviço Público","tema":"Valores Éticos","subtema":"Virtude e função pública","dificuldade":"dificil","enunciado":"No estudo da ética, a ideia de virtude aplicada ao serviço público pode ser corretamente associada","alternativas":{"A":"à habilidade de contornar controles administrativos.","B":"à defesa incondicional de interesses corporativos.","C":"à obtenção de vantagens desde que não descobertas.","D":"à disposição estável para agir de maneira compatível com valores como prudência, justiça, honestidade e responsabilidade."},"gabarito":"D","comentario":"Virtude, no plano ético, refere-se a disposições e hábitos orientados à boa conduta. No serviço público, isso se traduz em comportamento consistente com justiça, prudência, honestidade, responsabilidade e compromisso com a coletividade.","referencia":"Constituição Federal, art. 37, caput; conceitos gerais de ética e virtude.","tags":["legislacao","valores_eticos","virtude_e_funcao_publica"]},{"id":"LEG075","area":"Legislação e Ética no Serviço Público","tema":"Ética, Democracia e Cidadania","subtema":"Servidor e cidadão","dificuldade":"facil","enunciado":"Em uma Administração orientada pela cidadania, o usuário do serviço público deve ser compreendido","alternativas":{"A":"como titular de direitos e participante da vida pública, merecendo atendimento compatível com os princípios administrativos.","B":"como subordinado pessoal do servidor.","C":"como beneficiário de favor concedido pelo agente.","D":"como pessoa sem direito a informações sobre a Administração."},"gabarito":"A","comentario":"O serviço público existe para atender finalidades coletivas. O cidadão não recebe favor pessoal do servidor: exerce direitos perante a Administração e deve ser tratado com respeito, impessoalidade e transparência.","referencia":"Constituição Federal, arts. 1º, II, e 37, caput; Lei Orgânica de Campina Grande, arts. 1º e 3º.","tags":["legislacao","etica_cidadania","servidor_e_cidadao"]},{"id":"LEG076","area":"Legislação e Ética no Serviço Público","tema":"Ética, Democracia e Cidadania","subtema":"Participação social","dificuldade":"intermediaria","enunciado":"A participação popular na Administração Pública é compatível com uma concepção democrática porque","alternativas":{"A":"permite substituir permanentemente todas as instituições representativas.","B":"elimina a necessidade de cumprimento das leis.","C":"autoriza decisões públicas sem qualquer procedimento.","D":"possibilita controle social, manifestação de interesses coletivos e aproximação entre cidadãos e poder público dentro dos mecanismos jurídicos existentes."},"gabarito":"D","comentario":"Democracia não se limita ao voto periódico. Mecanismos legítimos de participação e controle social podem ampliar transparência e responsividade sem eliminar instituições representativas ou os procedimentos jurídicos.","referencia":"Lei Orgânica do Município de Campina Grande, art. 3º e disposições sobre participação popular.","tags":["legislacao","etica_cidadania","participacao_social"]},{"id":"LEG077","area":"Legislação e Ética no Serviço Público","tema":"Ética, Democracia e Cidadania","subtema":"Crítica e prestação de contas","dificuldade":"dificil","enunciado":"Um gestor determina que servidores ignorem pedidos e críticas legítimas de cidadãos porque \"questionamentos prejudicam a autoridade administrativa\". Sob perspectiva ética e democrática, a orientação é","alternativas":{"A":"inadequada, pois autoridade pública deve conviver com transparência, controle, participação e prestação de contas.","B":"adequada, pois cidadania não inclui controle social.","C":"adequada sempre que a crítica for desfavorável ao governo.","D":"obrigatória em órgãos públicos."},"gabarito":"A","comentario":"O exercício democrático da Administração pressupõe accountability, transparência e possibilidade de controle social. Críticas legítimas e pedidos de informação não anulam autoridade administrativa; são parte do ambiente institucional democrático.","referencia":"Constituição Federal, art. 37, caput; Lei nº 12.527/2011; Lei Orgânica de Campina Grande, art. 3º.","tags":["legislacao","etica_cidadania","critica_e_prestacao_de_contas"]},{"id":"LEG078","area":"Legislação e Ética no Serviço Público","tema":"Ética, Democracia e Cidadania","subtema":"Igualdade no atendimento","dificuldade":"intermediaria","enunciado":"Em atendimento ao público, servidor decide colocar conhecidos à frente dos demais usuários sem qualquer prioridade prevista em lei. A prática","alternativas":{"A":"é legítima como manifestação de cortesia.","B":"é obrigatória quando o conhecido ocupar cargo público.","C":"é válida se não houver reclamação.","D":"é incompatível com o dever de tratamento impessoal e com a igualdade entre os usuários."},"gabarito":"D","comentario":"Prioridades de atendimento devem decorrer de critérios legais e objetivos. Favorecimento baseado em relação pessoal compromete impessoalidade, igualdade e confiança no serviço público.","referencia":"Constituição Federal, arts. 5º, caput, e 37, caput.","tags":["legislacao","etica_cidadania","igualdade_no_atendimento"]},{"id":"LEG079","area":"Legislação e Ética no Serviço Público","tema":"Ética, Democracia e Cidadania","subtema":"Papel do servidor","dificuldade":"dificil","enunciado":"A respeito do papel democrático do servidor público, assinale a alternativa correta.","alternativas":{"A":"O servidor exerce função em nome próprio e pode moldá-la a interesses particulares.","B":"O servidor atua como agente do Estado e deve exercer suas atribuições de modo compatível com direitos, princípios administrativos e finalidade pública.","C":"A legitimidade da atuação depende exclusivamente da vontade da chefia.","D":"A função pública afasta o dever de respeito aos direitos fundamentais."},"gabarito":"B","comentario":"O servidor exerce competência pública institucional. Sua atuação deve permanecer vinculada à ordem jurídica, aos direitos fundamentais, aos princípios administrativos e ao interesse público, não a preferências pessoais ou ordens manifestamente incompatíveis com o ordenamento.","referencia":"Constituição Federal, art. 37, caput; Lei Orgânica de Campina Grande, art. 9º.","tags":["legislacao","etica_cidadania","papel_do_servidor"]},{"id":"LEG080","area":"Legislação e Ética no Serviço Público","tema":"Princípios da Administração Pública","subtema":"Legalidade","dificuldade":"dificil","enunciado":"Um gestor cria, por decisão pessoal e sem fundamento normativo, obrigação administrativa que restringe direito do cidadão. Qual princípio constitucional é mais diretamente afetado?","alternativas":{"A":"Publicidade.","B":"Legalidade.","C":"Eficiência.","D":"Continuidade."},"gabarito":"B","comentario":"Na Administração Pública, a atuação deve encontrar fundamento no ordenamento jurídico. O agente não dispõe da mesma liberdade reconhecida ao particular para criar unilateralmente restrições ou obrigações sem suporte jurídico.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","principios_administrativos","legalidade"]},{"id":"LEG081","area":"Legislação e Ética no Serviço Público","tema":"Princípios da Administração Pública","subtema":"Impessoalidade","dificuldade":"intermediaria","enunciado":"A Administração seleciona beneficiários de programa público segundo relações de amizade com agentes políticos, ignorando critérios previamente definidos. O princípio mais diretamente violado é o da","alternativas":{"A":"impessoalidade.","B":"publicidade.","C":"especialidade.","D":"continuidade."},"gabarito":"A","comentario":"Impessoalidade exige atuação orientada por critérios objetivos e finalidade pública, impedindo favorecimentos e perseguições pessoais. Programas públicos não podem ser convertidos em instrumentos de benefício privado.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","principios_administrativos","impessoalidade"]},{"id":"LEG082","area":"Legislação e Ética no Serviço Público","tema":"Princípios da Administração Pública","subtema":"Moralidade","dificuldade":"intermediaria","enunciado":"Determinada conduta administrativa possui aparência formal de regularidade, mas é praticada deliberadamente para alcançar favorecimento incompatível com a finalidade pública. O caso demonstra que","alternativas":{"A":"a legalidade formal afasta qualquer análise adicional.","B":"a intenção do agente jamais possui relevância administrativa.","C":"somente o princípio da publicidade pode ser aplicado.","D":"a Administração também está submetida à moralidade, de modo que aparência formal de legalidade não legitima desvio ético-administrativo."},"gabarito":"D","comentario":"A moralidade possui força jurídica e exige atuação proba, leal e coerente com a finalidade pública. O simples cumprimento aparente de formalidades não legitima expediente concebido para fraude, favorecimento ou desvio de finalidade.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","principios_administrativos","moralidade"]},{"id":"LEG083","area":"Legislação e Ética no Serviço Público","tema":"Princípios da Administração Pública","subtema":"Publicidade","dificuldade":"intermediaria","enunciado":"Sobre o princípio da publicidade, assinale a alternativa correta.","alternativas":{"A":"Exige divulgação irrestrita de toda informação, inclusive a legalmente sigilosa.","B":"Favorece transparência e controle, sem eliminar hipóteses constitucionais ou legais de restrição de acesso.","C":"Aplica-se somente às despesas públicas.","D":"Autoriza divulgação de dados pessoais sem qualquer limitação."},"gabarito":"B","comentario":"Publicidade promove conhecimento dos atos e controle social, mas não é princípio absoluto. Sigilo legal, proteção de dados pessoais e outras restrições juridicamente justificadas devem ser respeitados.","referencia":"Constituição Federal, art. 37, caput; Lei nº 12.527/2011; Lei nº 13.709/2018.","tags":["legislacao","principios_administrativos","publicidade"]},{"id":"LEG084","area":"Legislação e Ética no Serviço Público","tema":"Princípios da Administração Pública","subtema":"Eficiência","dificuldade":"intermediaria","enunciado":"Uma unidade administrativa mantém procedimento extremamente demorado e redundante, embora exista solução juridicamente válida, mais simples e capaz de entregar o mesmo resultado com menor desperdício. A revisão do procedimento relaciona-se especialmente ao princípio da","alternativas":{"A":"autonomia privada.","B":"eficiência.","C":"irretroatividade penal.","D":"soberania."},"gabarito":"B","comentario":"Eficiência impõe busca por desempenho adequado, qualidade, racionalidade no emprego dos recursos e melhores resultados, sempre dentro da legalidade. Simplificação não autoriza violação de garantias, mas procedimentos desnecessariamente dispendiosos devem ser avaliados.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","principios_administrativos","eficiencia"]},{"id":"LEG085","area":"Legislação e Ética no Serviço Público","tema":"Princípios da Administração Pública","subtema":"LIMPE","dificuldade":"facil","enunciado":"O conjunto de princípios expressamente enunciados no caput do art. 37 da Constituição Federal é composto por","alternativas":{"A":"legalidade, proporcionalidade, transparência, economicidade e continuidade.","B":"legalidade, igualdade, motivação, publicidade e autotutela.","C":"legalidade, impessoalidade, moralidade, publicidade e eficiência.","D":"legitimidade, imparcialidade, motivação, planejamento e efetividade."},"gabarito":"C","comentario":"O caput do art. 37 consagra expressamente legalidade, impessoalidade, moralidade, publicidade e eficiência, frequentemente lembrados pela sigla LIMPE.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","principios_administrativos","limpe"]},{"id":"LEG086","area":"Legislação e Ética no Serviço Público","tema":"Aplicação dos Princípios Éticos","subtema":"Conflito de interesses e impessoalidade","dificuldade":"facil","enunciado":"Servidor encarregado de analisar requerimento apresentado por pessoa com quem mantém interesse pessoal direto deve, diante do risco à imparcialidade,","alternativas":{"A":"analisar o pedido secretamente.","B":"favorecer o interessado para evitar conflito.","C":"agir segundo os mecanismos jurídicos de impedimento ou afastamento aplicáveis, preservando a imparcialidade da decisão.","D":"ignorar a situação porque relações pessoais não afetam a ética pública."},"gabarito":"C","comentario":"A prevenção de conflitos de interesse protege impessoalidade e confiança institucional. Quando houver impedimento juridicamente relevante, o servidor deve observar o procedimento aplicável em vez de participar de decisão na qual sua imparcialidade esteja comprometida.","referencia":"Constituição Federal, art. 37, caput; princípios da impessoalidade e moralidade.","tags":["legislacao","aplicacao_principios_eticos","conflito_de_interesses_e_impessoalidade"]},{"id":"LEG087","area":"Legislação e Ética no Serviço Público","tema":"Aplicação dos Princípios Éticos","subtema":"Eficiência e legalidade","dificuldade":"dificil","enunciado":"Com a intenção de acelerar atendimentos, gestor determina que a equipe deixe de realizar verificação obrigatória prevista em lei. O argumento de eficiência","alternativas":{"A":"não legitima o descumprimento da lei, pois eficiência deve ser buscada em conjunto com a legalidade.","B":"torna válida qualquer simplificação.","C":"prevalece automaticamente sobre todos os demais princípios.","D":"autoriza o gestor a suspender a norma legal."},"gabarito":"A","comentario":"Os princípios administrativos devem ser harmonizados. Eficiência não funciona como autorização para afastar exigência legal válida. O gestor pode buscar melhorias, mas dentro das alternativas permitidas pelo ordenamento.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","aplicacao_principios_eticos","eficiencia_e_legalidade"]},{"id":"LEG088","area":"Legislação e Ética no Serviço Público","tema":"Aplicação dos Princípios Éticos","subtema":"Publicidade e proteção de dados","dificuldade":"facil","enunciado":"Ao divulgar informações administrativas, o servidor deve compreender que","alternativas":{"A":"a publicidade exige divulgação de todos os dados pessoais existentes.","B":"transparência administrativa deve ser compatibilizada com regras de sigilo e proteção de dados pessoais.","C":"a LGPD proibiu toda transparência pública.","D":"dados públicos nunca estão sujeitos a qualquer restrição."},"gabarito":"B","comentario":"Publicidade, LAI e LGPD devem ser interpretadas de forma integrada. Transparência não significa exposição indiscriminada de dados pessoais, assim como proteção de dados não pode ser utilizada como justificativa genérica para eliminar a transparência pública.","referencia":"Constituição Federal, art. 37, caput; Lei nº 12.527/2011; Lei nº 13.709/2018.","tags":["legislacao","aplicacao_principios_eticos","publicidade_e_protecao_de_dados"]},{"id":"LEG089","area":"Legislação e Ética no Serviço Público","tema":"Aplicação dos Princípios Éticos","subtema":"Uso de recursos públicos","dificuldade":"intermediaria","enunciado":"Servidor utiliza regularmente veículo oficial para resolver assuntos particulares, sem autorização e sem relação com o serviço. Sob o ponto de vista ético-administrativo, a prática","alternativas":{"A":"é legítima sempre que ocorrer fora do horário de expediente.","B":"é aceitável quando não houver gasto relevante de combustível.","C":"é questão exclusivamente privada.","D":"é incompatível com a destinação pública dos bens e com princípios como moralidade e impessoalidade."},"gabarito":"D","comentario":"Bens públicos são destinados ao atendimento de finalidades públicas. Sua utilização para conveniência pessoal, sem fundamento jurídico, representa apropriação indevida de recurso institucional e viola padrões de moralidade, finalidade e impessoalidade.","referencia":"Constituição Federal, art. 37, caput.","tags":["legislacao","aplicacao_principios_eticos","uso_de_recursos_publicos"]},{"id":"LEG090","area":"Legislação e Ética no Serviço Público","tema":"Aplicação dos Princípios Éticos","subtema":"Decisão administrativa ética","dificuldade":"intermediaria","enunciado":"Diante de situação administrativa complexa, qual conduta melhor expressa a aplicação integrada dos princípios éticos na Administração Pública?","alternativas":{"A":"Escolher a solução mais conveniente ao agente responsável.","B":"Priorizar a solução mais popular, ainda que contrária à lei.","C":"Cumprir ordem superior independentemente de sua compatibilidade jurídica.","D":"Buscar solução juridicamente válida, impessoal, moralmente adequada, transparente dentro dos limites legais e eficiente na realização da finalidade pública."},"gabarito":"D","comentario":"A boa decisão administrativa não resulta da aplicação isolada de um único princípio. O agente deve compatibilizar legalidade, impessoalidade, moralidade, publicidade, eficiência, respeito aos direitos fundamentais e finalidade pública.","referencia":"Constituição Federal, art. 37, caput; Lei Orgânica do Município de Campina Grande.","tags":["legislacao","aplicacao_principios_eticos","decisao_administrativa_etica"]}],"historia":[{"id":"HIS001","area":"História de Campina Grande-PB","tema":"Origens, povoamento e formação de Campina Grande","subtema":"Aldeamento indígena e início do povoamento colonial","dificuldade":"facil","enunciado":"A formação histórica de Campina Grande remonta ao final do século XVII. De acordo com a síntese histórica do IBGE, qual alternativa descreve corretamente um elemento desse processo inicial?","alternativas":{"A":"O núcleo surgiu como posto militar litorâneo transferido para a Borborema no século XVIII.","B":"A localidade foi fundada por comerciantes de algodão após a abertura da estrada de ferro.","C":"A área era ocupada por indígenas cariris, e Teodósio de Oliveira Lêdo fixou ali, em 1697, a tribo dos Ariás.","D":"O povoamento começou com a criação da Vila Nova da Rainha, sem ocupação anterior registrada."},"gabarito":"C","comentario":"O IBGE registra Campina Grande como uma das antigas localidades do interior paraibano, inicialmente associada a uma aldeia de indígenas cariris. Em 1697, Teodósio de Oliveira Lêdo fixou no local a tribo dos Ariás, e no ano seguinte iniciou-se a catequese por um franciscano. Portanto, o processo de formação antecede em muito a criação da vila e também o ciclo algodoeiro.","referencia":"IBGE. Histórico de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","origens","povoamento","cariris"]},{"id":"HIS002","area":"História de Campina Grande-PB","tema":"Origens, povoamento e formação de Campina Grande","subtema":"Posição geográfica e consolidação do povoado","dificuldade":"intermediaria","enunciado":"A consolidação do antigo povoado que daria origem a Campina Grande não pode ser explicada por um único fator. Qual combinação ajuda a compreender sua expansão no período colonial?","alternativas":{"A":"A posição entre o sertão e o litoral, associada à produção de gêneros de subsistência e à circulação de pessoas e mercadorias.","B":"A proximidade imediata do porto de Cabedelo e a predominância da atividade pesqueira.","C":"A exploração intensiva de ouro e diamantes na Borborema durante o século XVIII.","D":"A instalação precoce de grandes fábricas têxteis ainda no período colonial."},"gabarito":"A","comentario":"A posição geográfica de Campina Grande favorecia a ligação entre o interior e as zonas litorâneas. O IBGE também menciona terras adequadas a culturas como mandioca, milho e outros cereais. Essa combinação, somada à circulação comercial, contribuiu para que o aldeamento se transformasse em um povoado próspero.","referencia":"IBGE. Histórico de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","povoamento","geografia_historica","comercio"]},{"id":"HIS003","area":"História de Campina Grande-PB","tema":"Origens, povoamento e formação de Campina Grande","subtema":"Elevação a freguesia","dificuldade":"intermediaria","enunciado":"Em 1769, a localidade passou por uma mudança importante em sua organização religiosa e administrativa. Essa mudança correspondeu:","alternativas":{"A":"à criação da comarca de Campina Grande.","B":"à elevação direta do povoado à categoria de cidade.","C":"à instalação da primeira estação ferroviária da Borborema.","D":"à elevação do povoado à condição de freguesia, sob a invocação de Nossa Senhora da Conceição."},"gabarito":"D","comentario":"A criação da freguesia em 1769 demonstra que o núcleo já havia alcançado densidade populacional e importância suficientes para uma organização eclesiástica mais estruturada. A cidade só seria elevada à categoria de vila no fim do século XVIII e à condição de cidade em 1864.","referencia":"IBGE. Histórico de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","freguesia","nossa_senhora_da_conceicao","seculo_xviii"]},{"id":"HIS004","area":"História de Campina Grande-PB","tema":"Origens, povoamento e formação de Campina Grande","subtema":"Feira, circulação e formação urbana","dificuldade":"dificil","enunciado":"Ao analisar a formação de Campina Grande, é historicamente mais adequado interpretar a feira e as rotas de circulação como:","alternativas":{"A":"atividades marginais, sem relação significativa com a consolidação urbana.","B":"elementos estruturantes de uma centralidade comercial que aproximou litoral e sertão e ajudou a organizar o crescimento da localidade.","C":"fenômenos surgidos somente depois da industrialização da década de 1960.","D":"práticas limitadas à comercialização de produtos importados, sem vínculos com a produção regional."},"gabarito":"B","comentario":"A Feira de Campina Grande possui raízes no final do século XVIII e se desenvolveu em uma área de passagem entre litoral e sertão. O comércio, a circulação regional e as atividades da feira acompanharam e estimularam o crescimento urbano, de modo que a história da cidade e a história de sua feira se entrelaçam.","referencia":"IPHAN. Feira de Campina Grande, bem registrado no Livro dos Lugares. https://bcr.iphan.gov.br/bens-culturais/feira-de-campina-grande/","tags":["campina_grande","feira_central","formacao_urbana","circulacao_regional"]},{"id":"HIS005","area":"História de Campina Grande-PB","tema":"Origens, povoamento e formação de Campina Grande","subtema":"Vila Nova da Rainha","dificuldade":"facil","enunciado":"A denominação Vila Nova da Rainha está associada a qual etapa da formação histórica de Campina Grande?","alternativas":{"A":"À elevação da freguesia à categoria de vila, instalada em 1790.","B":"À mudança do nome da cidade durante a República Velha.","C":"À criação do distrito industrial na segunda metade do século XX.","D":"À emancipação de Campina Grande em relação ao estado de Pernambuco."},"gabarito":"A","comentario":"A localidade foi elevada à categoria de vila com a denominação de Vila Nova da Rainha, instalada em 20 de abril de 1790. O nome remetia à monarquia portuguesa. Essa etapa antecede a elevação de Campina Grande à condição de cidade, ocorrida em 1864.","referencia":"IBGE. Formação Administrativa de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","vila_nova_da_rainha","formacao_administrativa","1790"]},{"id":"HIS006","area":"História de Campina Grande-PB","tema":"Formação do município e evolução político-administrativa","subtema":"Criação e instalação da vila","dificuldade":"intermediaria","enunciado":"Sobre a formação político-administrativa de Campina Grande no final do século XVIII, assinale a alternativa correta.","alternativas":{"A":"A vila foi criada e instalada no mesmo dia em 1769.","B":"A vila foi criada após a elevação da localidade à condição de cidade.","C":"A instalação da vila ocorreu somente após a Independência do Brasil.","D":"A ordem de elevação à vila é anterior à instalação efetiva, que ocorreu em 20 de abril de 1790."},"gabarito":"D","comentario":"O IBGE registra ordem de elevação à categoria de vila, com a denominação de Vila Nova da Rainha, em 25 de agosto de 1788, e instalação em 20 de abril de 1790. A distinção entre ato de criação e instalação é importante para evitar confusão cronológica.","referencia":"IBGE. Formação Administrativa de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","vila_nova_da_rainha","administracao","seculo_xviii"]},{"id":"HIS007","area":"História de Campina Grande-PB","tema":"Formação do município e evolução político-administrativa","subtema":"Elevação à categoria de cidade","dificuldade":"facil","enunciado":"Campina Grande foi elevada à condição de cidade por meio da Lei Provincial nº 127. Em que data ocorreu essa elevação?","alternativas":{"A":"20 de abril de 1790.","B":"7 de setembro de 1822.","C":"11 de outubro de 1864.","D":"15 de novembro de 1889."},"gabarito":"C","comentario":"A Lei Provincial nº 127, de 11 de outubro de 1864, elevou Campina Grande à condição de cidade. A data tornou-se referência central na memória cívica do município e é celebrada como aniversário da cidade.","referencia":"IBGE. Formação Administrativa de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","1864","elevacao_a_cidade","lei_provincial_127"]},{"id":"HIS008","area":"História de Campina Grande-PB","tema":"Formação do município e evolução político-administrativa","subtema":"Criação da comarca","dificuldade":"intermediaria","enunciado":"A elevação de Campina Grande à categoria de cidade foi seguida por outra medida relevante de organização institucional. Qual foi ela?","alternativas":{"A":"A criação da Superintendência do Desenvolvimento do Nordeste.","B":"A criação da comarca, em 1865.","C":"A inauguração da iluminação elétrica, em 1865.","D":"A instalação do primeiro distrito industrial, em 1865."},"gabarito":"B","comentario":"Segundo publicação histórica do IBGE, um ano após a elevação à categoria de cidade, a Lei nº 138, de 8 de agosto de 1865, criou a comarca. Isso evidencia o avanço da institucionalização político-administrativa do núcleo urbano.","referencia":"IBGE. Monografia histórica de Campina Grande. https://www.ibge.gov.br/biblioteca/visualizacao/periodicos/113/col_mono_n10_campinagrande_2ed.pdf","tags":["campina_grande","comarca","1865","organizacao_institucional"]},{"id":"HIS009","area":"História de Campina Grande-PB","tema":"Formação do município e evolução político-administrativa","subtema":"Reorganização territorial e distritos","dificuldade":"dificil","enunciado":"Os registros administrativos do século XX mostram mudanças no número e na composição dos distritos de Campina Grande. Historicamente, esse dado permite concluir que:","alternativas":{"A":"a configuração territorial do município passou por sucessivas reorganizações, acompanhando desmembramentos, mudanças de denominação e novas divisões administrativas.","B":"o território municipal permaneceu praticamente inalterado desde 1790.","C":"todos os atuais municípios vizinhos sempre foram bairros de Campina Grande.","D":"a divisão distrital deixou de existir logo após a elevação à categoria de cidade."},"gabarito":"A","comentario":"O IBGE registra diferentes composições distritais ao longo do século XX. Em 1911, por exemplo, o município aparecia com Campina Grande, Pocinhos, Fagundes e Boa Vista; já nas divisões de 1936 e 1937 havia nove distritos. Essas alterações refletem a dinâmica territorial e administrativa regional.","referencia":"IBGE. Formação Administrativa de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","distritos","territorio","evolucao_administrativa"]},{"id":"HIS010","area":"História de Campina Grande-PB","tema":"Formação do município e evolução político-administrativa","subtema":"Participação política no século XIX","dificuldade":"intermediaria","enunciado":"A participação de habitantes de Campina Grande em movimentos como os de 1817, 1824 e 1848, além da ocorrência do Quebra-Quilos em 1874, demonstra que o município:","alternativas":{"A":"permaneceu politicamente isolado das disputas provinciais e nacionais.","B":"participou apenas de conflitos relacionados à industrialização.","C":"teve sua vida política iniciada somente após a Proclamação da República.","D":"esteve inserido em disputas e mobilizações políticas que ultrapassavam os limites estritamente locais."},"gabarito":"D","comentario":"A história política de Campina Grande está relacionada a movimentos de alcance regional e nacional no século XIX. O IBGE registra participação local nos movimentos de 1817, 1824 e 1848 e destaca a eclosão do Quebra-Quilos em 1874, que depois se espalhou para outras localidades do Nordeste.","referencia":"IBGE. Histórico de Campina Grande-PB. https://www.ibge.gov.br/biblioteca/visualizacao/dtb/paraiba/campinagrande.pdf","tags":["campina_grande","movimentos_politicos","quebra_quilos","seculo_xix"]},{"id":"HIS011","area":"História de Campina Grande-PB","tema":"Desenvolvimento econômico de Campina Grande","subtema":"Entreposto comercial e posição regional","dificuldade":"facil","enunciado":"Antes mesmo do auge algodoeiro do século XX, Campina Grande já apresentava uma característica econômica importante. Qual?","alternativas":{"A":"Dependência quase exclusiva da atividade portuária.","B":"Função de entreposto comercial entre áreas do interior e centros consumidores do litoral.","C":"Especialização predominante na mineração de metais preciosos.","D":"Economia baseada principalmente na pesca marítima."},"gabarito":"B","comentario":"A posição de Campina Grande favorecia a circulação entre o sertão e o litoral. Ao longo do tempo, essa condição fortaleceu feiras, comércio e serviços, preparando o terreno para a posterior expansão algodoeira e para a consolidação de uma centralidade regional.","referencia":"IBGE. Histórico de Campina Grande-PB.","tags":["campina_grande","economia","entreposto_comercial","centralidade_regional"]},{"id":"HIS012","area":"História de Campina Grande-PB","tema":"Desenvolvimento econômico de Campina Grande","subtema":"Comércio e formação industrial","dificuldade":"intermediaria","enunciado":"Sobre a relação entre comércio e industrialização na trajetória econômica campinense, assinale a alternativa correta.","alternativas":{"A":"A industrialização eliminou imediatamente o comércio tradicional no início do século XX.","B":"A indústria surgiu sem qualquer ligação com as atividades comerciais anteriores.","C":"O setor industrial antecedeu o desenvolvimento do comércio regional.","D":"A força comercial, especialmente ligada ao algodão, contribuiu para a formação de capital, mercados e atividades de beneficiamento que favoreceram as primeiras indústrias."},"gabarito":"D","comentario":"A industrialização inicial de Campina Grande esteve ligada ao dinamismo comercial. O algodão foi central nesse processo: sua compra, beneficiamento, prensagem e circulação estimularam estabelecimentos industriais e consolidaram relações econômicas que depois se diversificaram.","referencia":"LIMA, Damião de. A industrialização de Campina Grande e suas especificidades, UFCG.","tags":["campina_grande","economia","comercio","industrializacao"]},{"id":"HIS013","area":"História de Campina Grande-PB","tema":"Desenvolvimento econômico de Campina Grande","subtema":"Feiras e circulação mercantil no século XIX","dificuldade":"intermediaria","enunciado":"Em fins do século XIX, antes da chegada da ferrovia, o comércio de Campina Grande já era intenso. Qual fator ajuda a explicar esse quadro?","alternativas":{"A":"A passagem de uma importante estrada que conectava sertões paraibanos e norte-rio-grandenses aos centros da Paraíba e do Recife, somada às feiras locais.","B":"A existência de um porto fluvial de grande capacidade no centro da cidade.","C":"A exportação direta de mercadorias por via marítima a partir do município.","D":"A concentração da economia regional em minas de carvão mineral."},"gabarito":"A","comentario":"O IBGE registra que, em 1888, Campina Grande já possuía intenso movimento comercial. A cidade se beneficiava de sua posição em uma rota que conectava áreas sertanejas aos centros da Paraíba e do Recife, além de contar com feiras de gado e gêneros alimentícios.","referencia":"IBGE. Histórico de Campina Grande-PB.","tags":["campina_grande","feiras","rotas_comerciais","seculo_xix"]},{"id":"HIS014","area":"História de Campina Grande-PB","tema":"Desenvolvimento econômico de Campina Grande","subtema":"Mudanças de ciclos e reestruturação econômica","dificuldade":"dificil","enunciado":"Qual interpretação melhor representa a evolução econômica de Campina Grande ao longo do século XX?","alternativas":{"A":"A economia permaneceu dependente do algodão durante todo o século, sem diversificação relevante.","B":"O município abandonou o comércio assim que surgiram as primeiras fábricas.","C":"Houve uma trajetória de reestruturação, na qual a centralidade comercial e algodoeira foi seguida por maior industrialização e, posteriormente, por fortalecimento de serviços, educação e novas atividades urbanas.","D":"A industrialização ocorreu antes do desenvolvimento comercial, que só se consolidou depois de 1970."},"gabarito":"C","comentario":"A história econômica campinense não é linear nem reduzível a um único setor. O comércio e o algodão tiveram grande importância; a industrialização ganhou força em meados do século XX; e, ao longo das décadas seguintes, outras funções urbanas, educacionais, tecnológicas e de serviços reforçaram sua centralidade regional.","referencia":"UFCG, estudos sobre industrialização e modernização de Campina Grande; IBGE, REGIC 2018.","tags":["campina_grande","reestruturacao_economica","industrializacao","servicos"]},{"id":"HIS015","area":"História de Campina Grande-PB","tema":"Desenvolvimento econômico de Campina Grande","subtema":"Infraestrutura e crescimento econômico","dificuldade":"intermediaria","enunciado":"O IBGE destaca três marcos de infraestrutura como decisivos para o surto de progresso local nas primeiras décadas do século XX. São eles:","alternativas":{"A":"aeroporto, universidade federal e distrito industrial.","B":"ferrovia em 1907, iluminação elétrica em 1919 e abastecimento de água em 1939.","C":"rodovia federal em 1889, porto seco em 1900 e metrô em 1910.","D":"rede de gás em 1907, telefonia móvel em 1919 e barragem em 1939."},"gabarito":"B","comentario":"A ferrovia ampliou a capacidade de circulação de mercadorias; a eletricidade favoreceu atividades urbanas e produtivas; e o abastecimento de água foi fundamental para sustentar o crescimento populacional e econômico. O IBGE destaca esses três fatores na trajetória de expansão da cidade.","referencia":"IBGE. Histórico de Campina Grande-PB.","tags":["campina_grande","infraestrutura","ferrovia","urbanizacao"]},{"id":"HIS016","area":"História de Campina Grande-PB","tema":"Ciclo do algodão e expansão comercial","subtema":"Chegada da ferrovia e comércio algodoeiro","dificuldade":"facil","enunciado":"A inauguração do ramal ferroviário em Campina Grande, em 1907, teve impacto direto sobre o ciclo do algodão porque:","alternativas":{"A":"facilitou o escoamento e ampliou a circulação do algodão e de outras mercadorias, reforçando a função comercial da cidade.","B":"encerrou o comércio por tropas e retirou de Campina Grande sua centralidade regional.","C":"substituiu o algodão pela mineração como principal atividade econômica.","D":"transformou a cidade imediatamente em capital administrativa da Paraíba."},"gabarito":"A","comentario":"A ferrovia reduziu dificuldades de transporte e conectou Campina Grande de forma mais eficiente a outros mercados. Estudos históricos relacionam diretamente o avanço da economia algodoeira à expansão ferroviária, que reforçou a condição da cidade como polo mercantil regional.","referencia":"UFCG. Campina Grande no espaço econômico regional: estrada de ferro, tropeiros e empório comercial algodoeiro (1907-1957).","tags":["campina_grande","algodao","ferrovia","1907"]},{"id":"HIS017","area":"História de Campina Grande-PB","tema":"Ciclo do algodão e expansão comercial","subtema":"Empório algodoeiro e polarização regional","dificuldade":"intermediaria","enunciado":"No auge da economia algodoeira, a expressão 'empório do Sertão' aplicada a Campina Grande indica principalmente:","alternativas":{"A":"que a cidade produzia sozinha todo o algodão comercializado no Nordeste.","B":"que a economia local se restringia ao cultivo rural dentro dos limites municipais.","C":"que Campina Grande concentrava compra, beneficiamento, circulação e redistribuição do algodão produzido em uma área regional mais ampla.","D":"que a cidade havia perdido sua função comercial para os portos litorâneos."},"gabarito":"C","comentario":"A força de Campina Grande no ciclo algodoeiro não dependia apenas da produção dentro do município. Sua importância vinha sobretudo da função mercantil: o algodão de diferentes áreas do interior convergia para a cidade, onde era negociado, beneficiado e encaminhado a outros mercados.","referencia":"UFCG. Campina Grande no espaço econômico regional: estrada de ferro, tropeiros e empório comercial algodoeiro (1907-1957).","tags":["campina_grande","algodao","emporio_do_sertao","comercio_regional"]},{"id":"HIS018","area":"História de Campina Grande-PB","tema":"Ciclo do algodão e expansão comercial","subtema":"Algodão e primeiras indústrias","dificuldade":"dificil","enunciado":"A relação entre o ciclo do algodão e a industrialização inicial de Campina Grande pode ser explicada corretamente pela afirmação de que:","alternativas":{"A":"o algodão prejudicou a formação industrial porque impedia qualquer atividade de transformação.","B":"as primeiras indústrias surgiram apenas após o completo desaparecimento do comércio algodoeiro.","C":"o algodão teve importância apenas cultural, sem efeitos sobre investimentos e infraestrutura.","D":"o dinamismo algodoeiro favoreceu atividades de beneficiamento e prensagem e ajudou a formar as bases de uma industrialização vinculada ao próprio circuito comercial."},"gabarito":"D","comentario":"As primeiras indústrias de maior expressão em Campina Grande estiveram relacionadas ao beneficiamento e à prensagem de algodão. Assim, comércio e indústria não devem ser vistos como fases totalmente separadas: a própria economia algodoeira gerou demanda, capital e infraestrutura para atividades industriais.","referencia":"LIMA, Damião de. A industrialização de Campina Grande e suas especificidades, UFCG.","tags":["campina_grande","algodao","beneficiamento","industrializacao"]},{"id":"HIS019","area":"História de Campina Grande-PB","tema":"Ciclo do algodão e expansão comercial","subtema":"Declínio do algodão e mudança de estratégia econômica","dificuldade":"dificil","enunciado":"Na interpretação de estudos sobre a modernização campinense, o declínio da força econômica do algodão na década de 1960 relacionou-se a qual movimento?","alternativas":{"A":"ao retorno deliberado da economia local ao modelo exclusivamente agropecuário.","B":"à busca de novas estratégias de desenvolvimento, com maior ênfase na industrialização e em projetos de modernização urbana.","C":"ao abandono de políticas de infraestrutura e de atração de investimentos.","D":"à extinção da função regional de Campina Grande."},"gabarito":"B","comentario":"Pesquisas da UFCG destacam que, diante da crise da atividade algodoeira, a industrialização passou a ser apresentada como alternativa para sustentar o dinamismo econômico e a imagem de modernidade da cidade. Esse processo esteve ligado a políticas regionais de desenvolvimento e a iniciativas locais.","referencia":"FERNANDES, Silvana Torquato. Uma outra representação da modernização em Campina Grande, UFCG.","tags":["campina_grande","declinio_algodao","industrializacao","modernizacao"]},{"id":"HIS020","area":"História de Campina Grande-PB","tema":"Ciclo do algodão e expansão comercial","subtema":"Algodão e transformações sociais e urbanas","dificuldade":"intermediaria","enunciado":"O crescimento econômico proporcionado pelo algodão, especialmente entre as primeiras décadas e meados do século XX, teve repercussões além do comércio. Entre elas, destaca-se:","alternativas":{"A":"a ampliação de práticas de consumo, mudanças no cotidiano e fortalecimento de discursos de modernização urbana.","B":"o desaparecimento das atividades comerciais tradicionais.","C":"a redução da circulação de pessoas e mercadorias no centro urbano.","D":"a interrupção do crescimento populacional."},"gabarito":"A","comentario":"Estudos sobre o período de 1930 a 1950 mostram que o comércio algodoeiro esteve associado a forte crescimento econômico e a mudanças na cultura material e no cotidiano. As elites locais passaram a valorizar símbolos de modernidade, novos equipamentos e reformas urbanas.","referencia":"UFCG. Modernização, cotidiano e cultura material em Campina Grande-PB (1930-1950).","tags":["campina_grande","algodao","modernizacao","cotidiano"]},{"id":"HIS021","area":"História de Campina Grande-PB","tema":"Urbanização, modernização e industrialização","subtema":"Primeiras indústrias e diversificação produtiva","dificuldade":"facil","enunciado":"Nas primeiras décadas do século XX, quais atividades industriais tiveram papel pioneiro em Campina Grande?","alternativas":{"A":"Indústrias automobilísticas e petroquímicas.","B":"Siderúrgicas e estaleiros navais.","C":"Indústrias eletrônicas e aeronáuticas.","D":"Estabelecimentos ligados ao beneficiamento e à prensagem do algodão."},"gabarito":"D","comentario":"O algodão serviu de base para as primeiras indústrias de maior expressão no município. Até a década de 1940, as atividades de beneficiamento e prensagem ocupavam posição predominante, antes da ampliação para ramos como têxteis, couro e alimentos.","referencia":"LIMA, Damião de. A industrialização de Campina Grande e suas especificidades, UFCG.","tags":["campina_grande","industrializacao","algodao","beneficiamento"]},{"id":"HIS022","area":"História de Campina Grande-PB","tema":"Urbanização, modernização e industrialização","subtema":"Infraestrutura para a industrialização","dificuldade":"intermediaria","enunciado":"Pesquisas sobre o processo de industrialização de Campina Grande nas décadas de 1950 e 1960 mostram que a atração de indústrias dependia também de superar limitações urbanas. Entre as necessidades apontadas estavam:","alternativas":{"A":"apenas a ampliação das áreas agrícolas no centro da cidade.","B":"melhoria de abastecimento de água, oferta de energia e formação de mão de obra qualificada.","C":"construção de portos marítimos dentro do município.","D":"redução das conexões rodoviárias e ferroviárias com outras regiões."},"gabarito":"B","comentario":"A industrialização exigia infraestrutura urbana capaz de sustentar novas fábricas. Estudos baseados no Diário da Borborema mostram que água, energia e mão de obra qualificada apareciam como condições essenciais, enquanto o rápido crescimento populacional também pressionava os serviços existentes.","referencia":"SOUZA, Danilo Rodrigues. Planejar para industrializar, UFCG.","tags":["campina_grande","industrializacao","infraestrutura","mao_de_obra"]},{"id":"HIS023","area":"História de Campina Grande-PB","tema":"Urbanização, modernização e industrialização","subtema":"SUDENE e industrialização dirigida","dificuldade":"dificil","enunciado":"A industrialização campinense dos anos 1960 distingue-se da fase anterior porque passou a ocorrer, em maior medida, sob políticas de desenvolvimento regional. Qual alternativa expressa corretamente essa mudança?","alternativas":{"A":"A cidade rejeitou incentivos estatais e passou a depender apenas de pequenas oficinas artesanais.","B":"A economia voltou a ser estruturada exclusivamente pelo comércio de algodão in natura.","C":"A atuação da SUDENE e políticas de criação de áreas industriais favoreceram uma industrialização mais planejada e a atração de novos investimentos.","D":"A industrialização foi interrompida com a criação da SUDENE."},"gabarito":"C","comentario":"A SUDENE, criada em 1959, integrou uma nova etapa das políticas de desenvolvimento do Nordeste. Em Campina Grande, a década de 1960 marcou maior articulação entre incentivos públicos, planejamento, atração de indústrias e criação de estruturas voltadas ao setor industrial.","referencia":"UFCG. Estudos sobre industrialização e modernização em Campina Grande.","tags":["campina_grande","sudene","industrializacao_dirigida","desenvolvimento_regional"]},{"id":"HIS024","area":"História de Campina Grande-PB","tema":"Urbanização, modernização e industrialização","subtema":"Localização das zonas industriais","dificuldade":"intermediaria","enunciado":"A localização de estabelecimentos industriais em áreas próximas ao Açude de Bodocongó e ao eixo do Açude Velho-estação ferroviária pode ser interpretada como resultado:","alternativas":{"A":"da busca por água, facilidades de transporte, proximidade de mercados e condições adequadas ao funcionamento das fábricas.","B":"de uma proibição legal que obrigava todas as fábricas a funcionar ao lado de açudes.","C":"da inexistência de ativid vel com atividades tecnológicas e econômicas contemporâneas."},"gabarito":"B","comentario":"A Campina Grande contemporânea combina continuidade e transformação. A cidade preserva referências como a Feira, o patrimônio urbano e a memória do algodão, ao mesmo tempo em que exerce funções regionais em serviços, educação, tecnologia, cultura e economia. Essa sobreposição de temporalidades ajuda a explicar sua identidade atual.","referencia":"IBGE. REGIC 2018; Prefeitura de Campina Grande, informações sobre inovação, cultura e desenvolvimento.","tags":["campina_grande","identidade_contemporanea","inovacao","centralidade_regional"]},{"id":"HIS035","area":"História de Campina Grande-PB","tema":"Campina Grande contemporânea: patrimônio, identidade e importância regional","subtema":"Preservação patrimonial e uso contemporâneo","dificuldade":"intermediaria","enunciado":"As ações recentes de revitalização da Feira Central e de recuperação de edifícios históricos, como o Grande Hotel, podem ser interpretadas como:","alternativas":{"A":"tentativas de eliminar usos contemporâneos dos espaços históricos.","B":"medidas sem relação com a memória urbana e com a identidade local.","C":"políticas de preservação que procuram conciliar memória, uso urbano, atividade econômica e transmissão do patrimônio às novas gerações.","D":"provas de que o patrimônio de Campina Grande se limita a edifícios sem função social."},"gabarito":"C","comentario":"Preservar patrimônio não significa congelar a cidade no passado. As políticas de requalificação procuram manter valores históricos e arquitetônicos ao mesmo tempo em que permitem usos econômicos, culturais e urbanos. Esse princípio aparece tanto na revitalização da Feira Central quanto na recuperação de edifícios históricos.","referencia":"Prefeitura de Campina Grande. Revitalização da Feira Central e recuperação do Grande Hotel.","tags":["campina_grande","patrimonio","revitalizacao","memoria_urbana"]}]};
const FILES = [
  { key: 'portugues', file: 'data/portugues.json', expected: 120, prefix: 'POR', label: 'Língua Portuguesa' },
  { key: 'informatica', file: 'data/informatica.json', expected: 175, prefix: 'INF', label: 'Noções de Informática' },
  { key: 'raciocinio', file: 'data/raciocinio-logico.json', expected: 80, prefix: 'RAC', label: 'Raciocínio Lógico' },
  { key: 'legislacao', file: 'data/legislacao-etica.json', expected: 90, prefix: 'LEG', label: 'Legislação e Ética no Serviço Público' },
  { key: 'historia', file: 'data/historia-campina-grande.json', expected: 35, prefix: 'HIS', label: 'História de Campina Grande-PB' }
];

const REQUIRED = ['id','area','tema','subtema','dificuldade','enunciado','alternativas','gabarito','comentario','referencia','tags'];
const DIFFICULTIES = new Set(['facil', 'intermediaria', 'dificil']);

function normalizeText(value = '') {
  return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function validateQuestion(q, seenIds) {
  const issues = [];
  if (!q || typeof q !== 'object' || Array.isArray(q)) return ['registro não é objeto'];
  for (const key of REQUIRED) if (!(key in q)) issues.push(`campo ausente: ${key}`);
  if (!q.id || typeof q.id !== 'string') issues.push('id vazio/inválido');
  if (seenIds.has(q.id)) issues.push('id duplicado');
  const altKeys = q.alternativas && typeof q.alternativas === 'object' && !Array.isArray(q.alternativas) ? Object.keys(q.alternativas).sort().join('') : '';
  if (altKeys !== 'ABCD') issues.push('alternativas devem conter exatamente A, B, C e D');
  else for (const letter of ['A','B','C','D']) if (!String(q.alternativas[letter] || '').trim()) issues.push(`alternativa ${letter} vazia`);
  if (!['A','B','C','D'].includes(q.gabarito)) issues.push('gabarito inválido');
  if (!DIFFICULTIES.has(q.dificuldade)) issues.push('dificuldade inválida');
  if (!Array.isArray(q.tags)) issues.push('tags deve ser array');
  for (const field of ['area','tema','subtema','enunciado','comentario','referencia']) if (!String(q[field] || '').trim()) issues.push(`${field} vazio`);
  return issues;
}

async function loadQuestionBank() {
  const questions = [];
  const seen = new Set();
  const report = [];
  for (const descriptor of FILES) {
    try {
      const data = EMBEDDED_BANKS[descriptor.key];
      if (!Array.isArray(data)) throw new Error('banco incorporado não é um array');
      let valid = 0, invalid = 0;
      for (let i = 0; i < data.length; i++) {
        const q = data[i];
        const issues = validateQuestion(q, seen);
        if (issues.length) {
          invalid++;
          console.error(`[Banco ${descriptor.key}] Questão inválida na posição ${i}:`, q?.id, issues);
          continue;
        }
        if (!q.id.startsWith(descriptor.prefix)) console.warn(`[Banco ${descriptor.key}] Prefixo inesperado em ${q.id}.`);
        seen.add(q.id); questions.push(q); valid++;
      }
      report.push({ ...descriptor, loaded: true, valid, invalid, sourceCount: data.length, embedded: true });
    } catch (error) {
      console.error(`Falha ao carregar banco incorporado ${descriptor.key}:`, error);
      report.push({ ...descriptor, loaded: false, valid: 0, invalid: 0, sourceCount: 0, error: String(error.message || error) });
    }
  }
  return { questions, report };
}

function getBankMetadata(questions) {
  const byArea = new Map();
  for (const q of questions) {
    if (!byArea.has(q.area)) byArea.set(q.area, { area: q.area, count: 0, themes: new Set(), subthemes: new Set() });
    const item = byArea.get(q.area);
    item.count++;
    item.themes.add(q.tema);
    item.subthemes.add(q.subtema);
  }
  return [...byArea.values()].map(item => ({ ...item, themes: [...item.themes].sort(), subthemes: [...item.subthemes].sort() }));
}

function getFilterOptions(questions, partial = {}) {
  let base = questions;
  if (partial.area) base = base.filter(q => q.area === partial.area);
  if (partial.tema) base = base.filter(q => q.tema === partial.tema);
  const unique = key => [...new Set(base.map(q => q[key]).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'pt-BR'));
  return {
    areas: [...new Set(questions.map(q => q.area))].sort((a,b) => a.localeCompare(b, 'pt-BR')),
    temas: unique('tema'),
    subtemas: unique('subtema')
  };
}

function searchQuestions(questions, query) {
  const qn = normalizeText(query).trim();
  if (!qn) return [];
  return questions.filter(q => {
    const haystack = [q.id, q.area, q.tema, q.subtema, q.enunciado, ...(Array.isArray(q.tags) ? q.tags : [])]
      .map(normalizeText).join(' ');
    return haystack.includes(qn);
  });
}

function displayArea(area) {
  return area;
}

function difficultyLabel(value) {
  return ({ facil: 'Fácil', intermediaria: 'Intermediária', dificil: 'Difícil' })[value] || value;
}

function areaCode(area) {
  if (area === 'Língua Portuguesa') return 'POR';
  if (area === 'Noções de Informática') return 'INF';
  if (area === 'Raciocínio Lógico') return 'RAC';
  if (area === 'Legislação e Ética no Serviço Público') return 'LEG';
  if (area === 'História de Campina Grande-PB') return 'HIS';
  return 'GER';
}


/* ===== training.js ===== */
function trainingUid(prefix = 'session') {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
}

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function applyQuestionFilters(questions, filters, statsMap = {}, favorites = new Set()) {
  const search = normalizeText(filters.search || '').trim();
  return questions.filter(q => {
    if (filters.area && q.area !== filters.area) return false;
    if (filters.tema && q.tema !== filters.tema) return false;
    if (filters.subtema && q.subtema !== filters.subtema) return false;
    if (filters.dificuldade && q.dificuldade !== filters.dificuldade) return false;
    if (filters.onlyFavorites && !favorites.has(q.id)) return false;

    const stat = statsMap[q.id];
    const attempted = Number(stat?.attempts || 0) > 0;
    switch (filters.status) {
      case 'respondidas': if (!attempted) return false; break;
      case 'nao-respondidas': if (attempted) return false; break;
      case 'corretas': if (!attempted || stat.lastCorrect !== true) return false; break;
      case 'erradas': if (!attempted || Number(stat.wrong || 0) < 1) return false; break;
      default: break;
    }

    if (search) {
      const haystack = normalizeText([q.id, q.area, q.tema, q.subtema, q.enunciado, ...(q.tags || [])].join(' '));
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

function createTrainingSession(eligibleQuestions, amount, filters = {}, mode = 'personalizado') {
  const n = Number(amount);
  if (!Number.isInteger(n) || n < 1) throw new Error('Informe uma quantidade válida de questões.');
  if (n > eligibleQuestions.length) throw new Error(`Existem apenas ${eligibleQuestions.length} questões disponíveis com estes filtros.`);
  return {
    type: 'training',
    id: trainingUid('training'),
    mode,
    filters,
    questionIds: shuffle(eligibleQuestions).slice(0, n).map(q => q.id),
    index: 0,
    selected: {},
    confirmed: {},
    cut: {},
    startedAt: new Date().toISOString(),
    endedAt: null
  };
}

async function persistTrainingSession(session) {
  await saveActiveSession('training', session);
}

function getTrainingSummary(session) {
  const entries = Object.values(session.confirmed || {});
  const correct = entries.filter(x => x.correct).length;
  const wrong = entries.length - correct;
  const percent = entries.length ? Math.round((correct / entries.length) * 1000) / 10 : 0;
  return { answered: entries.length, correct, wrong, percent };
}

async function confirmTrainingAnswer(session, question, selected) {
  if (!selected || !['A','B','C','D'].includes(selected)) throw new Error('Selecione uma alternativa antes de confirmar.');
  if (session.confirmed[question.id]) return session.confirmed[question.id];
  const attempt = await recordAttempt({
    attemptId: `training:${session.id}:${question.id}`,
    questionId: question.id,
    selected,
    correctAnswer: question.gabarito,
    mode: 'training',
    sessionId: session.id
  });
  session.selected[question.id] = attempt.selected;
  session.confirmed[question.id] = { selected: attempt.selected, correct: attempt.correct, confirmedAt: attempt.timestamp };
  await persistTrainingSession(session);
  return session.confirmed[question.id];
}

async function finishTraining(session) {
  if (session.endedAt || session._finishing) throw new Error('Este treino já está sendo finalizado.');
  session._finishing = true;
  try {
    const summary = getTrainingSummary(session);
    const endedAt = new Date().toISOString();
    const durationSec = Math.max(0, Math.round((new Date(endedAt) - new Date(session.startedAt)) / 1000));
    const record = await saveTrainingHistory({
      id: session.id,
      startedAt: session.startedAt,
      endedAt,
      mode: session.mode,
      filters: session.filters,
      quantity: session.questionIds.length,
      answered: summary.answered,
      correct: summary.correct,
      wrong: summary.wrong,
      percent: summary.percent,
      durationSec,
      questionIds: session.questionIds
    });
    session.endedAt = endedAt;
    await clearActiveSession('training');
    return record;
  } finally {
    delete session._finishing;
  }
}

function secondsSince(iso) {
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
}


/* ===== exam.js ===== */
const EXAM_MINUTES = 120;
const DISTRIBUTION = [
  { match: area => area === 'Língua Portuguesa', count: 7, label: 'Língua Portuguesa' },
  { match: area => area === 'Noções de Informática', count: 11, label: 'Noções de Informática' },
  { match: area => area === 'Raciocínio Lógico', count: 5, label: 'Raciocínio Lógico' },
  { match: area => area === 'Legislação e Ética no Serviço Público', count: 5, label: 'Legislação e Ética no Serviço Público' },
  { match: area => area === 'História de Campina Grande-PB', count: 2, label: 'História de Campina Grande-PB' }
];

function examUid() { return `exam-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`; }

function createExamSession(questions) {
  const selected = [];
  for (const rule of DISTRIBUTION) {
    const pool = questions.filter(q => rule.match(q.area));
    if (pool.length < rule.count) throw new Error(`Banco insuficiente para ${rule.label}: ${pool.length}/${rule.count}.`);
    selected.push(...shuffle(pool).slice(0, rule.count));
  }
  const now = Date.now();
  return {
    type: 'exam',
    id: examUid(),
    questionIds: shuffle(selected).map(q => q.id),
    index: 0,
    answers: {},
    cut: {},
    startedAt: new Date(now).toISOString(),
    endsAt: new Date(now + EXAM_MINUTES * 60 * 1000).toISOString(),
    finishedAt: null,
    autoFinished: false
  };
}

async function persistExamSession(session) {
  await saveActiveSession('exam', session);
}

function examRemainingSeconds(session) {
  return Math.max(0, Math.ceil((new Date(session.endsAt).getTime() - Date.now()) / 1000));
}

function examBlankCount(session) {
  return session.questionIds.filter(id => !session.answers[id]).length;
}

function setExamAnswer(session, questionId, letter) {
  if (!['A','B','C','D'].includes(letter)) return;
  session.answers[questionId] = letter;
}

async function finishExam(session, questionMap, { auto = false } = {}) {
  if (session.finishedAt || session._finishing) throw new Error('Este simulado já está sendo finalizado ou foi finalizado.');
  session._finishing = true;
  const endedAt = new Date().toISOString();

  try {
    let correct = 0;
    let wrong = 0;
    let blanks = 0;
    const byArea = {};
    const review = [];

    for (const qid of session.questionIds) {
      const q = questionMap.get(qid);
      if (!q) throw new Error(`Questão ${qid} do simulado não foi encontrada no banco.`);
      const selected = session.answers[qid] || null;
      const area = displayArea(q.area);
      byArea[area] ||= { total: 0, correct: 0, wrong: 0, blanks: 0 };
      byArea[area].total++;

      if (!selected) {
        blanks++;
        byArea[area].blanks++;
      } else {
        const isCorrect = selected === q.gabarito;
        if (isCorrect) { correct++; byArea[area].correct++; }
        else { wrong++; byArea[area].wrong++; }
        await recordAttempt({
          attemptId: `exam:${session.id}:${q.id}`,
          questionId: q.id,
          selected,
          correctAnswer: q.gabarito,
          mode: 'exam',
          sessionId: session.id,
          timestamp: endedAt
        });
      }

      review.push({ questionId: q.id, selected, correctAnswer: q.gabarito });
    }

    const percent = session.questionIds.length ? Math.round((correct / session.questionIds.length) * 1000) / 10 : 0;
    const durationSec = Math.max(0, Math.round((new Date(endedAt) - new Date(session.startedAt)) / 1000));
    const record = await saveExamHistory({
      id: session.id,
      startedAt: session.startedAt,
      endedAt,
      questionIds: session.questionIds,
      answers: { ...session.answers },
      review,
      correct,
      wrong,
      blanks,
      percent,
      byArea,
      durationSec,
      autoFinished: auto
    });
    session.finishedAt = endedAt;
    session.autoFinished = auto;
    await clearActiveSession('exam');
    return record;
  } finally {
    delete session._finishing;
  }
}



/* ===== performance.js ===== */
function computePerformance(questions, attempts, statsMap, favoritesSet = new Set(), examHistory = []) {
  const qMap = new Map(questions.map(q => [q.id, q]));
  const validAttempts = attempts.filter(a => qMap.has(a.questionId));
  const totalAttempts = validAttempts.length;
  const correctAttempts = validAttempts.filter(a => a.correct).length;
  const wrongAttempts = totalAttempts - correctAttempts;
  const answeredIds = new Set(questions.filter(q => statsMap[q.id] && Number(statsMap[q.id].attempts || 0) > 0).map(q => q.id));
  const overallPercent = totalAttempts ? Math.round((correctAttempts / totalAttempts) * 1000) / 10 : 0;

  const byArea = new Map();
  const byTheme = new Map();

  for (const attempt of validAttempts) {
    const q = qMap.get(attempt.questionId);
    const area = displayArea(q.area);
    const areaKey = q.area;
    if (!byArea.has(areaKey)) byArea.set(areaKey, { key: areaKey, label: area, attempts: 0, correct: 0, wrong: 0 });
    const a = byArea.get(areaKey);
    a.attempts++;
    a.correct += attempt.correct ? 1 : 0;
    a.wrong += attempt.correct ? 0 : 1;

    const themeKey = `${q.area}|||${q.tema}`;
    if (!byTheme.has(themeKey)) byTheme.set(themeKey, { area: q.area, areaLabel: area, theme: q.tema, attempts: 0, correct: 0, wrong: 0 });
    const t = byTheme.get(themeKey);
    t.attempts++;
    t.correct += attempt.correct ? 1 : 0;
    t.wrong += attempt.correct ? 0 : 1;
  }

  const finalize = row => ({ ...row, percent: row.attempts ? Math.round((row.correct / row.attempts) * 1000) / 10 : 0 });
  const areaRows = [...byArea.values()].map(finalize).sort((a,b) => b.percent - a.percent || b.attempts - a.attempts);
  const themeRows = [...byTheme.values()].map(finalize).sort((a,b) => a.percent - b.percent || b.attempts - a.attempts);
  const reviewThemes = themeRows.filter(row => row.attempts > 0 && row.percent < 70);

  const todayKey = new Date().toLocaleDateString('pt-BR');
  const todayAnswered = validAttempts.filter(a => new Date(a.timestamp).toLocaleDateString('pt-BR') === todayKey).length;
  const validFavorites = questions.filter(q => favoritesSet.has(q.id)).length;

  return {
    totalQuestions: questions.length,
    completedUnique: answeredIds.size,
    progressPercent: questions.length ? Math.round((answeredIds.size / questions.length) * 1000) / 10 : 0,
    totalAttempts,
    correctAttempts,
    wrongAttempts,
    overallPercent,
    favorites: validFavorites,
    exams: examHistory.length,
    byArea: areaRows,
    byTheme: themeRows,
    reviewThemes,
    bestArea: areaRows[0] || null,
    worstArea: areaRows.length ? [...areaRows].sort((a,b) => a.percent - b.percent || b.attempts - a.attempts)[0] : null,
    todayAnswered
  };
}
