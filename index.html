ma":"MAPA 012 - Concordância verbal","subtema":"Haver impessoal","dificuldade":"intermediaria","enunciado":"Considerando o verbo 'haver' no sentido de existir, assinale a alternativa correta:","alternativas":{"A":"Haviam várias pendências no processo.","B":"Existia várias pendências no processo.","C":"Houveram várias pendências no processo.","D":"Havia várias pendências no processo."},"gabarito":"D","comentario":"No sentido de 'existir', o verbo 'haver' é impessoal e permanece na 3ª pessoa do singular: 'havia'. Já 'existir' é pessoal e, com sujeito plural, seria 'existiam várias pendências'.","referencia":"Concordância do verbo 'haver' impessoal com sentido de existir.","tags":["concordancia_verbal","haver"]},{"id":"POR068","area":"Língua Portuguesa","tema":"MAPA 012 - Concordância verbal","subtema":"Fazer impessoal","dificuldade":"intermediaria","enunciado":"Considerando o verbo 'fazer' na indicação de tempo decorrido, assinale a frase correta:","alternativas":{"A":"Fazem dois ano que o sistema foi implantado.","B":"Fizeram dois anos que o sistema foi implantado.","C":"Faz dois anos que o sistema foi implantado.","D":"Fazem dois anos que o sistema foi implantado."},"gabarito":"C","comentario":"Indicando tempo decorrido, 'fazer' é impessoal e fica na 3ª pessoa do singular: 'faz dois anos'.","referencia":"Concordância do verbo 'fazer' impessoal em indicação de tempo.","tags":["concordancia_verbal","fazer"]},{"id":"POR069","area":"Língua Portuguesa","tema":"MAPA 012 - Concordância verbal","subtema":"Sujeito composto posposto","dificuldade":"intermediaria","enunciado":"Assinale a alternativa de acordo com a norma-padrão:","alternativas":{"A":"Chegou o diretor e os assessores, sendo essa a única forma possível.","B":"Chegaram o diretor e os assessores.","C":"Chegou os diretor e os assessores.","D":"Chegaram o diretor e os assessore."},"gabarito":"B","comentario":"Com sujeito composto, a concordância no plural é plenamente adequada. Quando o sujeito composto vem posposto, também pode ocorrer atração pelo núcleo mais próximo em certos contextos, mas a alternativa apresentada no plural é inequívoca.","referencia":"Concordância verbal com sujeito composto posposto.","tags":["concordancia_verbal","sujeito_composto"]},{"id":"POR070","area":"Língua Portuguesa","tema":"MAPA 012 - Concordância verbal","subtema":"Pronome relativo 'que'","dificuldade":"dificil","enunciado":"Em uma oração relativa introduzida por 'que', assinale a construção com concordância adequada:","alternativas":{"A":"Fui eu que preparaste o relatório.","B":"Fui eu que preparou o relatório.","C":"Fui eu que preparei o relatório.","D":"Fui eu que prepararam o relatório."},"gabarito":"C","comentario":"Quando o sujeito da oração relativa é o pronome 'que', o verbo concorda com o antecedente: 'eu' → 'preparei'.","referencia":"Concordância verbal em oração relativa introduzida por 'que'.","tags":["concordancia_verbal","pronome_relativo"]},{"id":"POR071","area":"Língua Portuguesa","tema":"MAPA 012 - Concordância verbal","subtema":"Partícula 'se' e sujeito paciente","dificuldade":"dificil","enunciado":"Assinale a frase em conformidade com a norma-padrão:","alternativas":{"A":"Publicaram-se o resultado ontem.","B":"Se publicou os resultados ontem, obrigatoriamente no singular.","C":"Publicaram-se os resultados ontem.","D":"Publicou-se os resultados ontem."},"gabarito":"C","comentario":"Em 'publicaram-se os resultados', o 'se' é partícula apassivadora. 'Os resultados' funciona como sujeito paciente plural, por isso o verbo vai ao plural.","referencia":"Concordância verbal na voz passiva sintética com partícula apassivadora.","tags":["concordancia_verbal","particula_se"]},{"id":"POR072","area":"Língua Portuguesa","tema":"MAPA 013 - Regência nominal","subtema":"Adjetivo e preposição","dificuldade":"facil","enunciado":"Assinale a frase de acordo com a regência nominal da norma-padrão:","alternativas":{"A":"O servidor está apto pelo exercício da função.","B":"O servidor está apto ao exercício da função.","C":"O servidor está apto com o exercício da função.","D":"O servidor está apto no exercício da função, obrigatoriamente."},"gabarito":"B","comentario":"O adjetivo 'apto' rege, tradicionalmente, a preposição 'a' quando introduz o complemento: 'apto a/ao exercício'.","referencia":"Regência nominal: complemento de adjetivos, especialmente 'apto a'.","tags":["regencia_nominal","adjetivo"]},{"id":"POR073","area":"Língua Portuguesa","tema":"MAPA 013 - Regência nominal","subtema":"Substantivo e complemento nominal","dificuldade":"intermediaria","enunciado":"Em \"A necessidade de atualização do cadastro foi comunicada aos usuários\", o segmento \"de atualização do cadastro\" completa o sentido de:","alternativas":{"A":"comunicada.","B":"foi.","C":"necessidade.","D":"usuários."},"gabarito":"C","comentario":"O substantivo abstrato 'necessidade' pede um termo que especifique seu conteúdo; 'de atualização do cadastro' funciona como complemento nominal.","referencia":"Complemento nominal ligado a substantivo abstrato.","tags":["regencia_nominal","complemento_nominal"]},{"id":"POR074","area":"Língua Portuguesa","tema":"MAPA 013 - Regência nominal","subtema":"Fiel a","dificuldade":"intermediaria","enunciado":"Assinale a alternativa correta quanto à regência nominal:","alternativas":{"A":"O relatório deve ser fiel aos dados coletados.","B":"O relatório deve ser fiel com os dados coletados.","C":"O relatório deve ser fiel dos dados coletados.","D":"O relatório deve ser fiel pelos dados coletados."},"gabarito":"A","comentario":"O adjetivo 'fiel' rege a preposição 'a': fiel a algo/alguém. Com artigo plural 'os', ocorre a contração 'aos'.","referencia":"Regência nominal do adjetivo 'fiel': fiel a.","tags":["regencia_nominal","preposicao"]},{"id":"POR075","area":"Língua Portuguesa","tema":"MAPA 013 - Regência nominal","subtema":"Compatível com","dificuldade":"facil","enunciado":"Assinale a frase em que a regência nominal está adequada:","alternativas":{"A":"A solução apresentada é compatível das exigências do edital.","B":"A solução apresentada é compatível com as exigências do edital.","C":"A solução apresentada é compatível às exigências do edital.","D":"A solução apresentada é compatível pelas exigências do edital."},"gabarito":"B","comentario":"Na norma-padrão, 'compatível' rege a preposição 'com': compatível com algo.","referencia":"Regência nominal do adjetivo 'compatível': compatível com.","tags":["regencia_nominal","adjetivo"]},{"id":"POR076","area":"Língua Portuguesa","tema":"MAPA 013 - Regência nominal","subtema":"Favorável a","dificuldade":"dificil","enunciado":"Na frase \"A comissão manifestou-se favorável à alteração proposta\", o acento grave ocorre porque:","alternativas":{"A":"a crase é obrigatória antes de todo substantivo feminino, independentemente da regência.","B":"o adjetivo 'favorável' rege a preposição 'a', e 'alteração' admite artigo feminino 'a'.","C":"todo adjetivo terminado em '-vel' exige crase.","D":"o verbo 'manifestar-se' exige sempre crase antes de qualquer complemento."},"gabarito":"B","comentario":"'Favorável' rege a preposição 'a'; diante do artigo feminino que acompanha 'alteração', há fusão a + a = à. A crase depende simultaneamente de regência e presença do artigo.","referencia":"Regência nominal de 'favorável a' e ocorrência de crase pela fusão de preposição e artigo.","tags":["regencia_nominal","crase"]},{"id":"POR077","area":"Língua Portuguesa","tema":"MAPA 014 - Regência verbal","subtema":"Assistir no sentido de ver","dificuldade":"facil","enunciado":"Assinale a frase de acordo com a norma-padrão, considerando \"assistir\" no sentido de ver/presenciar:","alternativas":{"A":"Os servidores assistiram a palestra, sem preposição.","B":"Os servidores assistiram da palestra.","C":"Os servidores assistiram pela palestra.","D":"Os servidores assistiram à palestra."},"gabarito":"D","comentario":"No sentido de ver ou presenciar, 'assistir' é tradicionalmente transitivo indireto e rege a preposição 'a': assistir a algo. Diante de 'a palestra', ocorre crase.","referencia":"Regência verbal de 'assistir' no sentido de ver/presenciar.","tags":["regencia_verbal","assistir"]},{"id":"POR078","area":"Língua Portuguesa","tema":"MAPA 014 - Regência verbal","subtema":"Preferir","dificuldade":"intermediaria","enunciado":"Assinale a construção de acordo com a regência normativa do verbo \"preferir\":","alternativas":{"A":"Prefiro o atendimento digital que o presencial.","B":"Prefiro o atendimento digital ao presencial.","C":"Prefiro antes o atendimento digital do presencial.","D":"Prefiro mais o atendimento digital do que o presencial."},"gabarito":"B","comentario":"Na norma-padrão, 'preferir' estabelece comparação com estrutura 'preferir X a Y', sem necessidade de 'mais' ou 'antes'.","referencia":"Regência verbal do verbo 'preferir': preferir uma coisa a outra.","tags":["regencia_verbal","preferir"]},{"id":"POR079","area":"Língua Portuguesa","tema":"MAPA 014 - Regência verbal","subtema":"Obedecer","dificuldade":"intermediaria","enunciado":"Assinale a frase correta segundo a regência padrão:","alternativas":{"A":"Os procedimentos devem obedecer as normas vigentes, sem preposição.","B":"Os procedimentos devem obedecer das normas vigentes.","C":"Os procedimentos devem obedecer pelas normas vigentes.","D":"Os procedimentos devem obedecer às normas vigentes."},"gabarito":"D","comentario":"'Obedecer' rege a preposição 'a'. Como 'normas' admite artigo feminino plural, ocorre a contração com crase: 'às normas'.","referencia":"Regência verbal de 'obedecer a' e crase.","tags":["regencia_verbal","obedecer"]},{"id":"POR080","area":"Língua Portuguesa","tema":"MAPA 014 - Regência verbal","subtema":"Informar","dificuldade":"intermediaria","enunciado":"Assinale a construção correta:","alternativas":{"A":"A chefia informou os servidores da mudança, construção sempre proibida.","B":"A chefia informou sobre os servidores a mudança.","C":"A chefia informou os servidores sobre a mudança.","D":"A chefia informou aos servidores da mudança como única regência possível."},"gabarito":"C","comentario":"O verbo 'informar' admite mais de uma construção normativa, entre elas 'informar alguém sobre/de algo' e 'informar algo a alguém'. A opção apresentada emprega corretamente 'os servidores' como objeto direto e 'sobre a mudança' como complemento preposicionado.","referencia":"Regência verbal do verbo 'informar' em construções admitidas pela norma-padrão.","tags":["regencia_verbal","informar"]},{"id":"POR081","area":"Língua Portuguesa","tema":"MAPA 014 - Regência verbal","subtema":"Visar","dificuldade":"dificil","enunciado":"Assinale a frase de acordo com a regência tradicional de \"visar\" no sentido de ter como objetivo:","alternativas":{"A":"O projeto visa a melhoria do atendimento, sendo impossível o artigo.","B":"O projeto visa da melhoria do atendimento.","C":"O projeto visa à melhoria do atendimento.","D":"O projeto visa pela melhoria do atendimento."},"gabarito":"C","comentario":"No sentido de ter por objetivo, a tradição normativa registra 'visar a'. Como 'melhoria' vem com artigo feminino, a preposição 'a' se funde ao artigo: 'à melhoria'.","referencia":"Regência verbal de 'visar a' no sentido de almejar/ter como objetivo.","tags":["regencia_verbal","visar"]},{"id":"POR082","area":"Língua Portuguesa","tema":"MAPA 014 - Regência verbal","subtema":"Implicar","dificuldade":"intermediaria","enunciado":"Assinale a frase de acordo com a regência normativa de \"implicar\" no sentido de acarretar:","alternativas":{"A":"A mudança implicará dos novos procedimentos.","B":"A mudança implicará aos novos procedimentos.","C":"A mudança implicará novos procedimentos.","D":"A mudança implicará em novos procedimentos, como única forma normativa."},"gabarito":"C","comentario":"No sentido de acarretar ou trazer como consequência, 'implicar' é tradicionalmente transitivo direto: 'implicar novos procedimentos'.","referencia":"Regência verbal de 'implicar' no sentido de acarretar.","tags":["regencia_verbal","implicar"]},{"id":"POR083","area":"Língua Portuguesa","tema":"MAPA 015 - Pronomes: emprego e formas de tratamento","subtema":"Pronome oblíquo","dificuldade":"facil","enunciado":"Assinale a alternativa em que o pronome foi empregado de acordo com a norma-padrão:","alternativas":{"A":"Entreguei ele o documento ontem.","B":"Entreguei para lhe o documento ontem.","C":"Entreguei-lhe ele ontem, com os dois pronomes para o mesmo complemento.","D":"Entreguei-lhe o documento ontem."},"gabarito":"D","comentario":"'Lhe' pode funcionar como objeto indireto, equivalente a 'a ele/a ela': 'entreguei o documento a ele'. O pronome pessoal reto 'ele' não exerce, na norma-padrão, a função de objeto direto nessa construção.","referencia":"Emprego de pronomes pessoais retos e oblíquos.","tags":["pronomes","pronome_obliquo"]},{"id":"POR084","area":"Língua Portuguesa","tema":"MAPA 015 - Pronomes: emprego e formas de tratamento","subtema":"Eu/mim","dificuldade":"intermediaria","enunciado":"Em uma situação em que o pronome funciona como sujeito de um infinitivo, assinale a frase correta:","alternativas":{"A":"Este relatório é para mim revisar hoje.","B":"Este relatório é para eu revisar hoje.","C":"Este relatório é para mim reviso hoje.","D":"Este relatório é para eu revisá-lo por mim, sendo 'eu' objeto da preposição."},"gabarito":"B","comentario":"Quando o pronome é sujeito de um infinitivo, emprega-se 'eu': 'para eu revisar'. Usa-se 'mim' como complemento, não como sujeito de verbo.","referencia":"Emprego de 'eu' e 'mim' diante de infinitivo.","tags":["pronomes","eu_mim"]},{"id":"POR085","area":"Língua Portuguesa","tema":"MAPA 015 - Pronomes: emprego e formas de tratamento","subtema":"Forma de tratamento","dificuldade":"intermediaria","enunciado":"Ao empregar \"Vossa Senhoria\" como forma de tratamento, a concordância verbal deve ocorrer:","alternativas":{"A":"na terceira pessoa.","B":"na primeira pessoa do plural.","C":"sem qualquer relação com a pessoa gramatical.","D":"na segunda pessoa do singular, obrigatoriamente."},"gabarito":"A","comentario":"Formas de tratamento como 'Vossa Senhoria' referem-se ao interlocutor, mas exigem concordância verbal e pronominal em terceira pessoa: 'Vossa Senhoria poderá...'.","referencia":"Concordância com formas de tratamento.","tags":["pronomes","formas_de_tratamento"]},{"id":"POR086","area":"Língua Portuguesa","tema":"MAPA 015 - Pronomes: emprego e formas de tratamento","subtema":"Pronome relativo","dificuldade":"dificil","enunciado":"Assinale a frase em que o pronome relativo foi empregado adequadamente:","alternativas":{"A":"Este é o regulamento que me referi.","B":"Este é o regulamento ao qual me referi a ele.","C":"Este é o regulamento onde me referi.","D":"Este é o regulamento a que me referi."},"gabarito":"D","comentario":"O verbo 'referir-se' rege a preposição 'a'. Por isso, o pronome relativo deve vir precedido dessa preposição: 'a que me referi'.","referencia":"Emprego de pronome relativo com preposição exigida pela regência.","tags":["pronomes","pronome_relativo"]},{"id":"POR087","area":"Língua Portuguesa","tema":"MAPA 015 - Pronomes: emprego e formas de tratamento","subtema":"Cujo","dificuldade":"dificil","enunciado":"Assinale a frase correta quanto ao emprego de \"cujo\":","alternativas":{"A":"O projeto cujo prazo terminou será reavaliado.","B":"O projeto cujo prazo dele terminou será reavaliado.","C":"O projeto cujo o prazo terminou será reavaliado.","D":"O projeto que cujo prazo terminou será reavaliado."},"gabarito":"A","comentario":"'Cujo' é pronome relativo possessivo, concorda com o termo possuído ('prazo') e não admite artigo entre ele e o substantivo. Também dispensa construções redundantes como 'dele'.","referencia":"Emprego do pronome relativo possessivo 'cujo'.","tags":["pronomes","cujo"]},{"id":"POR088","area":"Língua Portuguesa","tema":"MAPA 016 - Colocação pronominal","subtema":"Próclise por palavra negativa","dificuldade":"facil","enunciado":"Considerando a presença de palavra negativa como fator de atração pronominal, assinale a frase de acordo com a norma-padrão:","alternativas":{"A":"Não avisaram me sobre a mudança.","B":"Não me avisaram-se sobre a mudança.","C":"Não avisaram-me sobre a mudança.","D":"Não me avisaram sobre a mudança."},"gabarito":"D","comentario":"A palavra negativa 'não' atrai o pronome oblíquo átono, favorecendo próclise: 'não me avisaram'.","referencia":"Colocação pronominal: próclise após palavra de sentido negativo.","tags":["colocacao_pronominal","proclise"]},{"id":"POR089","area":"Língua Portuguesa","tema":"MAPA 016 - Colocação pronominal","subtema":"Ênclise no início de oração","dificuldade":"intermediaria","enunciado":"Na escrita formal, assinale a construção tradicionalmente adequada para iniciar uma oração afirmativa, sem elemento atrativo:","alternativas":{"A":"Me envie o relatório até amanhã, como única forma prescrita.","B":"Envie o me relatório até amanhã.","C":"Me o envie o relatório até amanhã.","D":"Envie-me o relatório até amanhã."},"gabarito":"D","comentario":"Na tradição normativa, evita-se iniciar oração com pronome oblíquo átono; sem fator de próclise, a ênclise em 'Envie-me' é a solução formal clássica.","referencia":"Colocação pronominal: ênclise em início de oração na norma-padrão tradicional.","tags":["colocacao_pronominal","enclise"]},{"id":"POR090","area":"Língua Portuguesa","tema":"MAPA 016 - Colocação pronominal","subtema":"Próclise com pronome relativo","dificuldade":"intermediaria","enunciado":"Considerando a próclise desencadeada por pronome relativo, assinale a frase correta:","alternativas":{"A":"Este é o documento que solicitaram-me.","B":"Este é o documento que solicitaram me.","C":"Este é o documento que me solicitaram-no.","D":"Este é o documento que me solicitaram."},"gabarito":"D","comentario":"O pronome relativo 'que' funciona como fator de próclise, atraindo o pronome átono: 'que me solicitaram'.","referencia":"Colocação pronominal: próclise desencadeada por pronome relativo.","tags":["colocacao_pronominal","pronome_relativo"]},{"id":"POR091","area":"Língua Portuguesa","tema":"MAPA 016 - Colocação pronominal","subtema":"Mesóclise","dificuldade":"dificil","enunciado":"Na norma-padrão tradicional, sem fator de próclise, qual forma exemplifica corretamente a mesóclise?","alternativas":{"A":"Enviar-ei-lhe o documento amanhã.","B":"Enviarei-lhe-ei o documento amanhã.","C":"Enviar-lhe-ei o documento amanhã.","D":"Lhe enviarei o documento amanhã, como mesóclise."},"gabarito":"C","comentario":"A mesóclise insere o pronome átono no interior de forma do futuro do presente ou do futuro do pretérito: 'enviar-lhe-ei'.","referencia":"Colocação pronominal: mesóclise com futuro do presente.","tags":["colocacao_pronominal","mesoclise"]},{"id":"POR092","area":"Língua Portuguesa","tema":"MAPA 016 - Colocação pronominal","subtema":"Locução verbal","dificuldade":"dificil","enunciado":"Assinale a construção compatível com a norma-padrão formal:","alternativas":{"A":"Não posso enviar o lhe arquivo hoje.","B":"Não posso enviar-lhe o arquivo hoje, sendo a única posição admitida.","C":"Não lhe posso enviar o arquivo hoje.","D":"Não posso lhe enviar o arquivo, construção obrigatoriamente incorreta em qualquer contexto."},"gabarito":"C","comentario":"O advérbio negativo 'não' atrai o pronome para antes do verbo auxiliar: 'não lhe posso enviar'. Em locuções, há variação possível conforme a estrutura, mas a alternativa escolhida é inequivocamente normativa.","referencia":"Colocação pronominal em locuções verbais e atração por palavra negativa.","tags":["colocacao_pronominal","locucao_verbal"]},{"id":"POR093","area":"Língua Portuguesa","tema":"MAPA 017 - Estrutura das palavras","subtema":"Radical","dificuldade":"facil","enunciado":"Nas palavras \"pedra\", \"pedreiro\" e \"pedregulho\", o elemento comum relacionado ao núcleo de significação é chamado de:","alternativas":{"A":"desinência.","B":"radical.","C":"prefixo.","D":"vogal temática."},"gabarito":"B","comentario":"O radical concentra a base lexical comum a palavras da mesma família; em 'pedra/pedreiro/pedregulho', há um núcleo mórfico compartilhado.","referencia":"Morfologia: radical como morfema lexical.","tags":["morfologia","radical"]},{"id":"POR094","area":"Língua Portuguesa","tema":"MAPA 017 - Estrutura das palavras","subtema":"Prefixo e sufixo","dificuldade":"intermediaria","enunciado":"Na palavra \"infelizmente\", é correto identificar:","alternativas":{"A":"o prefixo 'in-' e o sufixo '-mente'.","B":"o prefixo '-mente' e o sufixo 'in-'.","C":"ausência de qualquer afixo.","D":"apenas uma desinência verbal."},"gabarito":"A","comentario":"'In-' é prefixo de valor negativo ligado à base, enquanto '-mente' é sufixo formador de advérbios a partir de adjetivos.","referencia":"Estrutura mórfica: prefixos e sufixos.","tags":["morfologia","afixos"]},{"id":"POR095","area":"Língua Portuguesa","tema":"MAPA 017 - Estrutura das palavras","subtema":"Desinência verbal","dificuldade":"intermediaria","enunciado":"Na forma verbal \"falávamos\", o segmento final \"-mos\" indica principalmente:","alternativas":{"A":"primeira pessoa do plural.","B":"grau aumentativo.","C":"prefixação negativa.","D":"gênero feminino."},"gabarito":"A","comentario":"Em formas verbais, a desinência número-pessoal identifica pessoa e número. Em 'falávamos', '-mos' marca a primeira pessoa do plural.","referencia":"Morfologia verbal: desinência número-pessoal.","tags":["morfologia","desinencia"]},{"id":"POR096","area":"Língua Portuguesa","tema":"MAPA 017 - Estrutura das palavras","subtema":"Morfemas e informação gramatical","dificuldade":"intermediaria","enunciado":"Na oposição \"aluno/alunos\", o elemento \"-s\" em \"alunos\" é classificado como:","alternativas":{"A":"prefixo derivacional.","B":"desinência nominal de número.","C":"radical.","D":"vogal temática verbal."},"gabarito":"B","comentario":"O '-s' marca a flexão de número no nome, funcionando como desinência nominal de plural; não altera o significado lexical básico da palavra.","referencia":"Morfologia: desinências nominais de gênero e número.","tags":["morfologia","morfemas"]},{"id":"POR097","area":"Língua Portuguesa","tema":"MAPA 018 - Formação de palavras","subtema":"Derivação prefixal","dificuldade":"facil","enunciado":"A palavra \"reler\" é formada por:","alternativas":{"A":"derivação regressiva.","B":"composição por aglutinação.","C":"composição por justaposição.","D":"derivação prefixal."},"gabarito":"D","comentario":"'Reler' forma-se pela adição do prefixo 're-' ao verbo 'ler', sem combinação de dois radicais.","referencia":"Processos de formação de palavras: derivação prefixal.","tags":["formacao_palavras","derivacao"]},{"id":"POR098","area":"Língua Portuguesa","tema":"MAPA 018 - Formação de palavras","subtema":"Derivação sufixal","dificuldade":"intermediaria","enunciado":"A palavra \"felizmente\" resulta de:","alternativas":{"A":"derivação sufixal.","B":"derivação regressiva.","C":"composição por aglutinação.","D":"abreviação."},"gabarito":"A","comentario":"O sufixo '-mente' é acrescentado ao adjetivo 'feliz' para formar um advérbio; trata-se de derivação sufixal.","referencia":"Processos de formação de palavras: derivação sufixal.","tags":["formacao_palavras","sufixacao"]},{"id":"POR099","area":"Língua Portuguesa","tema":"MAPA 018 - Formação de palavras","subtema":"Composição por justaposição","dificuldade":"intermediaria","enunciado":"Qual palavra exemplifica composição por justaposição?","alternativas":{"A":"refazer.","B":"felizmente.","C":"guarda-chuva.","D":"infeliz."},"gabarito":"C","comentario":"'Guarda-chuva' reúne dois elementos lexicais mantendo, de modo reconhecível, suas formas, o que caracteriza composição por justaposição.","referencia":"Formação de palavras: composição por justaposição.","tags":["formacao_palavras","composicao"]},{"id":"POR100","area":"Língua Portuguesa","tema":"MAPA 018 - Formação de palavras","subtema":"Derivação parassintética","dificuldade":"dificil","enunciado":"A palavra \"entristecer\", na análise tradicional, exemplifica:","alternativas":{"A":"composição por aglutinação de dois substantivos.","B":"derivação regressiva de um verbo.","C":"derivação parassintética, com acréscimo simultâneo de prefixo e sufixo à base.","D":"simples flexão verbal sem processo derivacional."},"gabarito":"C","comentario":"Na formação de 'entristecer' a partir de 'triste', prefixo e sufixo participam conjuntamente da criação do novo verbo; não se obtêm, com o mesmo valor, formas intermediárias autônomas pela retirada isolada de um deles.","referencia":"Formação de palavras: derivação parassintética.","tags":["formacao_palavras","parassintese"]},{"id":"POR101","area":"Língua Portuguesa","tema":"MAPA 019 - Classes de palavras e suas funções","subtema":"Substantivo","dificuldade":"facil","enunciado":"Na frase \"A rapidez do atendimento surpreendeu os usuários\", a palavra \"rapidez\" é classificada como:","alternativas":{"A":"advérbio.","B":"substantivo abstrato.","C":"pronome.","D":"adjetivo."},"gabarito":"B","comentario":"'Rapidez' nomeia uma qualidade tomada como entidade, por isso é substantivo abstrato.","referencia":"Classes de palavras: substantivo abstrato.","tags":["classes_palavras","substantivo"]},{"id":"POR102","area":"Língua Portuguesa","tema":"MAPA 019 - Classes de palavras e suas funções","subtema":"Adjetivo e função sintática","dificuldade":"intermediaria","enunciado":"Em \"O atendimento permaneceu eficiente\", a palavra \"eficiente\" é:","alternativas":{"A":"advérbio de modo.","B":"substantivo com função de objeto direto.","C":"adjetivo com função de predicativo do sujeito.","D":"pronome indefinido."},"gabarito":"C","comentario":"'Eficiente' caracteriza o sujeito 'o atendimento' por intermédio do verbo de ligação 'permaneceu'; é adjetivo em função de predicativo.","referencia":"Classes de palavras e função sintática do adjetivo.","tags":["classes_palavras","adjetivo"]},{"id":"POR103","area":"Língua Portuguesa","tema":"MAPA 019 - Classes de palavras e suas funções","subtema":"Advérbio","dificuldade":"intermediaria","enunciado":"Na frase \"A equipe respondeu rapidamente ao pedido\", a palavra \"rapidamente\" modifica:","alternativas":{"A":"o artigo 'A', indicando intensidade.","B":"o verbo 'respondeu', indicando modo.","C":"o substantivo 'pedido', indicando número.","D":"o substantivo 'equipe', indicando gênero."},"gabarito":"B","comentario":"Advérbios podem modificar verbos, adjetivos ou outros advérbios. Aqui, 'rapidamente' indica o modo como a equipe respondeu.","referencia":"Classes de palavras: advérbio e valor circunstancial.","tags":["classes_palavras","adverbio"]},{"id":"POR104","area":"Língua Portuguesa","tema":"MAPA 019 - Classes de palavras e suas funções","subtema":"Preposição","dificuldade":"intermediaria","enunciado":"Em \"O relatório foi elaborado com cuidado\", a palavra \"com\" é:","alternativas":{"A":"pronome relativo.","B":"interjeição.","C":"conjunção conclusiva.","D":"preposição que introduz expressão de valor modal."},"gabarito":"D","comentario":"'Com' é preposição e liga o nome/oração ao termo 'cuidado'; no contexto, o sintagma 'com cuidado' expressa modo.","referencia":"Classes de palavras: preposição e relação semântica.","tags":["classes_palavras","preposicao"]},{"id":"POR105","area":"Língua Portuguesa","tema":"MAPA 019 - Classes de palavras e suas funções","subtema":"Conjunção","dificuldade":"dificil","enunciado":"Em \"Ele não compareceu porque estava doente\", a palavra \"porque\" é classificada, no contexto, como:","alternativas":{"A":"conjunção subordinativa causal.","B":"advérbio de intensidade.","C":"pronome interrogativo.","D":"preposição essencial."},"gabarito":"A","comentario":"'Porque' introduz a causa da ausência e conecta uma oração subordinada adverbial causal à principal.","referencia":"Classes de palavras: conjunção subordinativa causal.","tags":["classes_palavras","conjuncao"]},{"id":"POR106","area":"Língua Portuguesa","tema":"MAPA 019 - Classes de palavras e suas funções","subtema":"Palavra de classe variável conforme o contexto","dificuldade":"dificil","enunciado":"Compare:\nI. \"Havia bastante trabalho.\"\nII. \"Os servidores estavam bastante cansados.\"\nEm I e II, \"bastante\" é, respectivamente:","alternativas":{"A":"preposição e conjunção.","B":"pronome/adjetivo indefinido e advérbio de intensidade.","C":"substantivo e adjetivo.","D":"advérbio e substantivo."},"gabarito":"B","comentario":"Em I, 'bastante' determina o substantivo 'trabalho' com valor quantitativo. Em II, intensifica o adjetivo 'cansados' e funciona como advérbio, portanto invariável.","referencia":"Classes de palavras determinadas pelo contexto: 'bastante'.","tags":["classes_palavras","classe_contextual"]},{"id":"POR107","area":"Língua Portuguesa","tema":"MAPA 020 - Flexão nominal e verbal","subtema":"Flexão de número","dificuldade":"facil","enunciado":"Assinale o plural correto de \"cidadão\":","alternativas":{"A":"cidadães.","B":"cidadãos.","C":"cidadões.","D":"cidadãoses."},"gabarito":"B","comentario":"O plural consagrado de 'cidadão' é 'cidadãos'.","referencia":"Flexão nominal de número: plural de substantivos terminados em -ão.","tags":["flexao","numero"]},{"id":"POR108","area":"Língua Portuguesa","tema":"MAPA 020 - Flexão nominal e verbal","subtema":"Flexão de gênero","dificuldade":"intermediaria","enunciado":"Em relação à flexão de gênero, assinale a alternativa correta:","alternativas":{"A":"Em 'o estudante/a estudante', o gênero é indicado pelo determinante, mantendo-se a forma do substantivo.","B":"'Estudante' não admite referência a pessoas de gêneros diferentes.","C":"'Estudante' possui obrigatoriamente a forma feminina 'estudanta'.","D":"O artigo nunca participa da marcação de gênero em português."},"gabarito":"A","comentario":"'Estudante' é substantivo comum de dois gêneros: a distinção pode ser feita pelo artigo ou outro determinante, sem alteração da forma lexical.","referencia":"Flexão nominal de gênero: substantivos comuns de dois gêneros.","tags":["flexao","genero"]},{"id":"POR109","area":"Língua Portuguesa","tema":"MAPA 020 - Flexão nominal e verbal","subtema":"Flexão verbal de pessoa e número","dificuldade":"intermediaria","enunciado":"Na forma \"faremos\", as marcas flexionais indicam:","alternativas":{"A":"primeira pessoa do singular no futuro do pretérito.","B":"primeira pessoa do plural no futuro do presente do indicativo.","C":"terceira pessoa do plural no presente do subjuntivo.","D":"segunda pessoa do singular no pretérito perfeito."},"gabarito":"B","comentario":"'Faremos' pertence ao futuro do presente do indicativo e está na primeira pessoa do plural.","referencia":"Flexão verbal: tempo, modo, pessoa e número.","tags":["flexao","verbal"]},{"id":"POR110","area":"Língua Portuguesa","tema":"MAPA 020 - Flexão nominal e verbal","subtema":"Verbo irregular","dificuldade":"facil","enunciado":"Assinale a forma adequada do verbo \"intervir\" no pretérito perfeito do indicativo, terceira pessoa do singular:","alternativas":{"A":"intervinha.","B":"interveio.","C":"interveu.","D":"interviu."},"gabarito":"B","comentario":"'Intervir' segue, em sua conjugação, o paradigma de 'vir': ele veio → ele interveio. 'Intervinha' é pretérito imperfeito.","referencia":"Flexão de verbos irregulares derivados de 'vir'.","tags":["flexao","verbo_irregular"]},{"id":"POR111","area":"Língua Portuguesa","tema":"MAPA 021 - Ortografia oficial","subtema":"Emprego de S/SS/Ç","dificuldade":"facil","enunciado":"Assinale a palavra grafada corretamente:","alternativas":{"A":"exceção.","B":"excesssão.","C":"excessão.","D":"esceção."},"gabarito":"A","comentario":"A grafia oficial é 'exceção', com 'xc' no início e 'ç' na sílaba final.","referencia":"Ortografia oficial da língua portuguesa.","tags":["ortografia","grafia"]},{"id":"POR112","area":"Língua Portuguesa","tema":"MAPA 021 - Ortografia oficial","subtema":"Uso de X e CH","dificuldade":"intermediaria","enunciado":"Assinale a alternativa em que todas as palavras estão grafadas corretamente:","alternativas":{"A":"enchergar – mecher – enchame.","B":"enchergar – mexer – enxame.","C":"enxergar – mexer – enxame.","D":"enxergar – mecher – enxame."},"gabarito":"C","comentario":"As grafias oficiais são 'enxergar', 'mexer' e 'enxame'. O som /ʃ/ pode ser representado por 'x' ou 'ch' conforme a palavra, não havendo regra fonética única que dispense o conhecimento ortográfico.","referencia":"Ortografia oficial: emprego de X e CH.","tags":["ortografia","x_ch"]},{"id":"POR113","area":"Língua Portuguesa","tema":"MAPA 021 - Ortografia oficial","subtema":"Por que/porque/por quê/porquê","dificuldade":"intermediaria","enunciado":"Assinale a frase grafada corretamente:","alternativas":{"A":"Não sei o por que o sistema falhou.","B":"Não sei por quê o sistema falhou.","C":"Não sei por que o sistema falhou.","D":"Não sei porque o sistema falhou, quando o sentido é 'por qual razão'."},"gabarito":"C","comentario":"Em pergunta indireta com sentido de 'por qual razão', usa-se 'por que' separado. 'Por quê' ocorre normalmente antes de pausa; 'porquê' é substantivo; 'porque' costuma introduzir explicação/causa.","referencia":"Ortografia: emprego de por que, porque, por quê e porquê.","tags":["ortografia","porques"]},{"id":"POR114","area":"Língua Portuguesa","tema":"MAPA 021 - Ortografia oficial","subtema":"Hífen com prefixos","dificuldade":"intermediaria","enunciado":"Segundo o Acordo Ortográfico, assinale a grafia correta:","alternativas":{"A":"micro-ondas.","B":"micro ondas.","C":"microondas.","D":"micro--ondas."},"gabarito":"A","comentario":"Quando o prefixo termina com a mesma vogal que inicia o segundo elemento, emprega-se hífen: micro-ondas.","referencia":"Acordo Ortográfico da Língua Portuguesa: emprego do hífen com prefixos.","tags":["ortografia","hifen"]},{"id":"POR115","area":"Língua Portuguesa","tema":"MAPA 021 - Ortografia oficial","subtema":"Hífen e prefixo terminado em vogal","dificuldade":"dificil","enunciado":"Assinale a grafia correta segundo o Acordo Ortográfico:","alternativas":{"A":"auto escola.","B":"autoescola.","C":"auto--escola.","D":"auto-escola."},"gabarito":"B","comentario":"Com prefixo terminado em vogal e segundo elemento iniciado por vogal diferente, em regra não se usa hífen: 'autoescola'.","referencia":"Acordo Ortográfico da Língua Portuguesa: regras gerais de hifenização.","tags":["ortografia","acordo_ortografico"]},{"id":"POR116","area":"Língua Portuguesa","tema":"MAPA 022 - Acentuação gráfica","subtema":"Oxítona","dificuldade":"facil","enunciado":"Assinale a palavra corretamente acentuada:","alternativas":{"A":"cafê.","B":"café.","C":"cafe.","D":"cáfe."},"gabarito":"B","comentario":"'Café' é oxítona terminada em 'e', grupo que recebe acento gráfico segundo as regras gerais de acentuação.","referencia":"Regras de acentuação das oxítonas.","tags":["acentuacao","oxitona"]},{"id":"POR117","area":"Língua Portuguesa","tema":"MAPA 022 - Acentuação gráfica","subtema":"Proparoxítona","dificuldade":"intermediaria","enunciado":"A palavra \"lâmpada\" é acentuada porque:","alternativas":{"A":"possui encontro consonantal.","B":"é oxítona terminada em 'a'.","C":"é proparoxítona, e todas as proparoxítonas são acentuadas.","D":"todo substantivo trissílabo recebe acento."},"gabarito":"C","comentario":"A sílaba tônica de 'lâmpada' é a antepenúltima. Pela regra geral, todas as proparoxítonas recebem acento gráfico.","referencia":"Regra geral de acentuação das proparoxítonas.","tags":["acentuacao","proparoxitona"]},{"id":"POR118","area":"Língua Portuguesa","tema":"MAPA 022 - Acentuação gráfica","subtema":"Hiato","dificuldade":"intermediaria","enunciado":"Assinale a explicação correta para o acento em \"saída\":","alternativas":{"A":"a palavra é proparoxítona.","B":"o acento marca obrigatoriamente nasalização.","C":"toda palavra terminada em 'a' recebe acento.","D":"o 'i' tônico forma hiato e, nesse contexto, recebe acento."},"gabarito":"D","comentario":"Em 'saída', o 'i' é tônico e forma hiato com a vogal anterior, enquadrando-se na regra de acentuação de 'i/u' tônicos em hiato, observadas as condições da regra.","referencia":"Regras de acentuação do 'i' e 'u' tônicos em hiato.","tags":["acentuacao","hiato"]},{"id":"POR119","area":"Língua Portuguesa","tema":"MAPA 022 - Acentuação gráfica","subtema":"Acordo Ortográfico e ditongos abertos","dificuldade":"intermediaria","enunciado":"Assinale a alternativa corretamente grafada segundo o Acordo Ortográfico:","alternativas":{"A":"idéia.","B":"idêia.","C":"idéiaa.","D":"ideia."},"gabarito":"D","comentario":"Palavras paroxítonas com ditongos abertos 'éi' e 'ói' deixaram de receber acento com o Acordo Ortográfico: 'ideia', 'assembleia', 'jiboia'.","referencia":"Acordo Ortográfico da Língua Portuguesa: acentuação de ditongos abertos em paroxítonas.","tags":["acentuacao","acordo_ortografico"]},{"id":"POR120","area":"Língua Portuguesa","tema":"MAPA 022 - Acentuação gráfica","subtema":"Acento diferencial","dificuldade":"dificil","enunciado":"Assinale a frase em que o acento diferencial foi empregado corretamente:","alternativas":{"A":"Ontem ele não pôde comparecer, mas hoje pode participar.","B":"Ontem ele não pôde comparecer, mas hoje pôde participar, se a segunda ação é presente.","C":"Ontem ele não pode comparecer, mas hoje pode participar, pois nunca há acento diferencial.","D":"Ontem ele não pode comparecer, mas hoje pôde participar, mantendo os tempos indicados."},"gabarito":"A","comentario":"'Pôde' é a forma do pretérito perfeito de 'poder'; 'pode' é presente do indicativo. O acento diferencial permanece para distinguir essas formas.","referencia":"Acordo Ortográfico: acento diferencial em pôde/pode.","tags":["acentuacao","acento_diferencial"]}],"informatica":[{"id":"INF001","area":"Noções de Informática","mapa":"MAPA 062 - Hardware: conceitos e componentes computacionais","tema":"Hardware: conceitos e componentes computacionais","subtema":"CPU e processamento","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, em um computador, o componente responsável por executar instruções de programas e coordenar operações lógicas e aritméticas é:","alternativas":{"A":"processador (CPU)","B":"memória RAM","C":"SSD","D":"fonte de alimentação"},"gabarito":"A","comentario":"Gabarito: A. A CPU interpreta e executa instruções, realiza operações lógicas e aritméticas e coordena o processamento. RAM mantém dados temporários; SSD armazena dados de forma não volátil; a fonte fornece energia. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'memória RAM' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'SSD' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'fonte de alimentação' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Arquitetura de computadores — CPU e processamento","tags":["informatica","mapa_062","cpu_e_processamento"]},{"id":"INF002","area":"Noções de Informática","mapa":"MAPA 062 - Hardware: conceitos e componentes computacionais","tema":"Hardware: conceitos e componentes computacionais","subtema":"Placa-mãe","dificuldade":"dificil","enunciado":"Considerando boas práticas e o funcionamento usual das tecnologias citadas, Ao montar um computador, um técnico precisa conectar processador, memória RAM, unidades de armazenamento e placas de expansão. O componente que interliga fisicamente esses elementos é a:","alternativas":{"A":"fonte de alimentação","B":"unidade de armazenamento","C":"placa de vídeo dedicada","D":"placa-mãe"},"gabarito":"D","comentario":"Gabarito: D. A placa-mãe fornece soquetes, slots, barramentos e interfaces que interligam os componentes. Fonte alimenta; armazenamento guarda dados; placa de vídeo processa gráficos. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'fonte de alimentação' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'unidade de armazenamento' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'placa de vídeo dedicada' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Arquitetura de computadores — placa-mãe e barramentos","tags":["informatica","mapa_062","placa_mae"]},{"id":"INF003","area":"Noções de Informática","mapa":"MAPA 062 - Hardware: conceitos e componentes computacionais","tema":"Hardware: conceitos e componentes computacionais","subtema":"GPU integrada e dedicada","dificuldade":"facil","enunciado":"Um usuário trabalha com aplicações gráficas e deseja melhorar o desempenho de renderização sem trocar o processador. A medida mais diretamente relacionada a essa demanda é instalar ou utilizar uma:","alternativas":{"A":"memória ROM maior","B":"fonte com maior potência como único fator","C":"unidade óptica mais rápida","D":"placa gráfica (GPU) mais adequada"},"gabarito":"D","comentario":"Gabarito: D. A GPU é especializada em processamento gráfico. A potência da fonte pode ser requisito elétrico, mas não aumenta por si só a capacidade de renderização. ROM e unidade óptica não cumprem essa função. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'memória ROM maior' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'fonte com maior potência como único fator' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'unidade óptica mais rápida' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Hardware — processamento gráfico","tags":["informatica","mapa_062","gpu_integrada_e_dedicada"]},{"id":"INF004","area":"Noções de Informática","mapa":"MAPA 062 - Hardware: conceitos e componentes computacionais","tema":"Hardware: conceitos e componentes computacionais","subtema":"Fonte de alimentação","dificuldade":"facil","enunciado":"Em um desktop, a função primária da fonte de alimentação é:","alternativas":{"A":"armazenar temporariamente os dados em uso","B":"interpretar comandos do sistema operacional","C":"converter e fornecer energia elétrica adequada aos componentes internos","D":"realizar o backup automático dos arquivos"},"gabarito":"C","comentario":"Gabarito: C. A fonte converte a energia da rede para tensões utilizadas pelos componentes. Não executa instruções, não substitui RAM e não é mecanismo de backup. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'armazenar temporariamente os dados em uso' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'interpretar comandos do sistema operacional' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'realizar o backup automático dos arquivos' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Hardware — fonte de alimentação","tags":["informatica","mapa_062","fonte_de_alimentacao"]},{"id":"INF005","area":"Noções de Informática","mapa":"MAPA 062 - Hardware: conceitos e componentes computacionais","tema":"Hardware: conceitos e componentes computacionais","subtema":"Barramentos e interfaces","dificuldade":"dificil","enunciado":"Analise a situação a seguir com atenção aos conceitos técnicos envolvidos. Quando dados trafegam entre processador, memória e outros componentes por vias de comunicação da placa-mãe, está-se tratando, em termos gerais, de:","alternativas":{"A":"barramentos e interfaces de comunicação","B":"sistemas de arquivos","C":"protocolos de correio eletrônico","D":"extensões de arquivos"},"gabarito":"A","comentario":"Gabarito: A. Barramentos e interfaces permitem comunicação entre componentes de hardware. Sistemas de arquivos organizam dados em armazenamento; protocolos de e-mail atuam em redes; extensões identificam formatos. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'sistemas de arquivos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'protocolos de correio eletrônico' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'extensões de arquivos' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Arquitetura de computadores — barramentos","tags":["informatica","mapa_062","barramentos_e_interfaces"]},{"id":"INF006","area":"Noções de Informática","mapa":"MAPA 063 - Dispositivos de armazenamento e memórias","tema":"Dispositivos de armazenamento e memórias","subtema":"RAM","dificuldade":"intermediaria","enunciado":"Durante a execução de uma tarefa administrativa, ao abrir vários programas ao mesmo tempo, o computador usa intensamente uma memória volátil de acesso rápido para manter dados e instruções em uso. Trata-se da:","alternativas":{"A":"memória ROM","B":"unidade SSD","C":"memória RAM","D":"memória flash de um pendrive"},"gabarito":"C","comentario":"Gabarito: C. A RAM é volátil e usada como memória de trabalho. ROM e armazenamento flash/SSD são não voláteis. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'memória ROM' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'unidade SSD' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'memória flash de um pendrive' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Memórias de computador — RAM","tags":["informatica","mapa_063","ram"]},{"id":"INF007","area":"Noções de Informática","mapa":"MAPA 063 - Dispositivos de armazenamento e memórias","tema":"Dispositivos de armazenamento e memórias","subtema":"SSD e HDD","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessárias. para reduzir o tempo de inicialização do sistema e de abertura de aplicativos, a troca de um HDD por um SSD tende a ajudar principalmente porque o SSD:","alternativas":{"A":"transforma memória RAM em armazenamento permanente","B":"não possui partes mecânicas móveis e oferece menor latência de acesso","C":"elimina a necessidade de processador","D":"usa exclusivamente discos magnéticos de alta rotação"},"gabarito":"B","comentario":"Gabarito: B. SSDs usam memória flash e não têm partes mecânicas, oferecendo menor latência que HDDs. Não substituem CPU ou RAM e não usam discos magnéticos. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'transforma memória RAM em armazenamento permanente' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'elimina a necessidade de processador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'usa exclusivamente discos magnéticos de alta rotação' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Armazenamento — SSD e HDD","tags":["informatica","mapa_063","ssd_e_hdd"]},{"id":"INF008","area":"Noções de Informática","mapa":"MAPA 063 - Dispositivos de armazenamento e memórias","tema":"Dispositivos de armazenamento e memórias","subtema":"ROM","dificuldade":"dificil","enunciado":"Para resolver corretamente a situação sem assumir funcionalidades inexistentes, Uma característica típica da memória ROM, em comparação com a RAM, é:","alternativas":{"A":"manter seu conteúdo sem depender de alimentação elétrica","B":"ser sempre maior e mais rápida que a RAM","C":"ser usada como área principal para edição temporária de documentos","D":"perder seu conteúdo quando o computador é desligado"},"gabarito":"A","comentario":"Gabarito: A. ROM é memória não volátil. RAM é volátil e usada como memória de trabalho. Tamanho e velocidade dependem da tecnologia e não justificam as alternativas incorretas. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'ser sempre maior e mais rápida que a RAM' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'ser usada como área principal para edição temporária de documentos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'perder seu conteúdo quando o computador é desligado' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Memórias — ROM e não volatilidade","tags":["informatica","mapa_063","rom"]},{"id":"INF009","area":"Noções de Informática","mapa":"MAPA 063 - Dispositivos de armazenamento e memórias","tema":"Dispositivos de armazenamento e memórias","subtema":"Cache","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, o objetivo da memória cache próxima ao processador é, em termos gerais:","alternativas":{"A":"substituir permanentemente o armazenamento em SSD","B":"guardar arquivos do usuário por anos","C":"reduzir o tempo de acesso a dados e instruções usados com frequência","D":"funcionar como dispositivo externo de backup"},"gabarito":"C","comentario":"Gabarito: C. Cache é pequena e rápida, reduzindo acessos mais lentos à memória principal. Não é armazenamento permanente nem backup. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'substituir permanentemente o armazenamento em SSD' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'guardar arquivos do usuário por anos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'funcionar como dispositivo externo de backup' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Arquitetura de memória — cache","tags":["informatica","mapa_063","cache"]},{"id":"INF010","area":"Noções de Informática","mapa":"MAPA 063 - Dispositivos de armazenamento e memórias","tema":"Dispositivos de armazenamento e memórias","subtema":"Capacidade","dificuldade":"dificil","enunciado":"Considerando boas práticas e o funcionamento usual das tecnologias citadas, Um arquivo de 2 GB ocupa aproximadamente quatro vezes o espaço de um arquivo de 512 MB, considerando a relação binária usual de 1 GB = 1024 MB. Essa afirmação é:","alternativas":{"A":"incorreta, porque 2 GB equivalem a 1024 MB","B":"incorreta, porque 512 MB equivalem a 2 GB","C":"incorreta, porque GB mede velocidade e MB mede capacidade","D":"correta"},"gabarito":"D","comentario":"Gabarito: D. 2 GB correspondem a 2048 MB; 2048/512 = 4. GB e MB são unidades de capacidade de armazenamento, não de velocidade. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'incorreta, porque 2 GB equivalem a 1024 MB' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'incorreta, porque 512 MB equivalem a 2 GB' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'incorreta, porque GB mede velocidade e MB mede capacidade' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Unidades de armazenamento — bytes, MB e GB","tags":["informatica","mapa_063","capacidade"]},{"id":"INF011","area":"Noções de Informática","mapa":"MAPA 064 - Periféricos de entrada, saída e entrada/saída","tema":"Periféricos de entrada, saída e entrada/saída","subtema":"Entrada","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessárias. qual dispositivo é classificado principalmente como periférico de entrada?","alternativas":{"A":"monitor","B":"caixa de som","C":"scanner","D":"projetor"},"gabarito":"C","comentario":"Gabarito: C. Scanner captura informação para o computador. Monitor, caixa de som e projetor apresentam informação ao usuário. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'monitor' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'caixa de som' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'projetor' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Periféricos — dispositivos de entrada","tags":["informatica","mapa_064","entrada"]},{"id":"INF012","area":"Noções de Informática","mapa":"MAPA 064 - Periféricos de entrada, saída e entrada/saída","tema":"Periféricos de entrada, saída e entrada/saída","subtema":"Saída","dificuldade":"intermediaria","enunciado":"Em um ambiente de trabalho com procedimentos usuais de informática, durante uma apresentação, a imagem do computador é exibida em uma parede. O periférico utilizado exerce função principal de:","alternativas":{"A":"entrada","B":"saída","C":"armazenamento","D":"processamento central"},"gabarito":"B","comentario":"Gabarito: B. Projetores enviam informação visual do computador ao ambiente, portanto são periféricos de saída. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'entrada' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'armazenamento' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'processamento central' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Periféricos — dispositivos de saída","tags":["informatica","mapa_064","saida"]},{"id":"INF013","area":"Noções de Informática","mapa":"MAPA 064 - Periféricos de entrada, saída e entrada/saída","tema":"Periféricos de entrada, saída e entrada/saída","subtema":"Entrada e saída","dificuldade":"dificil","enunciado":"Analise a situação a seguir com atenção aos conceitos técnicos envolvidos. Uma tela sensível ao toque pode ser classificada como dispositivo de entrada e saída porque:","alternativas":{"A":"armazena permanentemente o sistema operacional","B":"exibe informações e também recebe comandos por toque","C":"substitui a memória RAM","D":"funciona apenas como dispositivo de impressão"},"gabarito":"B","comentario":"Gabarito: B. A tela mostra conteúdo e recebe interação tátil. Isso caracteriza entrada e saída. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'armazena permanentemente o sistema operacional' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'substitui a memória RAM' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'funciona apenas como dispositivo de impressão' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Periféricos — touchscreen","tags":["informatica","mapa_064","entrada_e_saida"]},{"id":"INF014","area":"Noções de Informática","mapa":"MAPA 064 - Periféricos de entrada, saída e entrada/saída","tema":"Periféricos de entrada, saída e entrada/saída","subtema":"Impressora multifuncional","dificuldade":"facil","enunciado":"Uma impressora multifuncional com scanner combina, entre outras, as funções de:","alternativas":{"A":"entrada pela impressão e saída pela digitalização","B":"saída pela impressão e entrada pela digitalização","C":"processamento pela impressão e memória pela digitalização","D":"armazenamento permanente em ambas as funções"},"gabarito":"B","comentario":"Gabarito: B. Imprimir é saída; digitalizar é entrada. As demais combinações confundem papéis de hardware. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'entrada pela impressão e saída pela digitalização' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'processamento pela impressão e memória pela digitalização' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'armazenamento permanente em ambas as funções' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Periféricos — multifuncional","tags":["informatica","mapa_064","impressora_multifuncional"]},{"id":"INF015","area":"Noções de Informática","mapa":"MAPA 064 - Periféricos de entrada, saída e entrada/saída","tema":"Periféricos de entrada, saída e entrada/saída","subtema":"Microfone e webcam","dificuldade":"dificil","enunciado":"Em um cenário em que é necessário distinguir conceitos próximos, Em uma videoconferência, microfone e webcam atuam principalmente como dispositivos de:","alternativas":{"A":"saída","B":"armazenamento","C":"entrada","D":"backup"},"gabarito":"C","comentario":"Gabarito: C. Ambos capturam áudio ou vídeo e enviam dados ao computador, logo são periféricos de entrada. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'saída' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'armazenamento' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'backup' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Periféricos — áudio e vídeo","tags":["informatica","mapa_064","microfone_e_webcam"]},{"id":"INF016","area":"Noções de Informática","mapa":"MAPA 065 - Arquivos, formatos e extensões","tema":"Arquivos, formatos e extensões","subtema":"Extensão","dificuldade":"dificil","enunciado":"Para resolver corretamente a situação sem assumir funcionalidades inexistentes, No nome relatório.pdf, a parte '.pdf' indica principalmente:","alternativas":{"A":"a extensão associada ao formato do arquivo","B":"o endereço de rede do arquivo","C":"a pasta obrigatória de armazenamento","D":"a senha de abertura"},"gabarito":"A","comentario":"Gabarito: A. A extensão auxilia o sistema a associar o arquivo a um formato e a programas capazes de manipulá-lo. Ela não define pasta, senha ou endereço de rede. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'o endereço de rede do arquivo' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'a pasta obrigatória de armazenamento' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'a senha de abertura' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Arquivos — extensões e formatos","tags":["informatica","mapa_065","extensao"]},{"id":"INF017","area":"Noções de Informática","mapa":"MAPA 065 - Arquivos, formatos e extensões","tema":"Arquivos, formatos e extensões","subtema":"PDF","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, ao distribuir um documento preservando, em geral, a apresentação visual entre diferentes sistemas, um formato comumente usado é:","alternativas":{"A":"TXT como formato de planilha","B":"EXE como formato de imagem","C":"MP3 como formato de documento paginado","D":"PDF"},"gabarito":"D","comentario":"Gabarito: D. PDF é amplamente usado para documentos com layout preservado. TXT é texto simples; EXE é executável; MP3 é áudio. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'TXT como formato de planilha' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'EXE como formato de imagem' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'MP3 como formato de documento paginado' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Formatos de arquivo — PDF","tags":["informatica","mapa_065","pdf"]},{"id":"INF018","area":"Noções de Informática","mapa":"MAPA 065 - Arquivos, formatos e extensões","tema":"Arquivos, formatos e extensões","subtema":"ZIP","dificuldade":"intermediaria","enunciado":"Durante a execução de uma tarefa administrativa, compactar vários arquivos em um arquivo .zip tem como finalidade típica:","alternativas":{"A":"transformar automaticamente todos os arquivos em imagens","B":"agrupar arquivos e, dependendo do conteúdo, reduzir o espaço ocupado","C":"garantir criptografia forte em qualquer arquivo ZIP","D":"eliminar a necessidade de cópias de segurança"},"gabarito":"B","comentario":"Gabarito: B. ZIP é um formato de compactação/arquivamento. Pode ou não reduzir muito o tamanho e não implica criptografia forte por padrão nem substitui backup. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'transformar automaticamente todos os arquivos em imagens' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'garantir criptografia forte em qualquer arquivo ZIP' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'eliminar a necessidade de cópias de segurança' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Formatos de arquivo — ZIP","tags":["informatica","mapa_065","zip"]},{"id":"INF019","area":"Noções de Informática","mapa":"MAPA 065 - Arquivos, formatos e extensões","tema":"Arquivos, formatos e extensões","subtema":"Renomear extensão","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessárias. um usuário renomeia foto.jpg para foto.pdf sem converter o conteúdo. Em regra, essa ação:","alternativas":{"A":"converte a imagem em PDF de forma garantida","B":"criptografa automaticamente a imagem","C":"não converte o conteúdo do arquivo para PDF","D":"remove os metadados e reduz o tamanho"},"gabarito":"C","comentario":"Gabarito: C. Alterar apenas a extensão não altera a estrutura interna do arquivo. Conversão exige software ou recurso que regrave o conteúdo no novo formato. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'converte a imagem em PDF de forma garantida' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'criptografa automaticamente a imagem' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'remove os metadados e reduz o tamanho' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Arquivos — extensão versus conteúdo","tags":["informatica","mapa_065","renomear_extensao"]},{"id":"INF020","area":"Noções de Informática","mapa":"MAPA 065 - Arquivos, formatos e extensões","tema":"Arquivos, formatos e extensões","subtema":"Associação de aplicativo","dificuldade":"intermediaria","enunciado":"Em um ambiente de trabalho com procedimentos usuais de informática, quando o sistema abre arquivos .txt por padrão em um editor de texto, isso decorre de uma:","alternativas":{"A":"regra de roteamento da internet","B":"configuração da BIOS para impressão","C":"associação entre extensão/tipo de arquivo e aplicativo","D":"função exclusiva da memória cache"},"gabarito":"C","comentario":"Gabarito: C. Sistemas operacionais mantêm associações entre tipos de arquivo e programas padrão. Não é função de BIOS, cache ou roteamento. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'regra de roteamento da internet' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'configuração da BIOS para impressão' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'função exclusiva da memória cache' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Sistemas operacionais — associação de arquivos","tags":["informatica","mapa_065","associacao_de_aplicativo"]},{"id":"INF021","area":"Noções de Informática","mapa":"MAPA 066 - Windows e Linux: pastas, diretórios, arquivos e atalhos","tema":"Windows e Linux: pastas, diretórios, arquivos e atalhos","subtema":"Diretório","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, em Windows e Linux, o termo diretório é usado para representar:","alternativas":{"A":"um tipo obrigatório de arquivo executável","B":"um periférico de entrada","C":"uma estrutura que organiza arquivos e outros diretórios","D":"um protocolo de internet"},"gabarito":"C","comentario":"Gabarito: C. Diretórios/pastas organizam arquivos e subdiretórios. Não são periféricos, protocolos ou necessariamente executáveis. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'um tipo obrigatório de arquivo executável' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'um periférico de entrada' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'um protocolo de internet' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Sistemas de arquivos — diretórios","tags":["informatica","mapa_066","diretorio"]},{"id":"INF022","area":"Noções de Informática","mapa":"MAPA 066 - Windows e Linux: pastas, diretórios, arquivos e atalhos","tema":"Windows e Linux: pastas, diretórios, arquivos e atalhos","subtema":"Caminho","dificuldade":"intermediaria","enunciado":"Durante a execução de uma tarefa administrativa, um caminho de arquivo serve para:","alternativas":{"A":"determinar a velocidade do processador","B":"indicar a localização de um arquivo ou diretório na estrutura do sistema de arquivos","C":"definir o endereço IP do computador","D":"converter automaticamente o formato do arquivo"},"gabarito":"B","comentario":"Gabarito: B. O caminho identifica onde o item está localizado na hierarquia do sistema de arquivos. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'determinar a velocidade do processador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'definir o endereço IP do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'converter automaticamente o formato do arquivo' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Sistemas de arquivos — caminhos","tags":["informatica","mapa_066","caminho"]},{"id":"INF023","area":"Noções de Informática","mapa":"MAPA 066 - Windows e Linux: pastas, diretórios, arquivos e atalhos","tema":"Windows e Linux: pastas, diretórios, arquivos e atalhos","subtema":"Atalho","dificuldade":"facil","enunciado":"Criar um atalho para um arquivo na área de trabalho normalmente:","alternativas":{"A":"duplica obrigatoriamente todos os bytes do arquivo","B":"move o arquivo original para a área de trabalho","C":"transforma o arquivo em pasta","D":"cria uma referência ao arquivo sem duplicar necessariamente seu conteúdo"},"gabarito":"D","comentario":"Gabarito: D. Atalhos apontam para um destino. Excluir o atalho normalmente não exclui o arquivo original. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'duplica obrigatoriamente todos os bytes do arquivo' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'move o arquivo original para a área de trabalho' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'transforma o arquivo em pasta' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Windows/Linux — atalhos e links","tags":["informatica","mapa_066","atalho"]},{"id":"INF024","area":"Noções de Informática","mapa":"MAPA 066 - Windows e Linux: pastas, diretórios, arquivos e atalhos","tema":"Windows e Linux: pastas, diretórios, arquivos e atalhos","subtema":"Sensibilidade a maiúsculas","dificuldade":"dificil","enunciado":"Para resolver corretamente a situação sem assumir funcionalidades inexistentes, Em muitos sistemas de arquivos usados em Linux, nomes como Relatorio.txt e relatorio.txt podem ser tratados como:","alternativas":{"A":"nomes distintos","B":"sempre o mesmo arquivo","C":"endereços IP equivalentes","D":"atalhos obrigatórios para o mesmo destino"},"gabarito":"A","comentario":"Gabarito: A. Em ambientes Linux, a distinção entre maiúsculas e minúsculas é comum. O comportamento pode variar conforme o sistema de arquivos, mas a possibilidade existe e é relevante. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'sempre o mesmo arquivo' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'endereços IP equivalentes' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'atalhos obrigatórios para o mesmo destino' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Linux — nomes de arquivos e case sensitivity","tags":["informatica","mapa_066","sensibilidade_a_maiusculas"]},{"id":"INF025","area":"Noções de Informática","mapa":"MAPA 066 - Windows e Linux: pastas, diretórios, arquivos e atalhos","tema":"Windows e Linux: pastas, diretórios, arquivos e atalhos","subtema":"Pasta raiz","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, a ideia de diretório raiz em um sistema de arquivos corresponde:","alternativas":{"A":"à memória RAM reservada ao navegador","B":"ao primeiro arquivo criado pelo usuário","C":"ao dispositivo de impressão padrão","D":"ao ponto superior de referência da hierarquia de diretórios"},"gabarito":"D","comentario":"Gabarito: D. O diretório raiz é o ponto de origem da hierarquia. No Linux costuma ser representado por '/', enquanto o Windows organiza caminhos por volumes/unidades. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'à memória RAM reservada ao navegador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'ao primeiro arquivo criado pelo usuário' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'ao dispositivo de impressão padrão' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Sistemas de arquivos — raiz","tags":["informatica","mapa_066","pasta_raiz"]},{"id":"INF026","area":"Noções de Informática","mapa":"MAPA 067 - Área de trabalho e área de transferência","tema":"Área de trabalho e área de transferência","subtema":"Clipboard","dificuldade":"dificil","enunciado":"Considerando boas práticas e o funcionamento usual das tecnologias citadas, Ao copiar um trecho de texto e colá-lo em outro aplicativo, o conteúdo copiado é mantido temporariamente na:","alternativas":{"A":"BIOS","B":"memória ROM do monitor","C":"área de transferência","D":"lixeira"},"gabarito":"C","comentario":"Gabarito: C. A área de transferência (clipboard) mantém dados copiados/recortados para posterior colagem. Não é a lixeira nem firmware. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'BIOS' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'memória ROM do monitor' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'lixeira' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Sistemas operacionais — área de transferência","tags":["informatica","mapa_067","clipboard"]},{"id":"INF027","area":"Noções de Informática","mapa":"MAPA 067 - Área de trabalho e área de transferência","tema":"Área de trabalho e área de transferência","subtema":"Copiar x recortar","dificuldade":"dificil","enunciado":"Em um cenário em que é necessário distinguir conceitos próximos, A diferença prática entre copiar e recortar um arquivo para posterior colagem é que, em regra:","alternativas":{"A":"copiar apaga o original e recortar cria duplicata","B":"ambos sempre excluem o original","C":"copiar mantém o original no local de origem, enquanto recortar prepara sua movimentação","D":"recortar converte o arquivo para outro formato"},"gabarito":"C","comentario":"Gabarito: C. Copiar duplica a referência/conteúdo no destino mantendo o original; recortar é usado para mover quando a colagem é concluída. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'copiar apaga o original e recortar cria duplicata' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'ambos sempre excluem o original' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'recortar converte o arquivo para outro formato' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Área de transferência — copiar e recortar","tags":["informatica","mapa_067","copiar_x_recortar"]},{"id":"INF028","area":"Noções de Informática","mapa":"MAPA 067 - Área de trabalho e área de transferência","tema":"Área de trabalho e área de transferência","subtema":"Área de trabalho","dificuldade":"facil","enunciado":"A área de trabalho de um sistema operacional gráfico pode conter:","alternativas":{"A":"somente programas do sistema","B":"apenas arquivos ocultos","C":"exclusivamente páginas da internet","D":"ícones, atalhos, arquivos e pastas, conforme configuração do usuário"},"gabarito":"D","comentario":"Gabarito: D. A área de trabalho é uma interface que pode reunir diversos itens e atalhos, conforme o sistema e a configuração. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'somente programas do sistema' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'apenas arquivos ocultos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'exclusivamente páginas da internet' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Interface gráfica — área de trabalho","tags":["informatica","mapa_067","area_de_trabalho"]},{"id":"INF029","area":"Noções de Informática","mapa":"MAPA 067 - Área de trabalho e área de transferência","tema":"Área de trabalho e área de transferência","subtema":"Colar","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, se um usuário copia uma imagem de um aplicativo e o aplicativo de destino aceita esse tipo de conteúdo, o comando Colar tende a:","alternativas":{"A":"desligar o aplicativo de origem","B":"formatar o disco de destino","C":"alterar o endereço IP","D":"inserir no destino uma representação do conteúdo existente na área de transferência"},"gabarito":"D","comentario":"Gabarito: D. Colar usa o conteúdo da área de transferência e depende de compatibilidade do aplicativo de destino. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'desligar o aplicativo de origem' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'formatar o disco de destino' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'alterar o endereço IP' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Área de transferência — colagem","tags":["informatica","mapa_067","colar"]},{"id":"INF030","area":"Noções de Informática","mapa":"MAPA 067 - Área de trabalho e área de transferência","tema":"Área de trabalho e área de transferência","subtema":"Histórico","dificuldade":"facil","enunciado":"Alguns sistemas oferecem histórico da área de transferência. Quando esse recurso está habilitado, sua função é:","alternativas":{"A":"criar backup completo do computador","B":"substituir o gerenciador de arquivos","C":"garantir armazenamento permanente de qualquer item copiado","D":"permitir acesso a mais de um item copiado recentemente, conforme as regras do sistema"},"gabarito":"D","comentario":"Gabarito: D. O histórico amplia a área de transferência para itens recentes, mas não equivale a backup permanente. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'criar backup completo do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'substituir o gerenciador de arquivos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'garantir armazenamento permanente de qualquer item copiado' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Sistemas operacionais — histórico da área de transferência","tags":["informatica","mapa_067","historico"]},{"id":"INF031","area":"Noções de Informática","mapa":"MAPA 068 - Manipulação de arquivos e pastas","tema":"Manipulação de arquivos e pastas","subtema":"Mover","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessárias. mover um arquivo de uma pasta para outra tem como objetivo:","alternativas":{"A":"alterar necessariamente seu conteúdo","B":"alterar sua localização na estrutura de diretórios","C":"converter sua extensão","D":"duplicá-lo obrigatoriamente"},"gabarito":"B","comentario":"Gabarito: B. Mover altera a localização; não implica mudança do conteúdo ou formato. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'alterar necessariamente seu conteúdo' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'converter sua extensão' s","tags":["informatica","mapa_072","marcadores"]},{"id":"INF053","area":"Noções de Informática","mapa":"MAPA 072 - Editor de textos: colunas, marcadores e numeração","tema":"Editor de textos: colunas, marcadores e numeração","subtema":"Numeração","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, para representar uma sequência de etapas que deve ser seguida em ordem, é mais apropriado usar:","alternativas":{"A":"lista com marcadores sem ordem","B":"lista numerada","C":"caixa de texto aleatória","D":"marca d'água"},"gabarito":"B","comentario":"Gabarito: B. Numeração comunica ordem explícita entre etapas. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'lista com marcadores sem ordem' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'caixa de texto aleatória' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'marca d'água' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Editores de texto — listas numeradas","tags":["informatica","mapa_072","numeracao"]},{"id":"INF054","area":"Noções de Informática","mapa":"MAPA 072 - Editor de textos: colunas, marcadores e numeração","tema":"Editor de textos: colunas, marcadores e numeração","subtema":"Subníveis","dificuldade":"facil","enunciado":"Em uma lista hierárquica, itens subordinados podem ser organizados por:","alternativas":{"A":"resolução do monitor","B":"protocolos HTTP e FTP","C":"tamanho do disco","D":"níveis de lista e recuos"},"gabarito":"D","comentario":"Gabarito: D. Listas multinível usam níveis e recuos para representar hierarquia. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'resolução do monitor' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'protocolos HTTP e FTP' não corresponde à função o
