wares' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'alterar o sistema de arquivos' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Editores de texto — visualização de impressão","tags":["informatica","mapa_073","visualizacao_de_impressao"]},{"id":"INF060","area":"Noções de Informática","mapa":"MAPA 073 - Editor de textos: tabelas e impressão","tema":"Editor de textos: tabelas e impressão","subtema":"Intervalo de páginas","dificuldade":"facil","enunciado":"Imprimir apenas as páginas 2 a 4 de um documento exige configurar:","alternativas":{"A":"o idioma do teclado","B":"o intervalo de páginas na impressão","C":"o cache do processador","D":"o endereço IP da impressora como única possibilidade"},"gabarito":"B","comentario":"Gabarito: B. O intervalo de páginas define quais páginas serão enviadas à impressão. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'o idioma do teclado' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'o cache do processador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'o endereço IP da impressora como única possibilidade' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Editores de texto — intervalo de impressão","tags":["informatica","mapa_073","intervalo_de_paginas"]},{"id":"INF061","area":"Noções de Informática","mapa":"MAPA 074 - Editor de textos: quebras e numeração de páginas","tema":"Editor de textos: quebras e numeração de páginas","subtema":"Quebra de página","dificuldade":"facil","enunciado":"Para iniciar um novo capítulo na página seguinte sem inserir várias linhas vazias, usa-se preferencialmente:","alternativas":{"A":"quebra de página","B":"espaços repetidos","C":"aumento de fonte","D":"marcadores"},"gabarito":"A","comentario":"Gabarito: A. Quebra de página força o cont a A está incorreta porque 'o sistema de arquivos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'a placa de rede' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'o conteúdo da memória ROM' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Editores de texto — cabeçalho e rodapé","tags":["informatica","mapa_074","primeira_pagina_diferente"]},{"id":"INF065","area":"Noções de Informática","mapa":"MAPA 074 - Editor de textos: quebras e numeração de páginas","tema":"Editor de textos: quebras e numeração de páginas","subtema":"Quebra de linha","dificuldade":"dificil","enunciado":"Analise a situação a seguir com atenção aos conceitos técnicos envolvidos. Uma quebra de linha dentro do mesmo parágrafo ou contexto textual não é equivalente, necessariamente, a:","alternativas":{"A":"uma mudança de linha","B":"uma ação de edição","C":"um comando de layout","D":"uma quebra de página"},"gabarito":"D","comentario":"Gabarito: D. Quebra de linha muda a linha; quebra de página inicia nova página. São comandos de layout distintos. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'uma mudança de linha' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'uma ação de edição' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'um comando de layout' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Editores de texto — quebras","tags":["informatica","mapa_074","quebra_de_linha"]},{"id":"INF066","area":"Noções de Informática","mapa":"MAPA 075 - Editor de textos: legendas, índices, objetos, campos e caixas de texto","tema":"Editor de textos: legendas, índices, objetos, campos e caixas de texto","subtema":"Legenda","dificuldade":"dificil","enunciado":"Considerando boas práticas e o funcionamen ,"mapa_082","responder_a_todos"]},{"id":"INF103","area":"Noções de Informática","mapa":"MAPA 083 - Correio eletrônico: anexação e gerenciamento de arquivos","tema":"Correio eletrônico: anexação e gerenciamento de arquivos","subtema":"Anexo","dificuldade":"dificil","enunciado":"Em um cenário em que é necessário distinguir conceitos próximos, Adicionar um arquivo a uma mensagem de e-mail significa:","alternativas":{"A":"incluí-lo como anexo para envio com a mensagem","B":"transformá-lo em destinatário","C":"apagá-lo do computador","D":"convertê-lo sempre em PDF"},"gabarito":"A","comentario":"Gabarito: A. Anexar inclui o arquivo na mensagem, sujeito a limites e políticas do serviço. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'transformá-lo em destinatário' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'apagá-lo do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'convertê-lo sempre em PDF' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Correio eletrônico — anexos","tags":["informatica","mapa_083","anexo"]},{"id":"INF104","area":"Noções de Informática","mapa":"MAPA 083 - Correio eletrônico: anexação e gerenciamento de arquivos","tema":"Correio eletrônico: anexação e gerenciamento de arquivos","subtema":"Tamanho","dificuldade":"intermediaria","enunciado":"Em um ambiente de trabalho com procedimentos usuais de informática, se um arquivo excede o limite de anexos do serviço de e-mail, uma alternativa comum é:","alternativas":{"A":"compartilhar um link para o arquivo armazenado em serviço autorizado de nuvem, conforme política aplicável","B":"dividir a senha da conta com o destinatário","C":"desativar o antivírus","D":"renomear o arquivo para qualquer extensão e reenviar"},"gabarito":"A","comentario":"Gabarito: A. Links de armazenamento em nuvem são alternativa comum para arquivos grandes. Compartilhar senha é inseguro e renomear extensão não reduz tamanho. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'dividir a senha da conta com o destinatário' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'desativar o antivírus' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'renomear o arquivo para qualquer extensão e reenviar' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Correio eletrônico — anexos grandes","tags":["informatica","mapa_083","tamanho"]},{"id":"INF105","area":"Noções de Informática","mapa":"MAPA 083 - Correio eletrônico: anexação e gerenciamento de arquivos","tema":"Correio eletrônico: anexação e gerenciamento de arquivos","subtema":"Risco","dificuldade":"facil","enunciado":"Ao receber um anexo executável inesperado de remetente desconhecido, a conduta mais segura é:","alternativas":{"A":"não executá-lo e verificar a legitimidade da mensagem por meio confiável","B":"executá-lo imediatamente para conferir","C":"desativar o firewall","D":"reenviá-lo a todos os contatos"},"gabarito":"A","comentario":"Gabarito: A. Anexos executáveis podem conter malware. Deve-se evitar execução e verificar procedência. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'executá-lo imediatamente para conferir' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'desativar o firewall' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'reenviá-lo a todos os contatos' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Segurança de e-mail — anexos","tags":["informatica","mapa_083","risco"]},{"id":"INF106","area":"Noções de Informática","mapa":"MAPA 083 - Correio eletrônico: anexação e gerenciamento de arquivos","tema":"Correio eletrônico: anexação e gerenciamento de arquivos","subtema":"Compactação","dificuldade":"facil","enunciado":"Compactar vários documentos em um arquivo ZIP antes de anexá-los pode ser útil para:","alternativas":{"A":"agrupar os arquivos e eventualmente reduzir o tamanho total","B":"garantir ausência de malware","C":"substituir criptografia em qualquer contexto","D":"eliminar limites de tamanho do provedor"},"gabarito":"A","comentario":"Gabarito: A. ZIP facilita agrupamento e pode reduzir tamanho, mas não garante segurança nem elimina limites. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'garantir ausência de malware' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'substituir criptografia em qualquer contexto' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'eliminar limites de tamanho do provedor' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Correio eletrônico — compactação de anexos","tags":["informatica","mapa_083","compactacao"]},{"id":"INF107","area":"Noções de Informática","mapa":"MAPA 083 - Correio eletrônico: anexação e gerenciamento de arquivos","tema":"Correio eletrônico: anexação e gerenciamento de arquivos","subtema":"Remover anexo","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessárias. antes de enviar uma mensagem, remover um anexo equivocado:","alternativas":{"A":"apaga obrigatoriamente o arquivo do computador","B":"bloqueia o destinatário","C":"desinstala o aplicativo de e-mail","D":"evita que aquele arquivo seja enviado junto com a mensagem"},"gabarito":"D","comentario":"Gabarito: D. Remover o anexo da composição apenas retira sua inclusão na mensagem; o arquivo original permanece, salvo ação separada. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'apaga obrigatoriamente o arquivo do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'bloqueia o destinatário' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'desinstala o aplicativo de e-mail' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Correio eletrônico — gerenciamento de anexos","tags":["informatica","mapa_083","remover_anexo"]},{"id":"INF108","area":"Noções de Informática","mapa":"MAPA 084 - Ferramentas de reuniões on-line: Microsoft Teams e Google Meet","tema":"Ferramentas de reuniões on-line: Microsoft Teams e Google Meet","subtema":"Microfone","dificuldade":"dificil","enunciado":"Para resolver corretamente a situação sem assumir funcionalidades inexistentes, Durante uma reunião on-line, manter o microfone desativado quando não se está falando ajuda a:","alternativas":{"A":"aumentar a resolução da câmera","B":"criptografar todos os arquivos do computador","C":"reduzir ruídos indesejados para os demais participantes","D":"criar uma cópia da reunião"},"gabarito":"C","comentario":"Gabarito: C. Silenciar o microfone reduz ruído e interferência durante reuniões. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'aumentar a resolução da câmera' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'criptografar todos os arquivos do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'criar uma cópia da reunião' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Reuniões on-line — controles de áudio","tags":["informatica","mapa_084","microfone"]},{"id":"INF109","area":"Noções de Informática","mapa":"MAPA 084 - Ferramentas de reuniões on-line: Microsoft Teams e Google Meet","tema":"Ferramentas de reuniões on-line: Microsoft Teams e Google Meet","subtema":"Compartilhamento de tela","dificuldade":"facil","enunciado":"O compartilhamento de tela no Teams ou Meet serve para:","alternativas":{"A":"dar controle administrativo irrestrito ao computador em qualquer caso","B":"mostrar aos participantes uma tela, janela ou conteúdo selecionado","C":"enviar automaticamente todos os arquivos locais","D":"substituir a conexão de internet"},"gabarito":"B","comentario":"Gabarito: B. Compartilhar tela transmite visualmente conteúdo selecionado; não implica acesso irrestrito por padrão. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'dar controle administrativo irrestrito ao computador em qualquer caso' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'enviar automaticamente todos os arquivos locais' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'substituir a conexão de internet' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Microsoft Teams / Google Meet — compartilhamento de tela","tags":["informatica","mapa_084","compartilhamento_de_tela"]},{"id":"INF110","area":"Noções de Informática","mapa":"MAPA 084 - Ferramentas de reuniões on-line: Microsoft Teams e Google Meet","tema":"Ferramentas de reuniões on-line: Microsoft Teams e Google Meet","subtema":"Chat","dificuldade":"facil","enunciado":"O chat de uma reunião é útil para:","alternativas":{"A":"aumentar memória RAM","B":"formatar discos","C":"trocar mensagens de texto e, conforme a plataforma, links ou arquivos durante a reunião","D":"substituir o microfone fisicamente"},"gabarito":"C","comentario":"Gabarito: C. Chat é um canal textual complementar à reunião. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'aumentar memória RAM' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B et' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'substituiu o Microsoft Teams' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Microsoft — descontinuação do Skype em 2025","tags":["informatica","mapa_085","skype"]},{"id":"INF114","area":"Noções de Informática","mapa":"MAPA 085 - Ferramentas de reuniões on-line: Zoom, Skype e Google Hangouts","tema":"Ferramentas de reuniões on-line: Zoom, Skype e Google Hangouts","subtema":"Hangouts","dificuldade":"dificil","enunciado":"Considerando boas práticas e o funcionamento usual das tecnologias citadas, Sobre o Google Hangouts, é correto afirmar que:","alternativas":{"A":"é atualmente o único serviço de e-mail do Google","B":"é um navegador web","C":"é um formato de arquivo","D":"foi descontinuado e substituído por produtos mais recentes do ecossistema Google, como Google Chat e Google Meet"},"gabarito":"D","comentario":"Gabarito: D. O Hangouts foi encerrado; suas funções foram migradas para serviços como Google Chat e Google Meet. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'é atualmente o único serviço de e-mail do Google' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'é um navegador web' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'é um formato de arquivo' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Google — transição do Hangouts para Chat/Meet","tags":["informatica","mapa_085","hangouts"]},{"id":"INF115","area":"Noções de Informática","mapa":"MAPA 085 - Ferramentas de reuniões on-line: Zoom, Skype e Google Hangouts","tema":"Ferramentas de reuniões on-line: Zoom, Skype e Google Hangouts","subtema":"Boas práticas","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessár  obter informações ou ações. Serviços legítimos não devem solicitar senhas por mensagens desse tipo. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'desfragmentação' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'compressão' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'renderização gráfica' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Segurança — engenharia social","tags":["informatica","mapa_094","engenharia_social"]},{"id":"INF157","area":"Noções de Informática","mapa":"MAPA 095 - Assinatura digital","tema":"Assinatura digital","subtema":"Finalidade","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, uma assinatura digital baseada em criptografia assimétrica é usada para fornecer evidências de:","alternativas":{"A":"autenticidade e integridade do conteúdo assinado, conforme a infraestrutura de chaves e certificados utilizada","B":"confidencialidade automática do conteúdo","C":"compressão do arquivo","D":"backup em nuvem"},"gabarito":"A","comentario":"Gabarito: A. Assinaturas digitais verificam autoria/autenticidade e integridade. Não criptografam necessariamente o conteúdo para sigilo. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'confidencialidade automática do conteúdo' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'compressão do arquivo' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'backup em nuvem' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Criptografia — assinatura digital","tags":["informatica","mapa_095","finalidade"]},{"id":"INF158","area":"Noções de Informática","mapa":"MAPA 095 - Assinatura digital","tema":"Assinatura digital","subtema":"Chave privada","dificuldade":"intermediaria","enunciado":"Durante a execução de uma tarefa administrativa, na assinatura digital assimétrica, a criação da assinatura é realizada com:","alternativas":{"A":"a chave pública do destinatário obrigatoriamente","B":"a chave privada do signatário","C":"o endereço IP","D":"a senha do roteador"},"gabarito":"B","comentario":"Gabarito: B. O signatário usa sua chave privada; a verificação é feita com a chave pública correspondente. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'a chave pública do destinatário obrigatoriamente' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'o endereço IP' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'a senha do roteador' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Criptografia assimétrica — assinatura","tags":["informatica","mapa_095","chave_privada"]},{"id":"INF159","area":"Noções de Informática","mapa":"MAPA 095 - Assinatura digital","tema":"Assinatura digital","subtema":"Verificação","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessárias. a verificação de uma assinatura digital utiliza, em regra:","alternativas":{"A":"uma cópia da senha do signatário","B":"a memória RAM do computador","C":"um arquivo ZIP","D":"a chave pública correspondente à chave privada que assinou"},"gabarito":"D","comentario":"Gabarito: D. A chave pública permite verificar a assinatura produzida pela chave privada correspondente. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'uma cópia da senha do signatário' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'a memória RAM do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'um arquivo ZIP' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Criptografia assimétrica — verificação","tags":["informatica","mapa_095","verificacao"]},{"id":"INF160","area":"Noções de Informática","mapa":"MAPA 095 - Assinatura digital","tema":"Assinatura digital","subtema":"Assinatura x criptografia","dificuldade":"intermediaria","enunciado":"Em um ambiente de trabalho com procedimentos usuais de informática, assinar digitalmente um documento não significa necessariamente:","alternativas":{"A":"permitir verificação de integridade","B":"manter seu conteúdo confidencial","C":"vincular a assinatura a uma chave do signatário","D":"usar mecanismos criptográficos"},"gabarito":"B","comentario":"Gabarito: B. Assinatura digital e criptografia para confidencialidade são objetivos distintos. Um documento pode ser assinado e permanecer legível. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'permitir verificação de integridade' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'vincular a assinatura a uma chave do signatário' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'usar mecanismos criptográficos' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Assinatura digital — integridade versus confidencialidade","tags":["informatica","mapa_095","assinatura_x_criptografia"]},{"id":"INF161","area":"Noções de Informática","mapa":"MAPA 096 - Procedimentos de segurança e backup","tema":"Procedimentos de segurança e backup","subtema":"Backup","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, backup é:","alternativas":{"A":"sinônimo de arquivo temporário","B":"um antivírus","C":"uma cópia de dados criada para possibilitar recuperação em caso de perda, corrupção ou incidente","D":"uma senha"},"gabarito":"C","comentario":"Gabarito: C. Backup existe para restauração após perda ou dano. Deve ser separado dos dados de produção de forma adequada. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'sinônimo de arquivo temporário' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'um antivírus' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'uma senha' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Backup — conceito","tags":["informatica","mapa_096","backup"]},{"id":"INF162","area":"Noções de Informática","mapa":"MAPA 096 - Procedimentos de segurança e backup","tema":"Procedimentos de segurança e backup","subtema":"Regra 3-2-1","dificuldade":"dificil","enunciado":"Considerando boas práticas e o funcionamento usual das tecnologias citadas, A estratégia de backup 3-2-1 recomenda, de forma clássica:","alternativas":{"A":"três senhas, dois usuários e um antivírus","B":"manter três cópias dos dados, em dois tipos de mídia, com uma cópia fora do local principal","C":"três antivírus, dois firewalls e uma nuvem","D":"um arquivo em três pastas do mesmo disco"},"gabarito":"B","comentario":"Gabarito: B. A regra 3-2-1 aumenta resiliência contra falhas locais e perda de mídia. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'três senhas, dois usuários e um antivírus' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'três antivírus, dois firewalls e uma nuvem' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'um arquivo em três pastas do mesmo disco' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Backup — regra 3-2-1","tags":["informatica","mapa_096","regra_3_2_1"]},{"id":"INF163","area":"Noções de Informática","mapa":"MAPA 096 - Procedimentos de segurança e backup","tema":"Procedimentos de segurança e backup","subtema":"Restauração","dificuldade":"dificil","enunciado":"Em um cenário em que é necessário distinguir conceitos próximos, Um backup só é realmente útil se:","alternativas":{"A":"estiver no mesmo disco e pasta do original","B":"nunca for testado","C":"for sempre compactado","D":"for possível restaurar os dados de forma confiável quando necessário"},"gabarito":"D","comentario":"Gabarito: D. Testes de restauração são essenciais para validar a recuperabilidade do backup. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'estiver no mesmo disco e pasta do original' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'nunca for testado' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'for sempre compactado' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Backup — testes de restauração","tags":["informatica","mapa_096","restauracao"]},{"id":"INF164","area":"Noções de Informática","mapa":"MAPA 096 - Procedimentos de segurança e backup","tema":"Procedimentos de segurança e backup","subtema":"Incremental","dificuldade":"facil","enunciado":"Um backup incremental normalmente copia:","alternativas":{"A":"dados alterados desde o último backup, completo ou incremental, conforme a cadeia adotada","B":"sempre todos os dados","C":"somente arquivos apagados","D":"apenas o sistema operacional"},"gabarito":"A","comentario":"Gabarito: A. Incrementais registram mudanças desde o backup anterior relevante, economizando espaço e tempo, mas dependem da cadeia para restauração. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'sempre todos os dados' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'somente arquivos apagados' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'apenas o sistema operacional' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Backup — incremental","tags":["informatica","mapa_096","incremental"]},{"id":"INF165","area":"Noções de Informática","mapa":"MAPA 096 - Procedimentos de segurança e backup","tema":"Procedimentos de segurança e backup","subtema":"Ransomware","dificuldade":"dificil","enunciado":"Analise a situação a seguir com atenção aos conceitos técnicos envolvidos. Manter backups desconectados ou imutáveis pode reduzir o impacto de ransomware porque:","alternativas":{"A":"dificulta que o malware altere ou criptografe todas as cópias de recuperação","B":"impede qualquer infecção do computador","C":"substitui atualizações de segurança","D":"torna antivírus desnecessário"},"gabarito":"A","comentario":"Gabarito: A. Cópias isoladas/imutáveis preservam alternativas de restauração, embora não impeçam a infecção inicial. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'impede qualquer infecção do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'substitui atualizações de segurança' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'torna antivírus desnecessário' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Backup — resiliência a ransomware","tags":["informatica","mapa_096","ransomware"]},{"id":"INF166","area":"Noções de Informática","mapa":"MAPA 097 - Antivírus e firewalls","tema":"Antivírus e firewalls","subtema":"Antivírus","dificuldade":"facil","enunciado":"Um antivírus tem como função principal:","alternativas":{"A":"garantir proteção absoluta contra qualquer ataque","B":"substituir backups","C":"detectar, bloquear e/ou remover códigos maliciosos conforme suas capacidades e assinaturas/comportamentos","D":"aumentar velocidade da internet"},"gabarito":"C","comentario":"Gabarito: C. Antivírus é uma camada de defesa, mas não elimina todos os riscos nem substitui outras medidas. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'garantir proteção absoluta contra qualquer ataque' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'substituir backups' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'aumentar velocidade da internet' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Segurança — antivírus","tags":["informatica","mapa_097","antivirus"]},{"id":"INF167","area":"Noções de Informática","mapa":"MAPA 097 - Antivírus e firewalls","tema":"Antivírus e firewalls","subtema":"Firewall","dificuldade":"facil","enunciado":"Um firewall é usado para:","alternativas":{"A":"controlar tráfego de rede conforme regras definidas","B":"editar documentos","C":"resfriar o processador","D":"compactar arquivos"},"gabarito":"A","comentario":"Gabarito: A. Firewalls permitem, bloqueiam ou inspecionam comunicações de rede segundo políticas. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'editar documentos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'resfriar o processador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'compactar arquivos' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Segurança de redes — firewall","tags":["informatica","mapa_097","firewall"]},{"id":"INF168","area":"Noções de Informática","mapa":"MAPA 097 - Antivírus e firewalls","tema":"Antivírus e firewalls","subtema":"Camadas","dificuldade":"dificil","enunciado":"Para resolver corretamente a situação sem assumir funcionalidades inexistentes, Usar antivírus, firewall, atualizações e boas práticas em conjunto exemplifica:","alternativas":{"A":"dependência de uma única proteção","B":"defesa em profundidade","C":"formatação automática","D":"compressão redundante"},"gabarito":"B","comentario":"Gabarito: B. Defesa em profundidade usa múltiplas camadas para reduzir a chance de falha total. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'dependência de uma única proteção' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'formatação automática' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'compressão redundante' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Segurança — defesa em profundidade","tags":["informatica","mapa_097","camadas"]},{"id":"INF169","area":"Noções de Informática","mapa":"MAPA 097 - Antivírus e firewalls","tema":"Antivírus e firewalls","subtema":"Atualização","dificuldade":"dificil","enunciado":"Analise a situação a seguir com atenção aos conceitos técnicos envolvidos. Manter o antivírus atualizado é importante porque:","alternativas":{"A":"torna o usuário imune a phishing","B":"melhora sua capacidade de reconhecer ameaças e utilizar mecanismos recentes de detecção","C":"substitui MFA","D":"elimina a necessidade de sistema atualizado"},"gabarito":"B","comentario":"Gabarito: B. Atualizações de mecanismos e inteligência aumentam eficácia, mas não protegem contra todas as ameaças. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'torna o usuário imune a phishing' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'substitui MFA' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'elimina a necessidade de sistema atualizado' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Segurança — atualização de antivírus","tags":["informatica","mapa_097","atualizacao"]},{"id":"INF170","area":"Noções de Informática","mapa":"MAPA 097 - Antivírus e firewalls","tema":"Antivírus e firewalls","subtema":"Firewall não é antivírus","dificuldade":"intermediaria","enunciado":"Durante a execução de uma tarefa administrativa, é correto afirmar que firewall e antivírus:","alternativas":{"A":"são exatamente a mesma tecnologia","B":"não podem coexistir","C":"garantem segurança total quando usados juntos","D":"têm funções diferentes e podem atuar de forma complementar"},"gabarito":"D","comentario":"Gabarito: D. Firewall controla tráfego; antivírus busca detectar e tratar malware. São complementares, não absolutos. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'são exatamente a mesma tecnologia' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'não podem coexistir' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'garantem segurança total quando usados juntos' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Segurança — firewall versus antivírus","tags":["informatica","mapa_097","firewall_nao_e_antivirus"]},{"id":"INF171","area":"Noções de Informática","mapa":"MAPA 098 - Malwares e ataques virtuais","tema":"Malwares e ataques virtuais","subtema":"Vírus","dificuldade":"dificil","enunciado":"Em um cenário em que é necessário distinguir conceitos próximos, Um vírus de computador caracteriza-se tipicamente por:","alternativas":{"A":"propagar-se necessariamente sem qualquer hospedeiro","B":"ser sempre um programa legítimo","C":"anexar-se a arquivos ou outros hospedeiros e depender de execução para se propagar","D":"atuar apenas como firewall"},"gabarito":"C","comentario":"Gabarito: C. Vírus costuma depender de arquivo/hospedeiro e execução. Worms possuem capacidade autônoma de propagação em rede. A alternativa C expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'propagar-se necessariamente sem qualquer hospedeiro' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'ser sempre um programa legítimo' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'atuar apenas como firewall' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Malware — vírus","tags":["informatica","mapa_098","virus"]},{"id":"INF172","area":"Noções de Informática","mapa":"MAPA 098 - Malwares e ataques virtuais","tema":"Malwares e ataques virtuais","subtema":"Worm","dificuldade":"dificil","enunciado":"Para resolver corretamente a situação sem assumir funcionalidades inexistentes, Um worm diferencia-se de um vírus porque tende a:","alternativas":{"A":"ser apenas uma mensagem publicitária","B":"propagar-se de forma autônoma, especialmente por redes, sem precisar anexar-se a um arquivo hospedeiro","C":"exigir sempre ação manual para cada cópia","D":"ser um mecanismo de backup"},"gabarito":"B","comentario":"Gabarito: B. Worms exploram redes e vulnerabilidades para autopropagação. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'ser apenas uma mensagem publicitária' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'exigir sempre ação manual para cada cópia' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'ser um mecanismo de backup' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Malware — worm","tags":["informatica","mapa_098","worm"]},{"id":"INF173","area":"Noções de Informática","mapa":"MAPA 098 - Malwares e ataques virtuais","tema":"Malwares e ataques virtuais","subtema":"Trojan","dificuldade":"intermediaria","enunciado":"Em uma situação de uso cotidiano de um computador, um trojan, ou cavalo de Troia, é um malware que:","alternativas":{"A":"se apresenta como legítimo ou útil para induzir sua execução e realizar ações maliciosas","B":"é exclusivamente um protocolo web","C":"sempre se replica autonomamente como um worm","D":"protege arquivos por criptografia legítima"},"gabarito":"A","comentario":"Gabarito: A. Trojans enganam o usuário quanto à sua finalidade; não precisam ter autopropagação. A alternativa A expressa corretamente o conceito avaliado. A alternativa B está incorreta porque 'é exclusivamente um protocolo web' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'sempre se replica autonomamente como um worm' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'protege arquivos por criptografia legítima' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Malware — trojan","tags":["informatica","mapa_098","trojan"]},{"id":"INF174","area":"Noções de Informática","mapa":"MAPA 098 - Malwares e ataques virtuais","tema":"Malwares e ataques virtuais","subtema":"Ransomware","dificuldade":"intermediaria","enunciado":"Durante a execução de uma tarefa administrativa, ransomware é uma ameaça que normalmente:","alternativas":{"A":"melhora a velocidade do computador","B":"bloqueia ou criptografa dados/sistemas e exige pagamento ou outra condição para liberação","C":"é um mecanismo legítimo de backup","D":"atua apenas como filtro de spam"},"gabarito":"B","comentario":"Gabarito: B. Ransomware busca extorsão, frequentemente por criptografia de arquivos ou bloqueio de sistemas. A alternativa B expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'melhora a velocidade do computador' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'é um mecanismo legítimo de backup' não corresponde à função ou ao conceito exigido no enunciado. A alternativa D está incorreta porque 'atua apenas como filtro de spam' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Malware — ransomware","tags":["informatica","mapa_098","ransomware"]},{"id":"INF175","area":"Noções de Informática","mapa":"MAPA 098 - Malwares e ataques virtuais","tema":"Malwares e ataques virtuais","subtema":"Phishing","dificuldade":"intermediaria","enunciado":"Considere um usuário que precisa realizar uma atividade sem alterar configurações desnecessárias. phishing é uma técnica que busca:","alternativas":{"A":"desfragmentar discos","B":"compactar arquivos","C":"atualizar certificados automaticamente","D":"enganar a vítima para obter credenciais, dados ou ações por meio de mensagens ou páginas fraudulentas"},"gabarito":"D","comentario":"Gabarito: D. Phishing é engenharia social, geralmente imitando entidades confiáveis para induzir cliques, credenciais ou pagamentos. A alternativa D expressa corretamente o conceito avaliado. A alternativa A está incorreta porque 'desfragmentar discos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa B está incorreta porque 'compactar arquivos' não corresponde à função ou ao conceito exigido no enunciado. A alternativa C está incorreta porque 'atualizar certificados automaticamente' não corresponde à função ou ao conceito exigido no enunciado.","referencia":"Ataques virtuais — phishing","tags":["informatica","mapa_098","phishing"]}],"raciocinio":[{"id":"RAC001","area":"Raciocínio Lógico","tema":"MAPA 047 - Estruturas lógicas e relações entre pessoas, lugares, objetos e eventos","subtema":"Ordenação linear com múltiplas restrições","dificuldade":"dificil","enunciado":"Quatro servidores — Ana, Bruno, Caio e Denise — ocupam, da esquerda para a direita, quatro cadeiras consecutivas. Sabe-se que Ana não ocupa uma extremidade; Bruno está imediatamente à esquerda de Denise; Caio ocupa uma extremidade; e Ana está à esquerda de Bruno. Qual é a ordem correta, da esquerda para a direita?","alternativas":{"A":"Ana, Caio, Bruno, Denise","B":"Caio, Ana, Bruno, Denise","C":"Caio, Bruno, Ana, Denise","D":"Denise, Bruno, Ana, Caio"},"gabarito":"B","comentario":"Como Bruno deve ficar imediatamente à esquerda de Denise, o bloco BD ocupa duas posições consecutivas. Ana precisa estar à esquerda de Bruno e não pode estar numa extremidade. Se Caio ocupasse a extremidade direita, sobrariam as três primeiras posições para Ana e o bloco BD, mas Ana teria de ficar na primeira posição, o que é proibido. Logo, Caio fica na extrema esquerda. Restam as posições 2, 3 e 4, que só podem ser Ana, Bruno e Denise, nessa ordem.","referencia":"Ordenação linear; adjacência; restrições posicionais","tags":["raciocinio_logico","ordenacao_logica"]},{"id":"RAC002","area":"Raciocínio Lógico","tema":"MAPA 047 - Estruturas lógicas e relações entre pessoas, lugares, objetos e eventos","subtema":"Associação pessoa-lugar-objeto","dificuldade":"intermediaria","enunciado":"Lucas, Marina e Rafael viajaram, cada um, para uma cidade diferente entre João Pessoa, Recife e Natal e levaram, cada um, um item diferente entre câmera, mochila e violão. Sabe-se que Marina não foi a Recife nem levou o violão; quem foi a Natal levou a câmera; Rafael foi a Recife e não levou o violão; e Lucas não levou a mochila. O que Lucas levou?","alternativas":{"A":"câmera","B":"mochila","C":"não é possível determinar","D":"violão"},"gabarito":"D","comentario":"Rafael foi a Recife e não levou violão. Marina não foi a Recife, então Marina e Lucas ficaram com João Pessoa e Natal. Se Lucas fosse a Natal, levaria a câmera; como Marina não leva violão, ela teria de levar a mochila, restando o violão para Rafael, contrariando a condição dada. Logo, Marina foi a Natal e levou a câmera. Lucas ficou em João Pessoa. Como Lucas não leva mochila e a câmera já é de Marina, Lucas necessariamente levou o violão.","referencia":"Associação lógica entre categorias","tags":["raciocinio_logico","associacao_logica"]},{"id":"RAC003","area":"Raciocínio Lógico","tema":"MAPA 047 - Estruturas lógicas e relações entre pessoas, lugares, objetos e eventos","subtema":"Relação de precedência em classificação","dificuldade":"intermediaria","enunciado":"Em uma corrida com cinco participantes — Iara, João, Kelly, Luís e Marta — não houve empates. João chegou depois de Iara e antes de Marta. Kelly chegou antes de Luís. Marta chegou antes de Kelly. Quem necessariamente chegou em primeiro lugar?","alternativas":{"A":"João","B":"Kelly","C":"Marta","D":"Iara"},"gabarito":"D","comentario":"As relações fornecem a cadeia Iara < João < Marta < Kelly < Luís, em que '<' significa 'chegou antes de'. Como todos os cinco participantes aparecem na mesma cadeia e não houve empate, Iara é necessariamente a primeira colocada.","referencia":"Relações de ordem e transitividade","tags":["raciocinio_logico","relacoes_de_ordem"]},{"id":"RAC004","area":"Raciocínio Lógico","tema":"MAPA 047 - Estruturas lógicas e relações entre pessoas, lugares, objetos e eventos","subtema":"Agenda e relação temporal","dificuldade":"intermediaria","enunciado":"Uma equipe realizará quatro atividades — P, Q, R e S — em quatro horários consecutivos: 8h, 9h, 10h e 11h, uma atividade por horário. P ocorre antes de R; Q ocorre imediatamente depois de P; S não ocorre às 11h; e R não ocorre às 8h nem às 9h. Em que horário ocorre R?","alternativas":{"A":"8h","B":"9h","C":"11h","D":"10h"},"gabarito":"C","comentario":"Como Q ocorre imediatamente depois de P, P-Q forma um bloco. R ocorre depois de P e não pode ser 8h nem 9h. Se R fosse 10h, o bloco P-Q teria de ocupar 8h-9h, deixando S às 11h, o que é proibido. Portanto R só pode ocorrer às 11h.","referencia":"Ordenação temporal com adjacência","tags":["raciocinio_logico","agenda_logica"]},{"id":"RAC005","area":"Raciocínio Lógico","tema":"MAPA 047 - Estruturas lógicas e relações entre pessoas, lugares, objetos e eventos","subtema":"Relação entre recipientes e cores","dificuldade":"facil","enunciado":"Há três caixas, numeradas 1, 2 e 3. Uma é azul, uma é verde e uma é amarela. Sabe-se que a caixa 1 não é azul; a caixa verde tem número maior que o da caixa amarela; e a caixa 3 não é verde. Qual é a cor da caixa 2?","alternativas":{"A":"azul","B":"amarela","C":"verde","D":"não é possível determinar"},"gabarito":"C","comentario":"A caixa verde deve ter número maior que o da amarela. Como a caixa 3 não é verde, a verde não pode ser 3. Ela também não pode ser 1, pois não haveria número menor para a amarela. Logo, a caixa 2 é verde. Consequentemente, a caixa 1 é amarela e a caixa 3 é azul.","referencia":"Associação por desigualdade ordinal","tags":["raciocinio_logico","classificacao_e_relacoes"]},{"id":"RAC006","area":"Raciocínio Lógico","tema":"MAPA 047 - Estruturas lógicas e relações entre pessoas, lugares, objetos e eventos","subtema":"Posicionamento circular","dificuldade":"intermediaria","enunciado":"Quatro amigos — Aline, Beto, Ciro e Dora — sentam-se ao redor de uma mesa redonda, voltados para o centro. Aline está em frente a Ciro. Beto não está à direita imediata de Aline. Quem está à direita imediata de Aline?","alternativas":{"A":"Beto","B":"Ciro","C":"não é possível determinar","D":"Dora"},"gabarito":"D","comentario":"Em uma mesa com quatro lugares, se Aline está em frente a Ciro, os dois lugares restantes, à direita e à esquerda de Aline, são ocupados por Beto e Dora. Como Beto não está à direita imediata de Aline, esse lugar só pode ser de Dora.","referencia":"Posicionamento circular e oposição","tags":["raciocinio_logico","disposicao_circular"]},{"id":"RAC007","area":"Raciocínio Lógico","tema":"MAPA 048 - Dedução de informações a partir de relações lógicas","subtema":"Implicação e contraposição","dificuldade":"intermediaria","enunciado":"Considere as regras: 'Se o relatório foi aprovado, então foi assinado' e 'Se foi assinado, então foi arquivado'. Sabe-se que determinado relatório não foi arquivado. O que se pode concluir necessariamente?","alternativas":{"A":"O relatório não foi aprovado.","B":"O relatório foi aprovado, mas não assinado.","C":"O relatório foi assinado.","D":"Nada pode ser concluído sobre a aprovação."},"gabarito":"A","comentario":"Das regras temos: aprovado → assinado → arquivado. Pela contraposição da segunda, não arquivado → não assinado. Pela contraposição da primeira, não assinado → não aprovado. Portanto, se o relatório não foi arquivado, ele necessariamente não foi aprovado.","referencia":"Implicação lógica; transitividade; contraposição","tags":["raciocinio_logico","deducao_condicional"]},{"id":"RAC008","area":"Raciocínio Lógico","tema":"MAPA 048 - Dedução de informações a partir de relações lógicas","subtema":"Dedução em relação de inclusão","dificuldade":"facil","enunciado":"Todo membro do grupo X participa do treinamento. Nenhuma pessoa que participa do treinamento está dispensada da avaliação. Paulo pertence ao grupo X. Qual afirmação é necessariamente verdadeira?","alternativas":{"A":"Paulo está dispensado da avaliação.","B":"Paulo pode ou não participar do treinamento.","C":"Paulo não está dispensado da avaliação.","D":"Paulo não pertence ao grupo X."},"gabarito":"C","comentario":"Paulo pertence a X, e todo integrante de X participa do treinamento. Logo, Paulo participa do treinamento. Como ninguém que participa do treinamento está dispensado da avaliação, Paulo não está dispensado.","referencia":"Inclusão de classes e silogismo categórico","tags":["raciocinio_logico","deducao_por_inclusao"]},{"id":"RAC009","area":"Raciocínio Lógico","tema":"MAPA 048 - Dedução de informações a partir de relações lógicas","subtema":"Análise de declarações verdadeiras e falsas","dificuldade":"facil","enunciado":"Três pessoas — Eva, Fábio e Gina — fizeram as seguintes afirmações sobre quem levou uma chave. Eva: 'Eu levei a chave.' Fábio: 'Eva não levou a chave.' Gina: 'Fábio não levou a chave.' Sabe-se que exatamente uma das três afirmações é verdadeira e que exatamente uma pessoa levou a chave. Quem levou a chave?","alternativas":{"A":"Eva","B":"Fábio","C":"Gina","D":"não é possível determinar"},"gabarito":"B","comentario":"Se Eva tivesse levado, as falas seriam: verdadeira, falsa, verdadeira — duas verdadeiras. Se Fábio tivesse levado: falsa, verdadeira, falsa — exatamente uma verdadeira. Se Gina tivesse levado: falsa, verdadeira, verdadeira — duas verdadeiras. Logo, Fábio levou a chave.","referencia":"Valor lógico de proposições e teste de hipóteses","tags":["raciocinio_logico","verdade_e_mentira"]},{"id":"RAC010","area":"Raciocínio Lógico","tema":"MAPA 048 - Dedução de informações a partir de relações lógicas","subtema":"Dedução com cadeia de precedências","dificuldade":"dificil","enunciado":"Cinco tarefas — J, K, L, M e N — são executadas uma vez cada. Sabe-se que J ocorre antes de K; L ocorre depois de K; M ocorre antes de J; e N ocorre depois de L. Qual tarefa necessariamente é a terceira?","alternativas":{"A":"J","B":"L","C":"N","D":"K"},"gabarito":"D","comentario":"As condições formam uma cadeia completa: M antes de J, J antes de K, K antes de L e L antes de N. Assim, a única ordem possível é M-J-K-L-N. A terceira tarefa é K.","referencia":"Transitividade em relações de ordem","tags":["raciocinio_logico","cadeia_de_precedencias"]},{"id":"RAC011","area":"Raciocínio Lógico","tema":"MAPA 048 - Dedução de informações a partir de relações lógicas","subtema":"Condições necessárias e suficientes","dificuldade":"intermediaria","enunciado":"Uma inscrição é validada somente se o candidato anexar documento de identidade e comprovante de pagamento. Além disso, sempre que ambos os documentos são anexados corretamente, a inscrição é validada. A inscrição de Lúcia foi validada. O que se conclui necessariamente?","alternativas":{"A":"Lúcia anexou apenas o documento de identidade.","B":"Lúcia anexou apenas o comprovante de pagamento.","C":"Não é possível saber se Lúcia anexou os documentos.","D":"Lúcia anexou corretamente os dois documentos."},"gabarito":"D","comentario":"'Somente se' indica condição necessária: inscrição validada → identidade e comprovante anexados corretamente. Como a inscrição de Lúcia foi validada, os dois anexos necessariamente foram apresentados corretamente. A segunda regra confirma a equivalência, mas a primeira já basta para a conclusão.","referencia":"Condição necessária; condição suficiente; equivalência","tags":["raciocinio_logico","condicoes_logicas"]},{"id":"RAC012","area":"Raciocínio Lógico","tema":"MAPA 048 - Dedução de informações a partir de relações lógicas","subtema":"Associação dedutiva entre atributos","dificuldade":"dificil","enunciado":"Três projetos — Alfa, Beta e Gama — foram concluídos em meses diferentes: abril, maio e junho. Cada projeto teve um responsável diferente: Nuno, Olga e Pedro. Alfa foi concluído antes de Beta. O projeto de Olga foi concluído em junho. Pedro foi responsável pelo projeto Alfa. Beta não foi concluído em junho. Quem foi responsável pelo projeto Beta?","alternativas":{"A":"Nuno","B":"Olga","C":"Pedro","D":"não é possível determinar"},"gabarito":"A","comentario":"Olga responde pelo projeto concluído em junho. Como Beta não foi concluído em junho e Alfa ocorre antes de Beta, Alfa e Beta precisam ocupar abril e maio, respectivamente; portanto Gama é o projeto de junho e é de Olga. Pedro é responsável por Alfa. Sobra Nuno como responsável por Beta.","referencia":"Dedução por eliminação em tabela lógica","tags":["raciocinio_logico","associacao_dedutiva"]},{"id":"RAC013","area":"Raciocínio Lógico","tema":"MAPA 049 - Avaliação de condições e restrições em estruturas lógicas","subtema":"Seleção de equipe sob restrições","dificuldade":"intermediaria","enunciado":"Uma equipe de três pessoas será formada entre Ana, Bia, Caio, Davi e Enzo. Se Ana participar, Bia não pode participar. Caio só participa se Davi também participar. Enzo deve participar. Qual das equipes abaixo satisfaz todas as condições?","alternativas":{"A":"Ana, Bia e Enzo","B":"Ana, Caio e Enzo","C":"Bia, Caio e Enzo","D":"Bia, Davi e Enzo"},"gabarito":"D","comentario":"Enzo deve estar na equipe. A opção com Ana e Bia viola a incompatibilidade. A opção com Ana e Caio viola a regra de Caio, pois Davi não está presente. A opção com Bia e Caio também viola a regra de Caio. Bia, Davi e Enzo satisfaz todas as condições.","referencia":"Restrições de seleção; implicação; incompatibilidade","tags":["raciocinio_logico","restricoes_de_selecao"]},{"id":"RAC014","area":"Raciocínio Lógico","tema":"MAPA 049 - Avaliação de condições e restrições em estruturas lógicas","subtema":"Escolha de rota com condição obrigatória","dificuldade":"facil","enunciado":"Um veículo precisa ir de P até S passando por exatamente duas cidades intermediárias, escolhidas entre Q, R e T, sem repetir cidade. Se passar por Q, deve passar também por R. Se passar por T, não pode passar por Q. Qual sequência é permitida?","alternativas":{"A":"P-Q-T-S","B":"P-T-Q-S","C":"P-R-T-S","D":"P-Q-S"},"gabarito":"C","comentario":"Como a rota deve ter exatamente duas cidades intermediárias, P-Q-S nem atende ao formato. P-Q-T-S viola a regra de que, ao passar por Q, também deve passar por R. P-T-Q-S viola tanto a exigência de R associada a Q quanto a incompatibilidade T-Q. P-R-T-S usa duas intermediárias e não viola nenhuma condição.","referencia":"Compatibilidade e restrições condicionais","tags":["raciocinio_logico","restricoes_de_rota"]},{"id":"RAC015","area":"Raciocínio Lógico","tema":"MAPA 049 - Avaliação de condições e restrições em estruturas lógicas","subtema":"Alocação em dias com restrições","dificuldade":"facil","enunciado":"Quatro reuniões — A, B, C e D — serão marcadas de segunda a quinta, uma por dia. A deve ocorrer antes de B. C não pode ocorrer na segunda. D deve ocorrer imediatamente antes de C. Qual agenda é possível?","alternativas":{"A":"D na segunda, C na terça, B na quarta, A na quinta","B":"A na segunda, B na terça, C na quarta, D na quinta","C":"A na segunda, D na terça, C na quarta, B na quinta","D":"B na segunda, D na terça, C na quarta, A na quinta"},"gabarito":"C","comentario":"A opção correta mantém A antes de B e o bloco D-C em dias consecutivos, com C fora da segunda. Na primeira alternativa, A aparece depois de B; na segunda, D não está imediatamente antes de C; na quarta, A aparece depois de B.","referencia":"Restrições de agenda; precedência; adjacência","tags":["raciocinio_logico","restricoes_temporais"]},{"id":"RAC016","area":"Raciocínio Lógico","tema":"MAPA 049 - Avaliação de condições e restrições em estruturas lógicas","subtema":"Construção de código numérico","dificuldade":"intermediaria","enunciado":"Um código possui três algarismos distintos escolhidos entre 1, 2, 3 e 4. O primeiro algarismo é par. O segundo é maior que o primeiro. O terceiro é menor que o segundo. A soma dos três algarismos é 9. Qual é o código?","alternativas":{"A":"234","B":"214","C":"243","D":"423"},"gabarito":"C","comentario":"O primeiro algarismo deve ser par. Se fosse 4, não existiria algarismo maior para a segunda posição; então o primeiro é 2. Para somar 9 com algarismos distintos, os outros dois devem ser 3 e 4. Como o segundo é maior que o primeiro e o terceiro deve ser menor que o segundo, a ordem dos dois últimos só pode ser 4 e 3. Logo, o código é 243.","referencia":"Restrições numéricas e análise de possibilidades","tags":["raciocinio_logico","codigo_logico"]},{"id":"RAC017","area":"Raciocínio Lógico","tema":"MAPA 049 - Avaliação de condições e restrições em estruturas lógicas","subtema":"Distribuição de tarefas","dificuldade":"facil","enunciado":"Três tarefas — X, Y e Z — devem ser distribuídas entre Lia, Mauro e Nara, uma tarefa para cada pessoa. Lia não pode receber X. Mauro não pode receber Z. Nara deve receber X ou Z. Se Lia receber Z, quem recebe Y?","alternativas":{"A":"Lia","B":"Mauro","C":"Nara","D":"não é possível determinar"},"gabarito":"B","comentario":"Se Lia recebe Z, Nara não pode receber Z e, pela condição, deve receber X. Como cada pessoa recebe uma única tarefa, sobra Y para Mauro. A distribuição fica Lia-Z, Nara-X e Mauro-Y.","referencia":"Alocação por exclusão e condição disjuntiva","tags":["raciocinio_logico","distribuicao_de_tarefas"]},{"id":"RAC018","area":"Raciocínio Lógico","tema":"MAPA 049 - Avaliação de condições e restrições em estruturas lógicas","subtema":"Assentos com proibições","dificuldade":"facil","enunciado":"Em uma fileira de quatro lugares, devem sentar-se P, Q, R e S. P não pode sentar nas extremidades. Q deve sentar à esquerda de R. P deve sentar imediatamente à esquerda de Q. S deve ocupar uma extremidade. Qual arranjo é possível?","alternativas":{"A":"S, P, Q, R","B":"P, Q, R, S","C":"Q, R, P, S","D":"R, P, Q, S"},"gabarito":"A","comentario":"Como P deve ficar imediatamente à esquerda de Q e P não pode estar em uma extremidade, o bloco P-Q só pode ocupar as posições 2-3; se ocupasse 1-2, P estaria na extremidade. Assim, S e R ocupam as extremidades. Como Q deve estar à esquerda de R, R fica na posição 4 e S na posição 1. A ordem é S-P-Q-R.","referencia":"Restrições posicionais","tags":["raciocinio_logico","assentos_com_restricoes"]},{"id":"RAC019","area":"Raciocínio Lógico","tema":"MAPA 050 - Análise lógica de situações-problema","subtema":"Identificação por pesagem","dificuldade":"intermediaria","enunciado":"Há três sacos visualmente iguais. Um contém apenas moedas de 9 g e os outros dois contêm apenas moedas de 10 g. Retira-se uma moeda de cada saco e pesa-se o conjunto, obtendo-se 29 g. O que se pode concluir?","alternativas":{"A":"Exatamente um dos três sacos contém moedas de 9 g, mas a pesagem não identifica qual deles.","B":"Os três sacos contêm moedas de 10 g.","C":"Dois sacos contêm moedas de 9 g.","D":"É possível identificar qual saco contém moedas de 9 g apenas com essa pesagem."},"gabarito":"A","comentario":"Três moedas de 10 g pesariam 30 g. O total de 29 g mostra que, entre as três moedas retiradas, exatamente uma pesa 9 g e duas pesam 10 g. Isso confirma que exatamente um saco é o diferente, mas como foi retirada a mesma quantidade de cada saco, a pesagem conjunta não informa de qual saco veio a moeda de 9 g.","referencia":"Análise de informação e suficiência de dados","tags":["raciocinio_logico","situacao_problema"]},{"id":"RAC020","area":"Raciocínio Lógico","tema":"MAPA 050 - Análise lógica de situações-problema","subtema":"Problema de balança e diferença de pesos","dificuldade":"intermediaria","enunciado":"Uma caixa fechada pesa o mesmo que duas latas mais 1 kg. Duas caixas fechadas pesam o mesmo que cinco latas. Se todas as caixas têm o mesmo peso e todas as latas também, quanto pesa uma lata?","alternativas":{"A":"1 kg","B":"2 kg","C":"3 kg","D":"4 kg"},"gabarito":"B","comentario":"Se C é o peso de uma caixa e L o de uma lata, temos C = 2L + 1. Também 2C = 5L. Substituindo: 2(2L + 1) = 5L, então 4L + 2 = 5L, logo L = 2 kg.","referencia":"Sistema de equações lineares em situação-problema","tags":["raciocinio_logico","equacoes_logicas"]},{"id":"RAC021","area":"Raciocínio Lógico","tema":"MAPA 050 - Análise lógica de situações-problema","subtema":"Travessia com restrição de capacidade","dificuldade":"intermediaria","enunciado":"Uma ponte suporta no máximo 115 kg por vez. Três pessoas pesam 50 kg, 60 kg e 70 kg. Cada travessia pode ser feita por uma ou duas pessoas. Qual par pode atravessar junto sem ultrapassar o limite?","alternativas":{"A":"50 kg e 70 kg","B":"60 kg e 70 kg","C":"50 kg e 60 kg","D":"Nenhum par"},"gabarito":"C","comentario":"Somamos os pesos: 50 + 60 = 110 kg, dentro do limite de 115 kg; 50 + 70 = 120 kg, acima; 60 + 70 = 130 kg, acima. Logo, somente o par de 50 kg e 60 kg pode atravessar junto.","referencia":"Verificação de restrições quantitativas","tags":["raciocinio_logico","capacidade_e_restricoes"]},{"id":"RAC022","area":"Raciocínio Lógico","tema":"MAPA 050 - Análise lógica de situações-problema","subtema":"Distribuição de estoque com relações proporcionais","dificuldade":"dificil","enunciado":"Um almoxarifado possui caixas de três tipos: A, B e C. Há 8 caixas a mais do tipo B do que do tipo A. O número de caixas do tipo C é o dobro do número de caixas do tipo A. Ao todo são 68 caixas. Quantas são do tipo B?","alternativas":{"A":"15","B":"23","C":"30","D":"38"},"gabarito":"B","comentario":"Se A = x, então B = x + 8 e C = 2x. Logo, x + (x + 8) + 2x = 68, isto é, 4x + 8 = 68. Assim, 4x = 60 e x = 15. Portanto B = 15 + 8 = 23.","referencia":"Modelagem algébrica de relações quantitativas","tags":["raciocinio_logico","modelagem_logica"]},{"id":"RAC023","area":"Raciocínio Lógico","tema":"MAPA 050 - Análise lógica de situações-problema","subtema":"Pontuação em competição","dificuldade":"intermediaria","enunciado":"Em um torneio, uma vitória vale 3 pontos, um empate vale 1 ponto e uma derrota vale 0. Uma equipe disputou 8 partidas, não perdeu nenhuma e terminou com 18 pontos. Quantas vitórias obteve?","alternativas":{"A":"4","B":"6","C":"5","D":"7"},"gabarito":"C","comentario":"Se v é o número de vitórias, então houve 8 - v empates. A pontuação foi 3v + (8 - v) = 18. Assim, 2v + 8 = 18, logo 2v = 10 e v = 5. Portanto foram 5 vitórias e 3 empates.","referencia":"Equação inteira em sistema de pontuação","tags":["raciocinio_logico","pontuacao_logica"]},{"id":"RAC024","area":"Raciocínio Lógico","tema":"MAPA 050 - Análise lógica de situações-problema","subtema":"Contagem sob condição","dificuldade":"facil","enunciado":"Um painel possui quatro botões distintos: P, Q, R e S. Para ativar uma função, exatamente dois botões devem ser pressionados ao mesmo tempo. P e Q não podem ser pressionados juntos. Quantos pares diferentes podem ativar a função?","alternativas":{"A":"3","B":"4","C":"6","D":"5"},"gabarito":"D","comentario":"Sem restrição, o número de pares de 4 botões é C(4,2) = 6. O único par proibido é P-Q. Portanto restam 6 - 1 = 5 pares permitidos.","referencia":"Combinação simples com exclusão","tags":["raciocinio_logico","contagem_com_restricao"]},{"id":"RAC025","area":"Raciocínio Lógico","tema":"MAPA 051 - Raciocínio verbal","subtema":"Analogia funcional","dificuldade":"facil","enunciado":"Complete a relação de modo logicamente equivalente: 'termômetro está para temperatura assim como balança está para ____'.","alternativas":{"A":"comprimento","B":"tempo","C":"volume","D":"massa"},"gabarito":"D","comentario":"O termômetro é instrumento utilizado para medir temperatura. De forma análoga, a balança é instrumento utilizado para medir massa. A relação é instrumento → grandeza medida.","referencia":"Analogia por relação funcional","tags":["raciocinio_logico","analogia_verbal"]},{"id":"RAC026","area":"Raciocínio Lógico","tema":"MAPA 051 - Raciocínio verbal","subtema":"Inferência textual","dificuldade":"facil","enunciado":"Considere: 'Todos os relatórios urgentes recebem prioridade de análise. Alguns relatórios do setor X são urgentes.' Qual conclusão decorre necessariamente dessas informações?","alternativas":{"A":"Alguns relatórios do setor X recebem prioridade de análise.","B":"Todos os relatórios do setor X recebem prioridade de análise.","C":"Nenhum relatório do setor X recebe prioridade de análise.","D":"Somente relatórios do setor X recebem prioridade de análise."},"gabarito":"A","comentario":"Se alguns relatórios do setor X são urgentes e todo relatório urgente recebe prioridade, então esses relatórios do setor X que são urgentes necessariamente recebem prioridade. Não há base para generalizar a prioridade a todos os relatórios do setor X.","referencia":"Silogismo verbal e quantificadores","tags":["raciocinio_logico","inferencia_verbal"]},{"id":"RAC027","area":"Raciocínio Lógico","tema":"MAPA 051 - Raciocínio verbal","subtema":"Condição necessária em linguagem natural","dificuldade":"dificil","enunciado":"Uma norma interna estabelece: 'Para ter acesso à sala segura, é indispensável possuir crachá ativo.' A partir dessa frase, qual afirmação é logicamente correta?","alternativas":{"A":"Possuir crachá ativo garante, por si só, o acesso à sala segura.","B":"Quem não acessou a sala segura certamente não possuía crachá ativo.","C":"Ter crachá ativo e acessar a sala segura são condições equivalentes.","D":"Se alguém acessou a sala segura, então possuía crachá ativo."},"gabarito":"D","comentario":"'É indispensável possuir crachá ativo' significa que o crachá ativo é condição necessária para o acesso. Portanto acesso → crachá ativo. Isso não significa que o crachá, sozinho, seja suficiente para garantir o acesso.","referencia":"Condições necessária e suficiente em linguagem verbal","tags":["raciocinio_logico","condicao_necessaria"]},{"id":"RAC028","area":"Raciocínio Lógico","tema":"MAPA 051 - Raciocínio verbal","subtema":"Ordenação por pistas verbais","dificuldade":"intermediaria","enunciado":"Em uma estante, os livros Azul, Branco, Cinza e Dourado estão em posições consecutivas da esquerda para a direita. O Azul está à esquerda do Branco. O Cinza está à direita do Branco. O Dourado está à esquerda do Azul. Qual livro ocupa a terceira posição?","alternativas":{"A":"Azul","B":"Cinza","C":"Dourado","D":"Branco"},"gabarito":"D","comentario":"As pistas formam uma cadeia completa: Dourado está à esquerda de Azul, que está à esquerda de Branco, que está à esquerda de Cinza. Logo, a ordem é Dourado, Azul, Branco, Cinza. O terceiro é Branco.","referencia":"Compreensão de relações espaciais expressas verbalmente","tags":["raciocinio_logico","ordenacao_verbal"]},{"id":"RAC029","area":"Raciocínio Lógico","tema":"MAPA 051 - Raciocínio verbal","subtema":"Silogismo com quantificadores","dificuldade":"dificil","enunciado":"Considere as afirmações: I. Todo pesquisador do grupo A domina estatística. II. Nenhuma pessoa que domina estatística desconhece planilhas. III. Alguns integrantes do grupo A são pesquisadores. Qual conclusão é necessariamente verdadeira?","alternativas":{"A":"Todo integrante do grupo A é pesquisador.","B":"Alguns integrantes do grupo A não desconhecem planilhas.","C":"Alguns pesquisadores desconhecem planilhas.","D":"Nenhum integrante do grupo A domina estatística."},"gabarito":"B","comentario":"Pela afirmação III, existem integrantes do grupo A que são pesquisadores. Pela I, esses pesquisadores dominam estatística. Pela II, quem domina estatística não desconhece planilhas. Logo, ao menos alguns integrantes do grupo A não desconhecem planilhas.","referencia":"Silogismo categórico com existência","tags":["raciocinio_logico","silogismo_verbal"]},{"id":"RAC030","area":"Raciocínio Lógico","tema":"MAPA 052 - Raciocínio matemático","subtema":"Taxas combinadas em etapas","dificuldade":"dificil","enunciado":"Uma equipe A processa 18 formulários em 30 minutos e uma equipe B processa 24 formulários em 40 minutos, ambas em ritmo constante. As duas trabalham juntas por 50 minutos; depois, A encerra o trabalho e B continua sozinha por mais 30 minutos. Quantos formulários são processados ao todo?","alternativas":{"A":"60","B":"78","C":"72","D":"84"},"gabarito":"B","comentario":"A taxa de A é 18/30 = 0,6 formulário por minuto. A taxa de B é 24/40 = 0,6 formulário por minuto. Juntas, produzem 1,2 por minuto; em 50 minutos, fazem 60. Depois, B trabalha 30 minutos e faz 0,6×30=18. Total: 60+18=78.","referencia":"Razão; taxa de trabalho; princípio aditivo","tags":["raciocinio_logico","taxas_combinadas"]},{"id":"RAC031","area":"Raciocínio Lógico","tema":"MAPA 052 - Raciocínio matemático","subtema":"Taxa conjunta de trabalho","dificuldade":"intermediaria","enunciado":"Uma máquina A executa um lote em 6 horas e uma máquina B executa o mesmo lote em 3 horas, trabalhando sozinhas e em ritmo constante. Se funcionarem juntas, em quanto tempo executam um lote?","alternativas":{"A":"2 horas","B":"1 hora","C":"2 horas e 30 minutos","D":"4 horas"},"gabarito":"A","comentario":"A taxa de A é 1/6 do lote por hora e a de B é 1/3. Juntas: 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2 lote por hora. Para completar 1 lote, precisam de 2 horas.","referencia":"Soma de taxas de trabalho","tags":["raciocinio_logico","taxa_de_trabalho"]},{"id":"RAC032","area":"Raciocínio Lógico","tema":"MAPA 052 - Raciocínio matemático","subtema":"Média aritmética com alteração de valor","dificuldade":"intermediaria","enunciado":"A média de cinco números é 24. Se um dos números, igual a 18, for substituído por 33, qual será a nova média?","alternativas":{"A":"25","B":"26","C":"30","D":"27"},"gabarito":"D","comentario":"A soma original é 5 × 24 = 120. A substituição aumenta a soma em 33 - 18 = 15, levando-a a 135. A nova média é 135/5 = 27.","referencia":"Média aritmética e variação da soma","tags":["raciocinio_logico","media_aritmetica"]},{"id":"RAC033","area":"Raciocínio Lógico","tema":"MAPA 052 - Raciocínio matemático","subtema":"Percentuais simétricos e equação quadrática","dificuldade":"dificil","enunciado":"Um valor sofre uma redução de x% e, em seguida, um aumento de x% sobre o valor já reduzido. Ao final, o valor fica 9% menor que o inicial. Qual é o valor de x?","alternativas":{"A":"10%","B":"30%","C":"20%","D":"40%"},"gabarito":"B","comentario":"Se x é escrito na forma decimal, o fator total é (1−x)(1+x)=1−x². Como o valor final é 9% menor, o fator é 0,91. Então 1−x²=0,91, logo x²=0,09 e x=0,30, pois percentual é positivo. Portanto x=30%.","referencia":"Porcentagens sucessivas; identidade algébrica","tags":["raciocinio_logico","porcentagem_avancada"]},{"id":"RAC034","area":"Raciocínio Lógico","tema":"MAPA 052 - Raciocínio matemático","subtema":"Equação com números inteiros","dificuldade":"facil","enunciado":"A soma de três números inteiros consecutivos é 96. Qual é o maior deles?","alternativas":{"A":"31","B":"32","C":"33","D":"34"},"gabarito":"C","comentario":"Se os números são n - 1, n e n + 1, a soma é 3n = 96, então n = 32. Os números são 31, 32 e 33. O maior é 33.","referencia":"Equação linear; inteiros consecutivos","tags":["raciocinio_logico","numeros_inteiros"]},{"id":"RAC035","area":"Raciocínio Lógico","tema":"MAPA 052 - Raciocínio matemático","subtema":"Contagem de possibilidades","dificuldade":"facil","enunciado":"Uma senha é formada por dois algarismos distintos escolhidos entre 1, 2, 3, 4 e 5, e a ordem importa. Quantas senhas diferentes podem ser formadas?","alternativas":{"A":"20","B":"10","C":"15","D":"25"},"gabarito":"A","comentario":"Há 5 escolhas para o primeiro algarismo. Como não pode haver repetição, restam 4 para o segundo. Pelo princípio multiplicativo, 5 × 4 = 20 senhas.","referencia":"Princípio fundamental da contagem; arranjo simples","tags":["raciocinio_logico","contagem"]},{"id":"RAC036","area":"Raciocínio Lógico","tema":"MAPA 053 - Raciocínio sequencial","subtema":"Sequência por diferenças crescentes","dificuldade":"intermediaria","enunciado":"Observe a sequência: 4, 7, 13, 22, 34, __. Qual é o próximo termo?","alternativas":{"A":"49","B":"46","C":"47","D":"52"},"gabarito":"A","comentario":"As diferenças são +3, +6, +9 e +12. Elas crescem de 3 em 3. A próxima diferença é +15. Assim, 34 + 15 = 49.","referencia":"Sequências numéricas por diferenças","tags":["raciocinio_logico","sequencia_numerica"]},{"id":"RAC037","area":"Raciocínio Lógico","tema":"MAPA 053 - Raciocínio sequencial","subtema":"Sequência alternada","dificuldade":"intermediaria","enunciado":"Observe a sequência: 2, 6, 5, 15, 14, 42, 41, __. Qual é o próximo termo?","alternativas":{"A":"82","B":"122","C":"123","D":"126"},"gabarito":"C","comentario":"A regra alterna multiplicar por 3 e subtrair 1: 2×3=6; 6−1=5; 5×3=15; 15−1=14; 14×3=42; 42−1=41. Portanto, 41×3=123.","referencia":"Sequência com operações alternadas","tags":["raciocinio_logico","sequencia_alternada"]},{"id":"RAC038","area":"Raciocínio Lógico","tema":"MAPA 053 - Raciocínio sequencial","subtema":"Sequência recursiva de dois termos","dificuldade":"dificil","enunciado":"Uma sequência é definida por a1 = 2, a2 = 3 e, para n ≥ 3, an = a(n-1) + 2·a(n-2). Qual é o sexto termo?","alternativas":{"A":"53","B":"27","C":"35","D":"51"},"gabarito":"A","comentario":"Calculando termo a termo: a3 = 3 + 2×2 = 7; a4 = 7 + 2×3 = 13; a5 = 13 + 2×7 = 27; a6 = 27 + 2×13 = 53. Logo, o sexto termo é 53.","referencia":"Recorrência linear","tags":["raciocinio_logico","sequencia_recursiva"]},{"id":"RAC039","area":"Raciocínio Lógico","tema":"MAPA 053 - Raciocínio sequencial","subtema":"Sequência por padrão quadrático","dificuldade":"facil","enunciado":"Observe a sequência: 3, 6, 11, 18, 27, __. Qual é o próximo termo?","alternativas":{"A":"38","B":"36","C":"39","D":"42"},"gabarito":"A","comentario":"As diferenças são 3, 5, 7 e 9, isto é, números ímpares consecutivos. A próxima diferença é 11. Portanto, 27 + 11 = 38.","referencia":"Sequências por diferenças de segunda ordem","tags":["raciocinio_logico","sequencia_quadratica"]},{"id":"RAC040","area":"Raciocínio Lógico","tema":"MAPA 053 - Raciocínio sequencial","subtema":"Sequência com duplicação e incremento","dificuldade":"intermediaria","enunciado":"Observe a sequência: 1, 3, 7, 15, 31, __. Qual é o próximo termo?","alternativas":{"A":"47","B":"63","C":"62","D":"64"},"gabarito":"B","comentario":"Cada termo é o anterior multiplicado por 2 e acrescido de 1: 1→3, 3→7, 7→15, 15→31. Assim, 31×2 + 1 = 63.","referencia":"Recorrência simples","tags":["raciocinio_logico","recorrencia"]},{"id":"RAC041","area":"Raciocínio Lógico","tema":"MAPA 053 - Raciocínio sequencial","subtema":"Sequência intercalada","dificuldade":"intermediaria","enunciado":"Observe a sequência: 10, 2, 20, 4, 40, 8, 80, __. Qual é o próximo termo?","alternativas":{"A":"12","B":"18","C":"16","D":"160"},"gabarito":"C","comentario":"Há duas subsequências intercaladas. Nas posições ímpares: 10, 20, 40, 80, sempre dobrando. Nas posições pares: 2, 4, 8, __, também dobrando. Logo, o próximo termo é 16.","referencia":"Sequências intercaladas","tags":["raciocinio_logico","sequencia_intercalada"]},{"id":"RAC042","area":"Raciocínio Lógico","tema":"MAPA 054 - Orientação espacial","subtema":"Giros e direção final","dificuldade":"intermediaria","enunciado":"Uma pessoa está voltada para o norte. Gira 90° à direita, depois 180° à esquerda e, por fim, 90° à direita. Para qual direção está voltada ao final?","alternativas":{"A":"norte","B":"leste","C":"sul","D":"oeste"},"gabarito":"A","comentario":"Partindo do norte: 90° à direita leva ao leste; 180° à esquerda leva ao oeste; 90° à direita leva novamente ao norte. Portanto, a direção final é norte.","referencia":"Orientação cardinal e rotações","tags":["raciocinio_logico","orientacao_espacial"]},{"id":"RAC043","area":"Raciocínio Lógico","tema":"MAPA 054 - Orientação espacial","subtema":"Deslocamento dependente da orientação","dificuldade":"dificil","enunciado":"Uma pessoa parte do ponto (0,0), voltada para o norte. Caminha 4 unidades para a frente, gira 90° à direita e caminha 3 unidades, gira 90° à esquerda e caminha 2 unidades, gira 180° e caminha 5 unidades. Em qual ponto termina?","alternativas":{"A":"(-3, 1)","B":"(3, 1)","C":"(3, -1)","D":"(-3, -1)"},"gabarito":"B","comentario":"Partindo de (0,0): 4 ao norte leva a (0,4). Após giro à direita, 3 ao leste leva a (3,4). Girando à esquerda, volta a apontar para o norte; mais 2 leva a (3,6). O giro de 180° aponta para o sul; 5 unidades levam a (3,1).","referencia":"Orientação cardinal; rotações; coordenadas","tags":["raciocinio_logico","rota_com_giros"]},{"id":"RAC044","area":"Raciocínio Lógico","tema":"MAPA 054 - Orientação espacial","subtema":"Faces opostas de um cubo","dificuldade":"intermediaria","enunciado":"Em um cubo, as faces opostas formam os pares (A,D), (B,E) e (C,F). Se uma pessoa observa simultaneamente as faces A, B e C em um mesmo vértice, qual face não pode compartilhar aresta com A?","alternativas":{"A":"B","B":"D","C":"C","D":"E"},"gabarito":"B","comentario":"Em um cubo, uma face não compartilha aresta apenas com sua face oposta. Como A é oposta a D, A não pode compartilhar aresta com D. As demais faces B, C, E e F são adjacentes a A.","referencia":"Relações espaciais em sólidos","tags":["raciocinio_logico","cubo"]},{"id":"RAC045","area":"Raciocínio Lógico","tema":"MAPA 054 - Orientação espacial","subtema":"Rota com direções cardeais","dificuldade":"intermediaria","enunciado":"Um ciclista percorre 5 km ao norte, 2 km a leste, 5 km ao sul e 6 km a oeste. Em relação ao ponto de partida, onde ele termina?","alternativas":{"A":"4 km a oeste","B":"4 km a leste","C":"2 km a oeste","D":"6 km a oeste"},"gabarito":"A","comentario":"Os deslocamentos norte e sul se anulam: +5 e -5. No eixo leste-oeste, são +2 km para leste e -6 km para oeste, resultando em -4 km. Portanto, termina 4 km a oeste do ponto inicial.","referencia":"Deslocamento vetorial em direções cardeais","tags":["raciocinio_logico","rota_espacial"]},{"id":"RAC046","area":"Raciocínio Lógico","tema":"MAPA 054 - Orientação espacial","subtema":"Composição de transformações no plano","dificuldade":"dificil","enunciado":"O ponto P=(2,-1) sofre, nesta ordem, três transformações: reflexão em relação ao eixo y; rotação de 90° no sentido anti-horário em torno da origem; e translação pelo vetor (-3,4). Qual é a posição final?","alternativas":{"A":"(2,2)","B":"(-2, 2)","C":"(-4,1)","D":"(1,-2)"},"gabarito":"B","comentario":"Refletindo (2,-1) no eixo y, obtemos (-2,-1). Uma rotação de 90° anti-horária transforma (x,y) em (-y,x), então (-2,-1) vira (1,-2). Somando o vetor (-3,4): (1−3, -2+4)=(-2,2).","referencia":"Reflexão; rotação; translação","tags":["raciocinio_logico","transformacoes_geometricas"]},{"id":"RAC047","area":"Raciocínio Lógico","tema":"MAPA 055 - Orientação temporal","subtema":"Dias da semana","dificuldade":"intermediaria","enunciado":"Se o dia 3 de determinado mês foi uma terça-feira, em que dia da semana caiu o dia 24 do mesmo mês?","alternativas":{"A":"segunda-feira","B":"quarta-feira","C":"terça-feira","D":"quinta-feira"},"gabarito":"C","comentario":"Do dia 3 ao dia 24 decorrem 21 dias. Como 21 é múltiplo de 7, o dia da semana se repete. Logo, o dia 24 também foi terça-feira.","referencia":"Ciclos semanais e congruência módulo 7","tags":["raciocinio_logico","dias_da_semana"]},{"id":"RAC048","area":"Raciocínio Lógico","tema":"MAPA 055 - Orientação temporal","subtema":"Duração de intervalo","dificuldade":"facil","enunciado":"Uma atividade começou às 13h45 e terminou às 16h20. Qual foi sua duração?","alternativas":{"A":"2 horas e 25 minutos","B":"2 horas e 45 minutos","C":"2 horas e 35 minutos","D":"3 horas e 35 minutos"},"gabarito":"C","comentario":"De 13h45 a 15h45 decorrem 2 horas; de 15h45 a 16h20, mais 35 minutos. Total: 2 horas e 35 minutos.","referencia":"Cálculo de intervalos de tempo","tags":["raciocinio_logico","intervalo_temporal"]},{"id":"RAC049","area":"Raciocínio Lógico","tema":"MAPA 055 - Orientação temporal","subtema":"Sincronização de ciclos","dificuldade":"dificil","enunciado":"Três sinais luminosos acendem simultaneamente às 8h. Depois disso, o primeiro acende a cada 18 minutos, o segundo a cada 24 minutos e o terceiro a cada 40 minutos. Em que horário voltarão a acender simultaneamente pela primeira vez?","alternativas":{"A":"11h","B":"12h","C":"14h","D":"13h"},"gabarito":"C","comentario":"O próximo encontro ocorre após o MMC de 18, 24 e 40. Fatorando: 18=2·3², 24=2³·3 e 40=2³·5. O MMC é 2³·3²·5=360 minutos, isto é, 6 horas. Se estavam juntos às 8h, voltarão a coincidir às 14h.","referencia":"Mínimo múltiplo comum aplicado a ciclos temporais","tags":["raciocinio_logico","ciclos_temporais"]},{"id":"RAC050","area":"Raciocínio Lógico","tema":"MAPA 055 - Orientação temporal","subtema":"Leitura de horas com deslocamento","dificuldade":"facil","enunciado":"Um relógio marca 9h50. Que horas serão 135 minutos depois?","alternativas":{"A":"12h05","B":"11h45","C":"12h15","D":"12h25"},"gabarito":"A","comentario":"135 minutos = 2 horas e 15 minutos. Somando 2 horas a 9h50, temos 11h50; somando mais 15 minutos, chegamos a 12h05.","referencia":"Conversão e soma de unidades de tempo","tags":["raciocinio_logico","horarios"]},{"id":"RAC051","area":"Raciocínio Lógico",
