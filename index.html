const UI_SETTINGS_KEY = 'campina-grande-pb-2026-500q-ui-settings';


function sanitizeUiSettings(raw = {}) {
  const clean = {};
  const goal = Number(raw?.dailyGoal);
  if (Number.isInteger(goal) && goal >= 1 && goal <= 500) clean.dailyGoal = goal;
  return clean;
}

function validateBackupPayload(payload) {
  if (!payload || payload.app !== '500 QUESTÕES CAMPINA GRANDE-PB 2026' || payload.backupVersion !== 1 || !payload.database) {
    throw new Error('Backup incompatível com esta versão da plataforma.');
  }
  const db = payload.database;
  if (db.version !== 1 || !db.stores || typeof db.stores !== 'object') throw new Error('Estrutura do backup inválida.');
  const keyPaths = Object.fromEntries(Object.entries(STORES).map(([name, cfg]) => [name, cfg.keyPath]));
  for (const [storeName, keyPath] of Object.entries(keyPaths)) {
    const rows = db.stores[storeName];
    if (!Array.isArray(rows)) throw new Error(`Backup inválido: coleção ${storeName} ausente ou corrompida.`);
    const seen = new Set();
    for (const row of rows) {
      if (!row || typeof row !== 'object' || Array.isArray(row)) throw new Error(`Backup inválido: registro corrompido em ${storeName}.`);
      const key = row[keyPath];
      if (typeof key !== 'string' || !key.trim()) throw new Error(`Backup inválido: chave ausente em ${storeName}.`);
      if (seen.has(key)) throw new Error(`Backup inválido: chave duplicada em ${storeName}.`);
      seen.add(key);
    }
  }
  const isDate = value => typeof value === 'string' && !Number.isNaN(Date.parse(value));
  const isCount = value => Number.isInteger(Number(value)) && Number(value) >= 0;
  const isPct = value => Number.isFinite(Number(value)) && Number(value) >= 0 && Number(value) <= 100;
  const isQuestionIds = value => Array.isArray(value) && value.every(id => typeof id === 'string' && id.trim()) && new Set(value).size === value.length;
  const knownQuestion = id => typeof id === 'string' && (!state?.qMap?.size || state.qMap.has(id));
  const pctMatches = (actual, numerator, denominator) => {
    const expected = denominator ? Math.round((numerator / denominator) * 1000) / 10 : 0;
    return Math.abs(Number(actual) - expected) < 0.051;
  };
  const validExamDistribution = ids => DISTRIBUTION.every(rule => ids.filter(id => state.qMap.has(id) && rule.match(state.qMap.get(id).area)).length === rule.count);

  for (const a of db.stores.attempts) {
    if (!knownQuestion(a.questionId) || !['A','B','C','D'].includes(a.selected) || !['A','B','C','D'].includes(a.correctAnswer) || typeof a.correct !== 'boolean' || a.correct !== (a.selected === a.correctAnswer) || !['training','exam'].includes(a.mode) || !isDate(a.timestamp)) {
      throw new Error('Backup inválido: histórico de tentativas corrompido.');
    }
  }
  for (const st of db.stores.questionStats) {
    if (!knownQuestion(st.questionId) || !isCount(st.attempts) || !isCount(st.correct) || !isCount(st.wrong) || Number(st.correct) + Number(st.wrong) !== Number(st.attempts)) {
      throw new Error('Backup inválido: estatísticas de questões corrompidas.');
    }
    if (st.lastAttempt != null && !isDate(st.lastAttempt)) throw new Error('Backup inválido: data de estatística corrompida.');
    if (st.lastSelected != null && !['A','B','C','D'].includes(st.lastSelected)) throw new Error('Backup inválido: última alternativa corrompida.');
    if (st.lastCorrect != null && typeof st.lastCorrect !== 'boolean') throw new Error('Backup inválido: status da última resposta corrompido.');
    if (st.correctedAfterError != null && typeof st.correctedAfterError !== 'boolean') throw new Error('Backup inválido: indicador de correção corrompido.');
    if (st.correctAfterError != null && (!isCount(st.correctAfterError) || Number(st.correctAfterError) > Number(st.correct))) throw new Error('Backup inválido: contagem pós-erro corrompida.');
  }
  for (const f of db.stores.favorites) {
    if (!knownQuestion(f.questionId) || (f.savedAt != null && !isDate(f.savedAt))) throw new Error('Backup inválido: favoritas corrompidas.');
  }
  for (const r of db.stores.trainingHistory) {
    if (!isDate(r.startedAt) || !isDate(r.endedAt) || Date.parse(r.endedAt) < Date.parse(r.startedAt) || !isQuestionIds(r.questionIds) || r.questionIds.some(id => !knownQuestion(id)) || !isCount(r.quantity) || !isCount(r.answered) || !isCount(r.correct) || !isCount(r.wrong) || !isPct(r.percent) || !Number.isFinite(Number(r.durationSec)) || Number(r.durationSec) < 0) {
      throw new Error('Backup inválido: histórico de treinos corrompido.');
    }
    if (Number(r.quantity) !== r.questionIds.length || Number(r.correct) + Number(r.wrong) !== Number(r.answered) || Number(r.answered) > Number(r.quantity) || !pctMatches(r.percent, Number(r.correct), Number(r.answered))) throw new Error('Backup inválido: totais do histórico de treinos inconsistentes.');
  }
  for (const r of db.stores.examHistory) {
    if (!isDate(r.startedAt) || !isDate(r.endedAt) || Date.parse(r.endedAt) < Date.parse(r.startedAt) || !isQuestionIds(r.questionIds) || r.questionIds.length !== 30 || r.questionIds.some(id => !knownQuestion(id)) || !isCount(r.correct) || !isCount(r.wrong) || !isCount(r.blanks) || !isPct(r.percent) || !Number.isFinite(Number(r.durationSec)) || Number(r.durationSec) < 0 || !r.answers || typeof r.answers !== 'object' || Array.isArray(r.answers)) {
      throw new Error('Backup inválido: histórico de simulados corrompido.');
    }
    if (Number(r.correct) + Number(r.wrong) + Number(r.blanks) !== 30 || !pctMatches(r.percent, Number(r.correct), 30)) throw new Error('Backup inválido: totais do simulado inconsistentes.');
    if (state?.qMap?.size && !validExamDistribution(r.questionIds)) throw new Error('Backup inválido: distribuição do simulado inconsistente.');
    let calcCorrect = 0, calcWrong = 0;
    for (const [id, letter] of Object.entries(r.answers)) {
      if (!r.questionIds.includes(id) || !['A','B','C','D'].includes(letter)) throw new Error('Backup inválido: respostas do simulado corrompidas.');
      if (state?.qMap?.size) letter === state.qMap.get(id).gabarito ? calcCorrect++ : calcWrong++;
    }
    if (Object.keys(r.answers).length !== Number(r.correct) + Number(r.wrong) || 30 - Object.keys(r.answers).length !== Number(r.blanks)) throw new Error('Backup inválido: respostas e totais do simulado inconsistentes.');
    if (state?.qMap?.size && (calcCorrect !== Number(r.correct) || calcWrong !== Number(r.wrong))) throw new Error('Backup inválido: correção do simulado inconsistente.');
  }
  for (const row of db.stores.activeSessions) {
    if (!['training','exam'].includes(row.type) || !row.data || typeof row.data !== 'object' || Array.isArray(row.data) || (row.savedAt != null && !isDate(row.savedAt))) throw new Error('Backup inválido: sessão ativa corrompida.');
    if (state?.qMap?.size) {
      const valid = row.type === 'training' ? isValidTrainingSession(row.data) : isValidExamSession(row.data);
      if (!valid) throw new Error('Backup inválido: conteúdo da sessão ativa corrompido.');
    }
  }
  return payload;
}

}

function uiStorageRemove() {
  uiSettingsMemoryFallback = '{}';

function escapeStatic(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function el(tag, { className = '', text = '', attrs = {} } = {}, children = []) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key === 'checked') node.checked = Boolean(value);
    else if (key === 'disabled') node.disabled = Boolean(value);
    else node.setAttribute(key, String(value));
  }
  for (const child of children) if (child) node.append(child);
  return node;
}

function formatDate(iso) {
  if (!iso) return '—';
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return '—';
  try { return new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(date); }
  catch { return '—'; }
}

function formatDuration(seconds = 0) {
  const raw = Number(seconds);
  const s = Number.isFinite(raw) ? Math.max(0, Math.floor(raw)) : 0;
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h ? `${h}h ${String(m).padStart(2,'0')}min` : `${m}min ${String(sec).padStart(2,'0')}s`;
}

function formatClock(seconds = 0) {
  const raw = Number(seconds);
  const s = Number.isFinite(raw) ? Math.max(0, Math.floor(raw)) : 0;
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function toast(message, type = '') {

  toastRegion.append(t);
  setTimeout(() => t.remove(), 3300);
}

function confirmModal({ title, message, confirmText = 'Confirmar', danger = false, cancelText = 'Cancelar' }) {
  return new Promise(resolve => {
    if (activeModalCloser) activeModalCloser(false);
    modalRoot.innerHTML = '';
    const previousFocus = document.activeElement;
    const modal = el('div', { className: 'modal', attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-label': title } });
    modal.append(el('h3', { text: title }), el('p', { text: message }));
    const actions = el('div', { className: 'modal-actions' });
    const cancel = el('button', { className: 'btn btn-secondary', text: cancelText, attrs: { type: 'button' } });
    const ok = el('button', { className: `btn ${danger ? 'btn-danger' : 'btn-primary'}`, text: confirmText, attrs: { type: 'button' } });
    let settled = false;
    const close = result => {
      if (settled) return;
      settled = true;
      modalRoot.innerHTML = '';
      modalRoot.onclick = null;
      activeModalCloser = null;
      resolve(result);
      if (previousFocus && typeof previousFocus.focus === 'function' && previousFocus.isConnected) previousFocus.focus();
    };
    activeModalCloser = close;
    cancel.addEventListener('click', () => close(false));
    ok.addEventListener('click', () => close(true));
    modalRoot.onclick = e => { if (e.target === modalRoot) close(false); };
    modal.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const focusable = [...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    actions.append(cancel, ok); modal.append(actions); modalRoot.append(modal); ok.focus();
  });
}

function stopTimer() {
  if (state.timerHandle) clearInterval(state.timerHandle);
  state.timerHandle = null;
}


function isValidTrainingSession(session) {
  if (!session || session.type !== 'training' || session.endedAt || typeof session.id !== 'string' || !session.id.trim() || !Array.isArray(session.questionIds) || !session.questionIds.length) return false;
  const ids = new Set(session.questionIds);
  if (ids.size !== session.questionIds.length || session.questionIds.some(id => !state.qMap.has(id))) return false;
  if (!Number.isInteger(session.index) || session.index < 0 || session.index >= session.questionIds.length) return false;
  if (Number.isNaN(Date.parse(session.startedAt))) return false;
  if (!['selected','confirmed','cut'].every(k => session[k] && typeof session[k] === 'object' && !Array.isArray(session[k]))) return false;
  for (const [id, letter] of Object.entries(session.selected)) if (!ids.has(id) || !['A','B','C','D'].includes(letter)) return false;
  for (const [id, value] of Object.entries(session.confirmed)) {
    const q = state.qMap.get(id);
    if (!ids.has(id) || !q || !value || typeof value !== 'object' || !['A','B','C','D'].includes(value.selected) || typeof value.correct !== 'boolean' || value.correct !== (value.selected === q.gabarito) || (value.confirmedAt != null && Number.isNaN(Date.parse(value.confirmedAt)))) return false;
    if (session.selected[id] !== value.selected) return false;
  }
  for (const [id, letters] of Object.entries(session.cut)) if (!ids.has(id) || !Array.isArray(letters) || letters.some(x => !['A','B','C','D'].includes(x)) || new Set(letters).size !== letters.length) return false;
  return true;
}

function isValidExamSession(session) {
  if (!session || session.type !== 'exam' || session.finishedAt || typeof session.id !== 'string' || !session.id.trim() || !Array.isArray(session.questionIds) || session.questionIds.length !== 30) return false;
  const ids = new Set(session.questionIds);
  if (ids.size !== session.questionIds.length || session.questionIds.some(id => !state.qMap.has(id))) return false;
  if (!Number.isInteger(session.index) || session.index < 0 || session.index >= session.questionIds.length) return false;
  if (Number.isNaN(Date.parse(session.startedAt)) || Number.isNaN(Date.parse(session.endsAt)) || Date.parse(session.endsAt) <= Date.parse(session.startedAt)) return false;
  if (!session.answers || typeof session.answers !== 'object' || Array.isArray(session.answers) || !session.cut || typeof session.cut !== 'object' || Array.isArray(session.cut)) return false;
  for (const [id, letter] of Object.entries(session.answers)) if (!ids.has(id) || !['A','B','C','D'].includes(letter)) return false;
  for (const [id, letters] of Object.entries(session.cut)) if (!ids.has(id) || !Array.isArray(letters) || letters.some(x => !['A','B','C','D'].includes(x)) || new Set(letters).size !== letters.length) return false;
  for (const rule of DISTRIBUTION) {
    const count = session.questionIds.filter(id => rule.match(state.qMap.get(id).area)).length;
    if (count !== rule.count) return false;
  }
  return true;
}

function stopExamDeadline() {
  if (state.examDeadlineHandle) clearTimeout(state.examDeadlineHandle);
  state.examDeadlineHandle = null;
}

function scheduleExamDeadline(session) {
  stopExamDeadline();
  if (!session || session.finishedAt) return;
  const ms = Math.max(0, new Date(session.endsAt).getTime() - Date.now());
  state.examDeadlineHandle = setTimeout(async () => {
    if (!state.activeExam || state.activeExam.id !== session.id || session.finishedAt || session._finishing) return;
    await autoFinishExam(session);
  }, Math.min(ms + 50, 2147483000));
}

async function refreshProgress() {
  [state.statsMap, state.attempts, state.favorites, state.trainingHistory, state.examHistory] = await Promise.all([
    getQuestionStatsMap(), getAttempts(), getFavoritesSet(), getTrainingHistory(), getExamHistory()
  ]);
  state.perf = computePerformance(state.questions, state.attempts, state.statsMap, state.favorites, state.examHistory);
  updatePersistentChrome();
}

function updatePersistentChrome() {
  const loaded = state.questions.length;
  const expected = state.bankReport.reduce((n, x) => n + (x.expected || 0), 0) || 500;
  bankStatusSidebar.textContent = loaded === expected ? `${loaded} questões carregadas` : `${loaded} de ${expected} questões carregadas`;
  const goal = Number(state.ui.dailyGoal || 20);
  const today = state.perf?.todayAnswered || 0;
  todayGoalMini.textContent = `Hoje: ${today} / ${goal} questões`;
}

function setPageMeta(route) {
  const [title, eyebrow] = ROUTES[route] || ['500 Questões', 'Campina Grande-PB • 2026'];
  pageTitle.textContent = title;
  pageEyebrow.textContent = eyebrow;
  document.title = `${title} — 500 Questões Campina Grande-PB 2026`;
  document.querySelectorAll('[data-route]').forEach(btn => {
    const active = btn.dataset.route === route || (route.startsWith('training') && btn.dataset.route === 'train') || (route.startsWith('exam') && btn.dataset.route === 'exam');
    btn.classList.toggle('is-active', active);
  });
}

async function navigate(route) {
  if (activeModalCloser) activeModalCloser(false);
  stopTimer();
  state.route = route;
  setPageMeta(route);
  document.body.classList.remove('menu-open');
  mobileMenuBtn.setAttribute('aria-expanded', 'false');
  app.innerHTML = '';
  app.setAttribute('aria-busy', 'true');
  try {
    switch (route) {
      case 'home': await renderHome(); break;
      case 'train': await renderTrainSetup(); break;
      case 'training-session': await renderTrainingSession(); break;
      case 'training-result': renderTrainingResult(); break;
      case 'exam': await renderExamSetup(); break;
      case 'exam-session': await renderExamSession(); break;
      case 'exam-result': renderExamResult(state.examResult); break;
      case 'exam-review': renderExamReview(state.selectedExamHistory); break;
      case 'errors': await renderSpecialTraining('errors'); break;
      case 'favorites': await renderSpecialTraining('favorites'); break;
      case 'performance': renderPerformance(); break;
      case 'history': renderHistory(); break;
      case 'settings': renderSettings(); break;
      default: await renderHome();
    }
  } catch (error) {
    console.error(error);
    renderFatal('Não foi possível abrir esta tela.', error.message || String(error));
  } finally {
    app.removeAttribute('aria-busy');
    app.focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
}

function renderFatal(title, detail) {
  const box = el('div', { className: 'empty-state' });
  box.append(el('div', { className: 'empty-icon', text: '⚠' }), el('h3', { text: title }), el('p', { text: detail }));
  app.append(box);
}

function makeStat(label, value, note = '') {
  const card = el('div', { className: 'stat-card' });
  card.append(el('div', { className: 'stat-label', text: label }), el('div', { className: 'stat-value', text: value }));
  if (note) card.append(el('div', { className: 'stat-note', text: note }));
  return card;
}

function button(text, className, onClick) {
  const b = el('button', { className: `btn ${className}`, text, attrs: { type: 'button' } });
  b.addEventListener('click', onClick);
  return b;
}

function areaIcon(area) {
  const code = areaCode(area);
  return ({ POR: 'P', INF: 'I', RAC: 'R', LEG: 'L', HIS: 'H' })[code] || '•';
}

function makeSelect(label, name, options, value = '', allLabel = 'Todos') {
  const field = el('div', { className: 'form-field' });
  const lab = el('label', { text: label, attrs: { for: name } });
  const select = el('select', { className: 'select', attrs: { id: name, name } });
  const all = el('option', { text: allLabel, attrs: { value: '' } }); select.append(all);
  for (const [val, text] of options) {
    const op = el('option', { text, attrs: { value: val } });
    if (val === value) op.selected = true;
    select.append(op);
  }
  field.append(lab, select); return { field, select };
}

async function renderTrainSetup() {
  await refreshProgress();
  const preset = state.trainPreset || { mode: 'personalizado', filters: {}, amount: 10 };
  state.trainPreset = null;
  await renderTrainingBuilder({
    title: preset.mode === 'rapido' ? 'Treino rápido' : 'Treino personalizado',
    description: preset.mode === 'rapido' ? 'Escolha a quantidade e, se quiser, refine os filtros antes de começar.' : 'Combine matéria, tema, subtema, dificuldade e seu histórico.',
    initialFilters: preset.filters || {},
    initialAmount: preset.amount || 10,
    mode: preset.mode || 'personalizado'
  });
}

async function renderSpecialTraining(kind) {
  await refreshProgress();
  const isErrors = kind === 'errors';

  if (isErrors) {
    const errorRows = state.questions
      .map(q => ({ q, stat: state.statsMap[q.id] }))
      .filter(x => Number(x.stat?.wrong || 0) > 0)
      .sort((a,b) => String(b.stat.lastAttempt || '').localeCompare(String(a.stat.lastAttempt || '')));
    const overview = el('section', { className: 'card section' });
    overview.append(el('h2', { text: 'Histórico dos meus erros' }), el('p', { className: 'section-subtitle', text: 'O histórico não desaparece quando você acerta depois. Questões corrigidas continuam disponíveis para revisão.' }));
    if (!errorRows.length) {
      overview.append(emptyState('✓', 'Você ainda não possui questões erradas', 'Continue treinando. Quando houver um erro, a questão aparecerá aqui automaticamente.'));
    } else {
      const list = el('div', { className: 'list', attrs: { style: 'margin-top:14px' } });
      for (const { q, stat } of errorRows.slice(0, 10)) {
        const corrected = Boolean(stat.correctedAfterError);
        const after = Number(stat.correctAfterError || (corrected ? 1 : 0));
        list.append(el('div', { className: 'list-item' }, [
          el('div', { className: 'list-item-main' }, [
            el('div', { className: 'list-item-title', text: `${q.id} • ${q.tema}` }),
            el('div', { className: 'list-item-sub', text: `${stat.attempts} tentativa(s) • ${stat.wrong} erro(s) • ${after} acerto(s) após erro • última: ${formatDate(stat.lastAttempt)}` })
          ]),
          el('span', { className: `chip ${corrected ? 'easy' : 'hard'}`, text: corrected ? 'Erro corrigido' : 'Revisar' })
        ]));
      }
      if (errorRows.length > 10) list.append(el('div', { className: 'field-hint', text: `Mostrando as 10 mais recentes de ${errorRows.length} questões com erro.` }));
      overview.append(list);
    }
    app.append(overview);
  }

  await renderTrainingBuilder({
    title: isErrors ? 'Treinar meus erros' : 'Treinar favoritas',
    description: isErrors ? 'Questões que você já errou permanecem aqui mesmo depois de um acerto posterior.' : 'Monte uma sessão apenas com questões que você favoritou.',
    initialFilters: isErrors ? { status: 'erradas' } : { onlyFavorites: true },
    initialAmount: 10,
    mode: isErrors ? 'meus-erros' : 'favoritas',
    lockStatus: isErrors ? 'erradas' : null,
    lockFavorites: !isErrors
  });
}

async function renderTrainingBuilder({ title, description, initialFilters = {}, initialAmount = 10, mode = 'personalizado', lockStatus = null, lockFavorites = false }) {
  const section = el('section', { className: 'card section' });
  section.append(el('div', { className: 'section-head' }, [el('div', {}, [el('h2', { text: title }), el('p', { text: description })])]));
  if (state.activeTraining) {
    section.append(el('div', { className: 'alert alert-info' }, [
      el('span', { text: `Há um treino em andamento (${state.activeTraining.questionIds.length} questões). Você pode continuá-lo ou iniciar outro, descartando a sessão atual.` }),
      button('Continuar treino', 'btn-secondary btn-sm', () => navigate('training-session'))
    ]));
  }
  const form = el('div', { className: 'form-grid' });

  let filters = { area: '', tema: '', subtema: '', dificuldade: '', status: '', onlyFavorites: false, search: '', ...initialFilters };
  if (lockStatus) filters.status = lockStatus;
  if (lockFavorites) filters.onlyFavorites = true;

  const options = getFilterOptions(state.questions, filters);
  const area = makeSelect('Matéria', 'filterArea', options.areas.map(v => [v, displayArea(v)]), filters.area);
  const tema = makeSelect('Tema', 'filterTema', options.temas.map(v => [v, v]), filters.tema);
  const subtema = makeSelect('Subtema', 'filterSubtema', options.subtemas.map(v => [v, v]), filters.subtema);
  const dificuldade = makeSelect('Dificuldade', 'filterDifficulty', [['facil','Fácil'],['intermediaria','Intermediária'],['dificil','Difícil']], filters.dificuldade);
  const status = makeSelect('Histórico', 'filterStatus', [['respondidas','Respondidas'],['nao-respondidas','Não respondidas'],['corretas','Corretas na última tentativa'],['erradas','Já erradas']], filters.status);
  if (lockStatus) status.select.disabled = true;

  const favField = el('div', { className: 'form-field' });
  favField.append(el('label', { text: 'Favoritas' }));
  const checkWrap = el('label', { className: 'inline-check' });
  const favCheck = el('input', { attrs: { type: 'checkbox', checked: filters.onlyFavorites, disabled: lockFavorites } });
  checkWrap.append(favCheck, el('span', { text: 'Somente questões favoritas' })); favField.append(checkWrap);

  const searchField = el('div', { className: 'form-field full' });
  searchField.append(el('label', { text: 'Pesquisar no banco', attrs: { for: 'filterSearch' } }));
  const searchInput = el('input', { className: 'input', attrs: { id: 'filterSearch', type: 'search', placeholder: 'ID, tema, subtema, palavra do enunciado ou tag' } });

      tema: tema.select.value,
      subtema: subtema.select.value,

      status: lockStatus || status.select.value,
      onlyFavorites: lockFavorites || favCheck.checked,
      search: searchInput.value.trim()
    };
    return filters;
  }

  function updateDependentOptions() {
    const areaValue = area.select.value;
    const currentTheme = tema.select.value;
    const currentSubtheme = subtema.select.value;
    const refill = (select, values, currentVal) => {
      const firstText = select.options[0]?.textContent || 'Todos';
      select.innerHTML = '';
      select.append(el('option', { text: firstText, attrs: { value: '' } }));
      for (const v of values) {
        const op = el('option', { text: v, attrs: { value: v } });
        if (v === currentVal) op.selected = true;
        select.append(op);
      }
      if (![...select.options].some(o => o.value === currentVal)) select.value = '';
    };

    const themeOptions = getFilterOptions(state.questions, { area: areaValue }).temas;
    refill(tema.select, themeOptions, currentTheme);
    const effectiveTheme = tema.select.value;
    const subthemeOptions = getFilterOptions(state.questions, { area: areaValue, tema: effectiveTheme }).subtemas;
    refill(subtema.select, subthemeOptions, currentSubtheme);
  }

  function computeEligible() {
    readFilters();
    return applyQuestionFilters(state.questions, filters, state.statsMap, state.favorites);
  }

  function update() {
    const eligible = computeEligible();
    let n = Number(amountInput.value);
    availableStrong.textContent = String(eligible.length);
    amountInput.max = String(Math.max(1, eligible.length));
    if (eligible.length > 0 && Number.isInteger(n) && n > eligible.length) {
      amountInput.value = String(eligible.length);
      n = eligible.length;
    }
    startBtn.disabled = eligible.length === 0 || !Number.isInteger(n) || n < 1 || n > eligible.length;
    searchPreview.innerHTML = '';

      searchPreview.append(el('div', { className: 'empty-state compact' }, [
        el('div', { className: 'empty-icon', text: '⌕' }),
        el('h3', { text: 'Nenhuma questão encontrada' }),

      ]));

      }
      if (eligible.length > 8) wrap.append(el('div', { className: 'field-hint', text: `+ ${eligible.length - 8} outros resultados` }));
      searchPreview.append(wrap);
    }
  }

  area.select.addEventListener('change', () => {
    tema.select.value = '';
    subtema.select.value = '';
    filters.tema = '';
    filters.subtema = '';
    updateDependentOptions();
    update();
  });
  tema.select.addEventListener('change', () => {
    subtema.select.value = '';
    filters.subtema = '';
    updateDependentOptions();
    update();
  });
  subtema.select.addEventListener('change', update);
  dificuldade.select.addEventListener('change', update);
  status.select.addEventListener('change', update);
  favCheck.addEventListener('change', update);
  searchInput.addEventListener('input', update);
  amountInput.addEventListener('input', () => {
    const eligible = computeEligible();
    const n = Number(amountInput.value);
    startBtn.disabled = eligible.length === 0 || !Number.isInteger(n) || n < 1 || n > eligible.length;
  });
  updateDependentOptions(); update();
}

}

  const cols=el('section',{className:'two-col section'});const areas=el('div',{className:'card'});areas.append(el('h3',{text:'Desempenho por matéria'}));if(!p.byArea.length)areas.append(el('p',{text:'Resolva algumas questões para começar a formar seu painel.'}));else p.byArea.forEach(r=>areas.append(performanceRow(r.label,r.percent,`${r.attempts} tent.`)));

  const themes=el('section',{className:'card section'});themes.append(el('h3',{text:'Desempenho por tema'}));if(!p.byTheme.length)themes.append(el('p',{text:'Ainda não há dados por tema.'}));else p.byTheme.slice().sort((a,b)=>b.attempts-a.attempts).slice(0,30).forEach(r=>themes.append(performanceRow(`${r.areaLabel} — ${r.theme}`,r.percent,`${r.attempts} tent.`)));app.append(themes);

function renderHistory() {
  const training=el('section',{className:'card section'});training.append(el('h2',{text:'Histórico de treinos'}));if(!state.trainingHistory.length)training.append(emptyState('≡','Nenhum treino concluído','Seus treinos recentes aparecerão aqui.'));else{const tableWrap=el('div',{className:'table-wrap',attrs:{style:'margin-top:14px'}});const table=document.createElement('table');table.innerHTML='<thead><tr><th>Data</th><th>Modo</th><th>Questões</th><th>Acertos</th><th>Percentual</th><th>Duração</th></tr></thead>';const tbody=document.createElement('tbody');for(const r of state.trainingHistory){const tr=document.createElement('tr');[formatDate(r.endedAt),r.mode,r.quantity,`${r.correct}/${r.answered}`,`${r.percent}%`,formatDuration(r.durationSec)].forEach(v=>tr.append(el('td',{text:String(v)})));tbody.append(tr);}table.append(tbody);tableWrap.append(table);training.append(tableWrap);}app.append(training);
  const exams=el('section',{className:'card section'});exams.append(el('h2',{text:'Histórico de simulados'}));if(!state.examHistory.length)exams.append(emptyState('◷','Nenhum simulado realizado','Quando você finalizar um simulado, o resultado ficará salvo aqui.'));else{const list=el('div',{className:'list',attrs:{style:'margin-top:14px'}});for(const r of state.examHistory){const item=el('div',{className:'list-item'});item.append(el('div',{className:'list-item-main'},[el('div',{className:'list-item-title',text:`${r.percent}% • ${r.correct} acertos`}),el('div',{className:'list-item-sub',text:`${formatDate(r.endedAt)} • ${r.blanks} em branco • ${formatDuration(r.durationSec)}`})]),button('Abrir resultado','btn-secondary btn-sm',()=>{state.selectedExamHistory=r;navigate('exam-review');}));list.append(item);}exams.append(list);}app.append(exams);

function emptyState(icon,title,text) { const e=el('div',{className:'empty-state'});e.append(el('div',{className:'empty-icon',text:icon}),el('h3',{text:title}),el('p',{text}));return e; }

function renderSettings() {
  const data=el('section',{className:'card section'});data.append(el('h2',{text:'Backup do progresso'}),el('p',{className:'section-subtitle',text:'Seu progresso fica neste navegador. Exporte um backup para restaurar em outro momento ou dispositivo.'}));
  const actions=el('div',{className:'hero-actions'});actions.append(button('Exportar backup','btn-primary',async()=>{try{await downloadBackup();toast('Backup exportado.','success');}catch(e){toast(e.message,'error');}}));
  const importLabel=el('label',{className:'btn btn-secondary',text:'Importar backup'});const input=el('input',{attrs:{type:'file',accept:'application/json,.json',style:'display:none'}});importLabel.append(input);input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const payload=await parseBackupFile(file);if(await confirmModal({title:'Restaurar backup?',message:'Os dados atuais deste navegador serão substituídos pelos dados do arquivo.',confirmText:'Restaurar'})){await restoreBackup(payload);state.ui=getUiSettings();state.activeTraining=await getActiveSession('training');state.activeExam=await getActiveSession('exam');if(state.activeTraining&&!isValidTrainingSession(state.activeTraining)){await clearActiveSession('training');state.activeTraining=null;}if(state.activeExam&&!isValidExamSession(state.activeExam)){await clearActiveSession('exam');state.activeExam=null;}if(state.activeExam)scheduleExamDeadline(state.activeExam);await refreshProgress();toast('Backup restaurado.','success');navigate('home');}}catch(e){toast(e.message,'error');}finally{input.value='';}});actions.append(importLabel);data.append(actions);app.append(data);

  const prefs=el('section',{className:'card section'});prefs.append(el('h2',{text:'Preferências'}),el('p',{className:'section-subtitle',text:'O modo claro/escuro segue automaticamente a configuração do seu sistema.'}));const field=el('div',{className:'form-field',attrs:{style:'max-width:360px;margin-top:16px'}});field.append(el('label',{text:'Meta diária de questões',attrs:{for:'dailyGoal'}}));const goal=el('input',{className:'input',attrs:{id:'dailyGoal',type:'number',min:'1',max:'500',step:'1'}});goal.value=String(state.ui.dailyGoal||20);field.append(goal,el('div',{className:'field-hint',text:'Conta tentativas respondidas no dia.'}));goal.addEventListener('change',()=>{const value=Math.max(1,Math.min(500,Number(goal.value)||20));goal.value=String(value);state.ui=setUiSetting('dailyGoal',value);updatePersistentChrome();toast('Meta diária atualizada.');});prefs.append(field);app.append(prefs);

  const danger=el('section',{className:'card section'});danger.append(el('h2',{text:'Zerar progresso'}),el('p',{className:'section-subtitle',text:'Apaga respostas, histórico, favoritas, simulados e sessões ativas deste navegador.'}),el('div',{className:'hero-actions'},[button('Zerar todo o progresso','btn-danger',async()=>{if(await confirmModal({title:'Zerar todo o progresso?',message:'Esta ação apagará seu histórico, respostas, favoritas e simulados deste navegador. Deseja continuar?',confirmText:'Sim, apagar tudo',danger:true})){await resetAllProgress();state.ui=getUiSettings();state.activeTraining=null;state.activeExam=null;stopExamDeadline();state.trainingResult=null;state.examResult=null;await refreshProgress();toast('Progresso zerado.');navigate('home');}})]));app.append(danger);
}

function attachGlobalNavigation() {
  document.querySelectorAll('[data-route]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.route)));
  mobileMenuBtn.addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');mobileMenuBtn.setAttribute('aria-expanded',String(open));});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('menu-open');mobileMenuBtn.setAttribute('aria-expanded','false');if(activeModalCloser)activeModalCloser(false);}});
}

async function bootstrap() {
  app.innerHTML='<div class="skeleton" style="height:180px"></div><div class="stat-grid section" style="margin-top:14px"><div class="skeleton" style="height:110px"></div><div class="skeleton" style="height:110px"></div><div class="skeleton" style="height:110px"></div></div>';
  attachGlobalNavigation();
  try {
    await initDB();
    const loaded=await loadQuestionBank();state.questions=loaded.questions;state.bankReport=loaded.report;state.qMap=new Map(state.questions.map(q=>[q.id,q]));
    state.activeTraining=await getActiveSession('training');state.activeExam=await getActiveSession('exam');
    if(state.activeTraining&&!isValidTrainingSession(state.activeTraining)){await clearActiveSession('training');state.activeTraining=null;console.warn('Sessão de treino inválida foi descartada.');}
    if(state.activeExam&&!isValidExamSession(state.activeExam)){await clearActiveSession('exam');state.activeExam=null;console.warn('Sessão de simulado inválida foi descartada.');}
    if(state.activeExam)scheduleExamDeadline(state.activeExam);
    await refreshProgress();
    const invalid=state.bankReport.reduce((n,r)=>n+(r.invalid||0),0);const failed=state.bankReport.filter(r=>!r.loaded);
    if(invalid)toast(`${invalid} questão(ões) inválida(s) foram ignoradas.`,'error');
    if(failed.length)toast(`Não foi possível carregar ${failed.length} banco(s).`,'error');
    await navigate('home');
  } catch(error) {
    console.error(error);
    app.innerHTML='';
    const msg=location.protocol==='file:' ? 'Não foi possível acessar o armazenamento local deste navegador. Tente abrir o arquivo em outro navegador ou publique o index.html em uma hospedagem estática, como GitHub Pages.' : (error.message||String(error));
    renderFatal('Falha ao iniciar a plataforma',msg);
  }
}

bootstrap();
